name: Apply GOST Stage2 next patch

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/apply-gost-stage2-next.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply integrated Stage 2 patch
        run: |
          python3 build/fix-gost-stage2-patcher.py
          python3 build/apply-gost-stage2-next.py
          rm -f build/fix-gost-stage2-patcher.py

      - name: Commit integrated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gost): add firefox client cert selection path"
          git push origin HEAD:agent/gost-tls-poc
          for branch in agent/gost-stage2-next-temp agent/gost-stage2-next-temp2 agent/gost-stage2-next-temp3 agent/gost-stage2-next-temp4 agent/gost-stage2-next-temp5; do
            git push origin --delete "$branch" || true
          done

      - name: Dispatch GOST builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gost-ssl-compile-check.yml --ref agent/gost-tls-poc
          gh workflow run gost-poc-build.yml --ref agent/gost-tls-poc
          gh workflow run gost-poc-build-thunk.yml --ref agent/gost-tls-poc
