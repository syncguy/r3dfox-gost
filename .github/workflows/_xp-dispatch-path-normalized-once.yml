name: "One-shot dispatch path-normalized XP x32 build"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - .github/workflows/_xp-dispatch-path-normalized-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch XP x32 workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run gost-poc-build-xp-x32.yml --repo "$GITHUB_REPOSITORY" --ref agent/winrt-source-poc

      - name: Remove one-shot dispatcher
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/_xp-dispatch-path-normalized-once.yml'
          info=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=agent/winrt-source-poc")
          sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"$info")
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: remove one-shot XP path-normalized dispatcher' \
            -f branch='agent/winrt-source-poc' \
            -f sha="$sha" >/dev/null
