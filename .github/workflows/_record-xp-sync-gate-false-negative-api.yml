name: "One-shot record XP sync gate false negative via API"

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - .github/workflows/_record-xp-sync-gate-false-negative-api.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/gost-tls-poc
    steps:
      - name: Prepend experiment record through Contents API
        shell: bash
        run: |
          set -euo pipefail
          path='docs/gost/TEST_LOG.md'
          gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$TARGET_BRANCH" > /tmp/file.json
          python3 - <<'PY'
          import base64, json
          obj=json.load(open('/tmp/file.json'))
          text=base64.b64decode(obj['content']).decode('utf-8')
          marker='---\n\n'
          pos=text.index(marker)+len(marker)
          entry='''## 2026-09-01 — full XP x32 synchronization transfer run 33477985342 stopped by a path-normalization false negative\n\nTrack: Windows XP x86 binary compatibility only; this is not GOST TLS runtime/handshake evidence.\n\nExact experiment identity:\n\n- branch `agent/winrt-source-poc`;\n- source-under-test `1a6e0939bde5a9d601d7abca6a09f5ad33879ce6`;\n- workflow `GOST TLS PoC build XP x32`;\n- Actions run `33477985342`, job `99761172519`;\n- run/job conclusion: **failure** at step 21, `Patch core browser linkers for XP x86 compatibility layer`.\n\nObservation: the generated `xp-x32-core-linker-patch.diff` was structurally correct. It injected the narrow provider into `r3dfox.exe`, `plugin-container.exe`, and `mozglue.dll`, and injected `synchronization.lib` plus the same narrow provider into the `xul.dll` link. The run stopped only in the post-patch sanity check with `Expected compatibility linker input missing from generated patch`.\n\nRoot cause: the attempted PowerShell normalization used `.Replace('\\\\', '/')`. PowerShell does not use backslash as a string escape, so that expression searches for two consecutive backslashes while the environment paths contain single Windows separators. The generated diff already contains forward slashes. This produced a false-negative string comparison and does **not** disprove the ten-API linker architecture.\n\nCorrection: full-workflow commit `1d3060bd186fe29e2ad17f85f3e573bfd9d74305` changes all three sanity-check normalizations to regex `-replace '\\\\', '/'`, which matches one literal Windows backslash. A new full run was dispatched from descendant source `d2f15ee8f0cef8112855c4306014865e422319d3`: run `33479649627`, job `99766203250`. The next decisive points remain step 21 passing and, after the Firefox build, step 28 `GATE - Reject core browser synchronization direct imports`.\n\nStatus: **false-negative gate defect characterized and corrected; full Firefox ten-API integration remains unproven until run 33479649627 reaches the post-build synchronization import gate.**\n\n---\n\n'''
          if 'run 33477985342 stopped by a path-normalization false negative' in text:
              raise SystemExit('record already present')
          patched=text[:pos]+entry+text[pos:]
          open('/tmp/patched.md','w',encoding='utf-8',newline='').write(patched)
          open('/tmp/blobsha','w').write(obj['sha'])
          PY
          content=$(base64 -w0 /tmp/patched.md)
          sha=$(cat /tmp/blobsha)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='docs(gost): log XP linker gate false negative' \
            -f branch="$TARGET_BRANCH" \
            -f sha="$sha" \
            -f content="$content" >/dev/null
