name: msvcr14x Rust YY XP x86 coexistence smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/msvcr14x-rust-yy-xp-x86-coexistence-smoke.yml"

permissions:
  contents: read

env:
  YY_THUNKS_VERSION: "1.2.2"
  YY_THUNKS_TARGET: "5.1.2600.0"
  WINDOWS_XP_SUBSYSTEM: "5.01"

jobs:
  winrt-delay-smoke:
    name: YY-Thunks WinRT delay-load closing smoke / x86
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @(
            "repo=$env:GITHUB_REPOSITORY"
            "test_commit=$env:GITHUB_SHA"
            "compatibility_target=Windows 7 x86 / XP-capable YY provider"
            "yy_thunks_version=$env:YY_THUNKS_VERSION"
            "yy_thunks_target=$env:YY_THUNKS_TARGET"
          ) | Set-Content -Encoding utf8 diagnostics\identity.txt
          (Get-Command cl.exe).Source | Set-Content -Encoding utf8 diagnostics\cl-path.txt
          (Get-Command link.exe).Source | Set-Content -Encoding utf8 diagnostics\link-path.txt

      - name: Download compact YY-Thunks object package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -eq 'YY-Thunks-Objs.zip' } | Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Objs asset not found" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-objs'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root
          Get-ChildItem -Path $root -Recurse -File |
            Where-Object { $_.Name -match 'RoActivateInstance|RoGetActivationFactory|WindowsCompareStringOrdinal|WindowsCreateString|WindowsDeleteString|WindowsGetStringRawBuffer|YY_Thunks_for_' } |
            Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 320 |
            Set-Content -Encoding utf8 diagnostics\yy-object-candidates.txt
          "YY_OBJS_ROOT=$root" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "yy_objs_asset=$($asset.name) size=$($asset.size) digest=$($asset.digest)" | Add-Content -Encoding utf8 diagnostics\identity.txt

      - name: Build narrow YY WinRT provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'yy-winrt-delay-smoke'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $work | Out-Null

          $allFiles = @(Get-ChildItem -Path $env:YY_OBJS_ROOT -Recurse -File)
          function Resolve-Object([string]$api, [string]$extension) {
            $pattern = '^_' + [regex]::Escape($api) + '@[0-9]+\.' + [regex]::Escape($extension) + '$'
            $matches = @($allFiles | Where-Object { $_.Name -match $pattern })
            if ($matches.Count -eq 0) { throw "YY Objs package has no $api .$extension object" }
            $runtimeMatches = @($matches | Where-Object { $_.FullName -match '(?i)runtimeobject\.lib_WeakAlias' })
            if ($runtimeMatches.Count -eq 1) { return $runtimeMatches[0] }
            $hashGroups = @($matches | ForEach-Object {
              [pscustomobject]@{ File=$_; Hash=(Get-FileHash -Algorithm SHA256 $_.FullName).Hash }
            } | Group-Object Hash)
            if ($hashGroups.Count -eq 1) { return $matches[0] }
            $detail = ($matches | ForEach-Object { $_.FullName }) -join '; '
            throw ("Ambiguous YY object for {0} .{1}: {2}" -f $api, $extension, $detail)
          }

          $apis = @(
            'RoActivateInstance','RoGetActivationFactory',
            'WindowsCompareStringOrdinal','WindowsCreateString','WindowsCreateStringReference',
            'WindowsDeleteString','WindowsGetStringRawBuffer'
          )
          $objects = [System.Collections.Generic.List[string]]::new()
          $mapping = [System.Collections.Generic.List[string]]::new()
          foreach ($api in $apis) {
            foreach ($kind in @('obj','obi')) {
              $choice = Resolve-Object $api $kind
              $objects.Add($choice.FullName)
              $mapping.Add("$api-$kind|$($choice.FullName)|$((Get-FileHash -Algorithm SHA256 $choice.FullName).Hash)")
            }
          }

          $implementationName = "YY_Thunks_for_$env:YY_THUNKS_TARGET.obj"
          $implementationMatches = @($allFiles | Where-Object { $_.Name -ieq $implementationName -and $_.FullName -match '(?i)[\\/]x86[\\/]' })
          if ($implementationMatches.Count -ne 1) {
            $detail = ($implementationMatches | ForEach-Object { $_.FullName }) -join '; '
            throw "Expected one x86 $implementationName; found $($implementationMatches.Count): $detail"
          }
          $objects.Add($implementationMatches[0].FullName)
          $mapping.Add("implementation|$($implementationMatches[0].FullName)|$((Get-FileHash -Algorithm SHA256 $implementationMatches[0].FullName).Hash)")
          $mapping | Set-Content -Encoding utf8 diagnostics\yy-winrt-selected-members.txt

          $provider = Join-Path $work 'yy-xp-winrt-provider.lib'
          & lib.exe /nologo "/out:$provider" @($objects)
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $provider)) { throw 'Failed to build narrow YY WinRT provider' }
          $symbols = (& dumpbin.exe /nologo /linkermember:1 $provider 2>&1 | Out-String)
          $symbols | Set-Content -Encoding utf8 diagnostics\yy-winrt-provider-symbols.txt
          foreach ($api in $apis) {
            if ($symbols.IndexOf("YY_Thunks_$api", [System.StringComparison]::Ordinal) -lt 0) { throw "Narrow provider missing YY_Thunks_$api" }
          }
          if ($symbols.IndexOf('YY_Thunks_LockResource', [System.StringComparison]::Ordinal) -ge 0) { throw 'Narrow provider unexpectedly exposes unrelated LockResource thunk' }
          "WINRT_WORK=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "YY_WINRT_PROVIDER=$provider" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate lld-link and Windows SDK delay-import inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $lld = if ($cmd) { $cmd.Source } else { 'C:\Program Files\LLVM\bin\lld-link.exe' }
          if (-not (Test-Path $lld)) { throw "lld-link.exe not found: $lld" }

          function Resolve-SdkLib([string]$name) {
            foreach ($dir in ($env:LIB -split ';')) {
              if (-not $dir) { continue }
              $candidate = Join-Path $dir $name
              if (Test-Path $candidate) { return (Resolve-Path $candidate).Path }
            }
            $sdkLibRoot = Join-Path $env:WindowsSdkDir 'Lib'
            $found = Get-ChildItem -Path $sdkLibRoot -Recurse -File -Filter $name -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '(?i)[\\/]x86\\' } | Select-Object -First 1
            if ($found) { return $found.FullName }
            throw "Cannot resolve Windows SDK library $name"
          }

          $sdkWinrt = Resolve-SdkLib 'api-ms-win-core-winrt-l1-1-0.lib'
          $sdkString = Resolve-SdkLib 'api-ms-win-core-winrt-string-l1-1-0.lib'
          $delayimp = Resolve-SdkLib 'delayimp.lib'
          $kernel32 = Resolve-SdkLib 'kernel32.lib'
          @(
            "lld_link=$lld"
            "sdk_winrt=$sdkWinrt"
            "sdk_winrt_string=$sdkString"
            "delayimp=$delayimp"
            "kernel32=$kernel32"
          ) | Set-Content -Encoding utf8 diagnostics\resolved-link-inputs.txt
          "REAL_LLD_LINK=$lld" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SDK_WINRT_LIB=$sdkWinrt" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SDK_WINRT_STRING_LIB=$sdkString" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DELAYIMP_LIB=$delayimp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SDK_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile exact WinRT API reference probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:WINRT_WORK 'winrt-probe.cpp'
          $obj = Join-Path $env:WINRT_WORK 'winrt-probe.obj'
          @'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <roapi.h>
          #include <winstring.h>
          extern "C" __declspec(dllexport) HRESULT __stdcall winrt_probe() {
            static const wchar_t kClassName[] = L"r3dfox.gost.yy.winrt.probe";
            const UINT32 length = static_cast<UINT32>((sizeof(kClassName) / sizeof(kClassName[0])) - 1);
            HSTRING value = nullptr;
            HSTRING reference = nullptr;
            HSTRING_HEADER header{};
            UINT32 rawLength = 0;
            INT32 comparison = 1;
            IInspectable* instance = nullptr;
            IID iid{};
            void* factory = nullptr;
            HRESULT result = WindowsCreateString(kClassName, length, &value);
            result ^= WindowsCompareStringOrdinal(value, value, &comparison);
            result ^= WindowsCreateStringReference(kClassName, length, &header, &reference);
            result ^= RoActivateInstance(value, &instance);
            result ^= RoGetActivationFactory(value, iid, &factory);
            result ^= WindowsGetStringRawBuffer(value, &rawLength) != nullptr ? S_OK : S_FALSE;
            result ^= WindowsDeleteString(reference);
            result ^= WindowsDeleteString(value);
            return result ^ static_cast<HRESULT>(rawLength) ^ comparison;
          }
          '@ | Set-Content -Encoding utf8 $src
          & cl.exe /nologo /c /O2 /GS- /GR- /Zl /std:c++20 $src "/Fo:$obj" 2>&1 | Tee-Object -FilePath diagnostics\winrt-probe-compile.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $obj)) { throw "WinRT probe compile failed: $LASTEXITCODE" }
          (& dumpbin.exe /nologo /symbols $obj 2>&1 | Out-String) | Set-Content -Encoding utf8 diagnostics\winrt-probe-symbols.txt
          "WINRT_PROBE_OBJ=$obj" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: GATE - Baseline reproduces both WinRT delay-import groups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:WINRT_WORK 'baseline-delay.dll'
          $map = Join-Path $env:WINRT_WORK 'baseline-delay.map'
          $args = @(
            '/nologo','/dll','/noentry','/nodefaultlib','/machine:x86',"/subsystem:windows,$env:WINDOWS_XP_SUBSYSTEM",'/out:' + $dll,'/map:' + $map,
            $env:WINRT_PROBE_OBJ,$env:SDK_WINRT_LIB,$env:SDK_WINRT_STRING_LIB,$env:DELAYIMP_LIB,$env:SDK_KERNEL32_LIB,
            '/delayload:api-ms-win-core-winrt-l1-1-0.dll','/delayload:api-ms-win-core-winrt-string-l1-1-0.dll'
          )
          & $env:REAL_LLD_LINK @args 2>&1 | Tee-Object -FilePath diagnostics\baseline-delay-link.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dll)) { throw "Baseline delay-load link failed: $LASTEXITCODE" }
          $raw = (& dumpbin.exe /nologo /imports $dll 2>&1 | Out-String)
          $raw | Set-Content -Encoding utf8 diagnostics\baseline-delay-imports.txt
          foreach ($name in @(
            'api-ms-win-core-winrt-l1-1-0.dll','api-ms-win-core-winrt-string-l1-1-0.dll',
            'RoActivateInstance','RoGetActivationFactory','WindowsCompareStringOrdinal','WindowsCreateString',
            'WindowsCreateStringReference','WindowsDeleteString','WindowsGetStringRawBuffer'
          )) {
            if ($raw.IndexOf($name, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) { throw "Baseline imports missing $name" }
          }

      - name: GATE - Narrow YY provider eliminates both WinRT delay-import groups
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:WINRT_WORK 'thunked-winrt.dll'
          $map = Join-Path $env:WINRT_WORK 'thunked-winrt.map'
          $args = @(
            '/nologo','/dll','/noentry','/nodefaultlib','/machine:x86',"/subsystem:windows,$env:WINDOWS_XP_SUBSYSTEM",'/out:' + $dll,'/map:' + $map,
            $env:WINRT_PROBE_OBJ,$env:YY_WINRT_PROVIDER,$env:SDK_WINRT_LIB,$env:SDK_WINRT_STRING_LIB,$env:DELAYIMP_LIB,$env:SDK_KERNEL32_LIB,
            '/delayload:api-ms-win-core-winrt-l1-1-0.dll','/delayload:api-ms-win-core-winrt-string-l1-1-0.dll'
          )
          & $env:REAL_LLD_LINK @args 2>&1 | Tee-Object -FilePath diagnostics\thunked-winrt-link.log
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $dll)) { throw "Thunked WinRT link failed: $LASTEXITCODE" }
          $raw = (& dumpbin.exe /nologo /imports $dll 2>&1 | Out-String)
          $raw | Set-Content -Encoding utf8 diagnostics\thunked-winrt-imports.txt
          foreach ($targetDll in @('api-ms-win-core-winrt-l1-1-0.dll','api-ms-win-core-winrt-string-l1-1-0.dll')) {
            if ($raw.IndexOf($targetDll, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Thunked PE still contains target WinRT delay-load DLL $targetDll" }
          }
          $mapText = Get-Content $map -Raw
          foreach ($api in @(
            'RoActivateInstance','RoGetActivationFactory','WindowsCompareStringOrdinal','WindowsCreateString',
            'WindowsCreateStringReference','WindowsDeleteString','WindowsGetStringRawBuffer'
          )) {
            if ($mapText.IndexOf("YY_Thunks_$api", [System.StringComparison]::Ordinal) -lt 0) { throw "Final map did not select YY_Thunks_$api" }
          }
          & dumpbin.exe /nologo /headers $dll 2>&1 | Set-Content -Encoding utf8 diagnostics\thunked-winrt-headers.txt

      - name: Upload WinRT closing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yy-winrt-delay-smoke-diagnostics
          path: diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## YY-Thunks WinRT delay-load closing smoke" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source: $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Uses compact YY-Thunks-Objs.zip and extracts only seven direct/import aliases plus the common x86 implementation object." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Baseline must reproduce the two exact xul WinRT API-set delay-import groups." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Thunked candidate must select all seven YY_Thunks_* symbols and remove both target API-set DLLs from final PE imports." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- This is linker/import evidence only; physical Win7 remains the runtime gate." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
