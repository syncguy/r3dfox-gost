# offline bootstrap revision 2
name: Repair legacy Gosuslugi XPI

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/repair-legacy-gosuslugi-xpi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Reconstruct exact uploaded XPI and replace fallback
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      XPI_ID: pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru
      XPI_SHA256: 72916b4ed2adefd91049fbd93aff5e028c423c971c2e0012603a2dae343bdc80
      XPI_PATH: r3dfox\extensions\pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru.xpi

    steps:
      - name: Checkout required files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            build
            r3dfox/extensions
          sparse-checkout-cone-mode: false

      - name: GATE - Reconstruct exact uploaded XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64
          import hashlib
          import os
          from pathlib import Path

          root = Path('build/bootstrap/legacy-gosuslugi-xpi')
          parts = sorted(root.glob('part*.b64'))
          if len(parts) != 7:
              raise SystemExit(f'Expected 7 bootstrap parts, found {len(parts)}')
          encoded = ''.join(part.read_text(encoding='ascii').strip() for part in parts)
          if len(encoded) != 26976:
              raise SystemExit(f'Unexpected bootstrap base64 length: {len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = os.environ['XPI_SHA256']
          if digest != expected:
              raise SystemExit(f'Reconstructed XPI SHA-256 mismatch: {digest}')
          candidate = Path(os.environ['RUNNER_TEMP']) / 'addon-1.2.8-fx.xpi'
          candidate.write_bytes(raw)
          print(f'reconstructed-size={len(raw)} sha256={digest} path={candidate}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $candidate = Join-Path $env:RUNNER_TEMP 'addon-1.2.8-fx.xpi'
          python build\validate-bundled-extension.py $candidate `
            --expected-id $env:XPI_ID `
            --expected-version '1.2.8' `
            --require-permission nativeMessaging `
            --require-native-host 'ru.rtlabs.ifcplugin' `
            --metadata legacy-gosuslugi-repair.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -Force $candidate $env:XPI_PATH
          $workingHash = (Get-FileHash -Algorithm SHA256 $env:XPI_PATH).Hash.ToLowerInvariant()
          if ($workingHash -ne $env:XPI_SHA256) { throw "Working-tree XPI hash mismatch: $workingHash" }
          Write-Host "Exact fallback reconstructed and validated: $workingHash"

      - name: Commit repaired exact fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:XPI_PATH
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Repair produced no binary change.' }
          git commit -m 'fix(extensions): restore exact legacy Gosuslugi XPI'
          git push origin HEAD:agent/gost-tls-poc
