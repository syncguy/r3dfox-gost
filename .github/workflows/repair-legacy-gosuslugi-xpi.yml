name: Repair legacy Gosuslugi XPI

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/repair-legacy-gosuslugi-xpi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    name: Download exact official XPI and replace fallback
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      XPI_URL: https://ds-plugin.gosuslugi.ru/assets/distrib/addon-1.2.8-fx.xpi
      XPI_ID: pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru
      XPI_SHA256: 72916b4ed2adefd91049fbd93aff5e028c423c971c2e0012603a2dae343bdc80
      XPI_PATH: r3dfox\extensions\pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru.xpi

    steps:
      - name: Checkout required files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            build
            r3dfox/extensions
          sparse-checkout-cone-mode: false

      - name: GATE - Download and validate exact official XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'addon-1.2.8-fx.xpi'
          Invoke-WebRequest -Uri $env:XPI_URL -OutFile $candidate -TimeoutSec 30
          $hash = (Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()
          if ($hash -ne $env:XPI_SHA256) { throw "Official XPI SHA-256 mismatch: $hash" }
          python build\validate-bundled-extension.py $candidate `
            --expected-id $env:XPI_ID `
            --expected-version '1.2.8' `
            --require-permission nativeMessaging `
            --require-native-host 'ru.rtlabs.ifcplugin' `
            --metadata legacy-gosuslugi-repair.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force $candidate $env:XPI_PATH
          $workingHash = (Get-FileHash -Algorithm SHA256 $env:XPI_PATH).Hash.ToLowerInvariant()
          if ($workingHash -ne $env:XPI_SHA256) { throw "Working-tree XPI hash mismatch: $workingHash" }

      - name: Commit repaired exact fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:XPI_PATH
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Repair produced no binary change.' }
          git commit -m 'fix(extensions): repair legacy Gosuslugi XPI fallback'
          git push origin HEAD:agent/gost-tls-poc
