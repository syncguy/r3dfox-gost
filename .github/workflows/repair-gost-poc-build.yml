name: Repair GOST PoC workflow

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/repair-gost-poc-build.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gost-tls-poc
          fetch-depth: 1

      - name: Patch main workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/gost-poc-build.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('      - name: Build release r3dfox\n')
          replacement = r'''      - name: Build release r3dfox
        id: build-release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit xul.dll Win7 imports
        id: win7-import-audit
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xul = 'obj-gost-win64\dist\bin\xul.dll'
          if (-not (Test-Path $xul)) { throw "xul.dll not found: $xul" }

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source -First 1

          if (-not $dumpbin) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = (& $vswhere -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath).Trim()
              if ($vs) {
                $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" `
                  -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending |
                  Select-Object -ExpandProperty FullName -First 1
              }
            }
          }

          if (-not $dumpbin -or -not (Test-Path $dumpbin)) {
            'Win7 import audit unavailable: dumpbin.exe was not found.' |
              Set-Content -Encoding utf8 xul-win7-audit-result.txt
            Write-Warning 'dumpbin.exe was not found; packaging will continue.'
            exit 0
          }

          Write-Host "Using dumpbin: $dumpbin"
          & $dumpbin /imports $xul 2>&1 | Tee-Object -FilePath xul-win7-imports.txt
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }

          $imports = [System.IO.File]::ReadAllText((Resolve-Path 'xul-win7-imports.txt'))
          $forbidden = @(
            'ProcessPrng','bcryptprimitives.dll','api-ms-win-core-synch-l1-2-0.dll',
            'WaitOnAddress','WakeByAddressAll','WakeByAddressSingle',
            'GetSystemTimePreciseAsFileTime','GetOverlappedResultEx'
          )
          $found = @()
          foreach ($symbol in $forbidden) {
            if ($imports.IndexOf($symbol, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              $found += $symbol
              Write-Warning "Win7 blocker still imported by xul.dll: $symbol"
            }
          }
          if ($found.Count -gt 0) {
            $found | Set-Content -Encoding utf8 xul-win7-forbidden-imports.txt
          } else {
            'No known Win8+ imports from the current blacklist were found.' |
              Set-Content -Encoding utf8 xul-win7-audit-result.txt
          }

      - name: Package release r3dfox
        id: package-release
        if: steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem 'obj-gost-win64\dist' -File |
            Where-Object { $_.Name -match '\.(zip|7z)$' -or $_.Name -like '*.installer.exe' } |
            Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload release package
        if: always() && steps.package-release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-win64-release
          if-no-files-found: error
          compression-level: 0
          path: |
            obj-gost-win64/dist/*.zip
            obj-gost-win64/dist/*.7z
            obj-gost-win64/dist/*.installer.exe

      - name: Upload Win7 import audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-win64-win7-import-audit
          if-no-files-found: warn
          path: |
            configure-win7.log
            rust-win7-target-cfg.txt
            rust-std-vendor.log
            rust-std-vendor.stdout.log
            rust-std-vendor.stderr.log
            rust-std-vendor-added.txt
            xul-win7-imports.txt
            xul-win7-forbidden-imports.txt
            xul-win7-audit-result.txt

      - name: GATE - Reject known Win8+ imports after artifacts are uploaded
        if: always() && steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          if (Test-Path 'xul-win7-forbidden-imports.txt') {
            Get-Content 'xul-win7-forbidden-imports.txt'
            throw 'Release package was produced for diagnosis, but the Win7 import gate failed.'
          }
'''
          path.write_text(text[:start] + replacement, encoding='utf-8', newline='\n')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F "id: build-release" .github/workflows/gost-poc-build.yml
          grep -F "continue-on-error: true" .github/workflows/gost-poc-build.yml
          grep -F "vswhere.exe" .github/workflows/gost-poc-build.yml
          grep -F "if: always() && steps.package-release.outcome == 'success'" .github/workflows/gost-poc-build.yml
          grep -F "mk_add_options MOZ_PARALLEL_BUILD=2" .github/workflows/gost-poc-build.yml
          git diff --check
          git diff -- .github/workflows/gost-poc-build.yml

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/repair-gost-poc-build.yml
          git add -- .github/workflows/gost-poc-build.yml
          git commit -m "ci: preserve release artifacts after Win7 audit"
          git push origin HEAD:agent/gost-tls-poc

      - name: Dispatch repaired main workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/syncguy/r3dfox-gost/actions/workflows/gost-poc-build.yml/dispatches \
            -d '{"ref":"agent/gost-tls-poc"}'
