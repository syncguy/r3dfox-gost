name: msvcr14x Rust YY coexistence smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/msvcr14x-win7-smoke
    paths:
      - ".github/workflows/msvcr14x-rust-yy-coexistence-smoke.yml"

permissions:
  contents: read

env:
  MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
  MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
  YY_THUNKS_VERSION: "1.2.2"
  RUST_TOOLCHAIN: "nightly-2026-08-20"
  RUST_TARGET: "x86_64-pc-windows-msvc"

jobs:
  coexistence-smoke:
    name: msvcr14x + Rust libstd + narrow YY-Thunks
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Prepare diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @(
            "repo=$env:GITHUB_REPOSITORY"
            "test_commit=$env:GITHUB_SHA"
            "msvcr14x_commit=$env:MSVCR14X_SHA"
            "yy_thunks_version=$env:YY_THUNKS_VERSION"
            "rust_toolchain=$env:RUST_TOOLCHAIN"
          ) | Set-Content -Encoding utf8 diagnostics\identity.txt
          cmd /c "where cl && cl 2>&1" | Set-Content -Encoding utf8 diagnostics\cl-version.txt
          cmd /c "where link && link 2>&1" | Set-Content -Encoding utf8 diagnostics\link-version.txt
          rustc -Vv | Set-Content -Encoding utf8 diagnostics\rustc-version.txt

      - name: Fetch and build pinned msvcr14x Release x64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'msvcr14x'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          git init $root
          git -C $root remote add origin $env:MSVCR14X_REPO
          git -C $root fetch --depth=1 origin $env:MSVCR14X_SHA
          git -C $root checkout --detach FETCH_HEAD
          git -C $root submodule update --init --recursive --depth 1
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:MSVCR14X_SHA) { throw "Unexpected msvcr14x commit: $actual" }

          & msbuild.exe (Join-Path $root 'msvcr14x.sln') /m /t:Build '/p:Configuration=Release;Platform=x64' -r "/bl:$env:GITHUB_WORKSPACE\diagnostics\msvcr14x-release-x64.binlog"
          if ($LASTEXITCODE -ne 0) { throw "msvcr14x build failed: $LASTEXITCODE" }

          $release = Join-Path $root 'x64\Release'
          foreach ($required in @('ucrtbase.dll','ucrt.lib','vcruntime.lib','msvcprt.lib','msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $release $required))) { throw "Missing msvcr14x output: $required" }
          }
          Get-ChildItem -LiteralPath $release -File | Sort-Object Name |
            Select-Object Name,Length | Format-Table -AutoSize | Out-String -Width 240 |
            Set-Content -Encoding utf8 diagnostics\msvcr14x-release-files.txt
          "MSVCR14X_RELEASE=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download YY-Thunks 1.2.2 Win7 x64 libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)Lib.*\.zip$|(?i)-Lib\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Lib asset not found" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-package'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root
          $yyLib = Get-ChildItem -Path $root -Recurse -Directory |
            Where-Object { $_.FullName -match '(?i)[\\/]Lib[\\/]6\.1\.7600\.0[\\/]x64$' } |
            Select-Object -First 1
          if (-not $yyLib) { throw 'YY-Thunks Lib/6.1.7600.0/x64 not found' }
          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          if (-not (Test-Path $kernel32) -or -not (Test-Path $synch)) { throw 'Required YY libraries are missing' }
          "THUNK_YY_LIB=$($yyLib.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_SYNCH_LIB=$synch" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build narrow YY ProcessPrng and precise-time provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'msvcr14x-rust-yy-smoke'
          $selected = Join-Path $work 'selected'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $selected | Out-Null

          $members = @(& lib.exe /nologo /list $env:THUNK_YY_KERNEL32_LIB 2>&1 |
            ForEach-Object { "$_".Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $members.Count -eq 0) { throw 'Cannot enumerate YY kernel32.lib' }
          $members | Set-Content -Encoding utf8 (Join-Path $work 'yy-kernel32-members.txt')

          $wanted = @(
            @{ Key='process-direct'; Pattern='(?i)[\\/]ProcessPrng\.obj$' },
            @{ Key='process-import'; Pattern='(?i)[\\/]ProcessPrng\.obi$' },
            @{ Key='precise-direct'; Pattern='(?i)[\\/]GetSystemTimePreciseAsFileTime\.obj$' },
            @{ Key='precise-import'; Pattern='(?i)[\\/]GetSystemTimePreciseAsFileTime\.obi$' },
            @{ Key='implementation'; Pattern='(?i)[\\/]YY_Thunks_for_6\.1\.7600\.0\.obj$' }
          )
          $objects = @()
          $memberMap = [System.Collections.Generic.List[string]]::new()
          foreach ($spec in $wanted) {
            $matches = @($members | Where-Object { $_ -match $spec.Pattern })
            if ($matches.Count -ne 1) { throw "Expected one $($spec.Key) member; found $($matches.Count)" }
            $dir = Join-Path $selected $spec.Key
            New-Item -ItemType Directory -Force $dir | Out-Null
            Push-Location $dir
            try {
              & lib.exe /nologo "/extract:$($matches[0])" $env:THUNK_YY_KERNEL32_LIB *> extract.log
              if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($matches[0])" }
            } finally { Pop-Location }
            $file = Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -ne 'extract.log' } | Sort-Object Length -Descending | Select-Object -First 1
            if (-not $file) { throw "No extracted object for $($spec.Key)" }
            $dst = Join-Path $dir 'member.obj'
            Copy-Item -Force $file.FullName $dst
            (& dumpbin.exe /nologo /symbols $dst 2>&1 | Out-String) | Set-Content -Encoding utf8 (Join-Path $dir 'symbols.txt')
            $objects += $dst
            $memberMap.Add("$($spec.Key)|$($matches[0])")
          }
          $memberMap | Set-Content -Encoding utf8 (Join-Path $work 'selected-members.txt')

          $narrow = Join-Path $work 'yy-processprng-precise.lib'
          & lib.exe /nologo "/out:$narrow" @objects
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $narrow)) { throw 'Failed to build narrow YY provider' }
          $symbols = (& dumpbin.exe /nologo /linkermember:1 $narrow 2>&1 | Out-String)
          $symbols | Set-Content -Encoding utf8 (Join-Path $work 'narrow-provider-symbols.txt')
          foreach ($required in @('YY_Thunks_ProcessPrng','YY_Thunks_GetSystemTimePreciseAsFileTime')) {
            if ($symbols.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) { throw "Narrow provider missing $required" }
          }
          foreach ($broad in @('LockResource','__imp_LockResource')) {
            if ($symbols -match ('(?m)(?:^|\s)' + [regex]::Escape($broad) + '\s*$')) { throw "Narrow provider exposes broad symbol $broad" }
          }
          "SMOKE_DIR=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NARROW_YY_LIB=$narrow" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate lld-link
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $lld = if ($cmd) { $cmd.Source } else { 'C:\Program Files\LLVM\bin\lld-link.exe' }
          if (-not (Test-Path $lld)) { throw "lld-link.exe not found: $lld" }
          "REAL_LLD_LINK=$lld" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $lld --version | Set-Content -Encoding utf8 diagnostics\lld-version.txt

      - name: Compile ordinary C++ /MD STL helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SMOKE_DIR 'cpp-helper.cpp'
          $obj = Join-Path $env:SMOKE_DIR 'cpp-helper.obj'
          @'
          #include <string>
          #include <vector>
          extern "C" int cpp_probe() {
              std::vector<std::string> v{"msvcr14x", "rust", "yy"};
              return static_cast<int>(v.size());
          }
          '@ | Set-Content -Encoding utf8 $src
          & cl.exe /nologo /c /MD /O2 /EHsc /std:c++20 $src "/Fo:$obj" 2>&1 | Tee-Object -FilePath diagnostics\cpp-helper-compile.log
          if ($LASTEXITCODE -ne 0) { throw "C++ helper compile failed: $LASTEXITCODE" }
          & dumpbin.exe /nologo /directives $obj 2>&1 | Set-Content -Encoding utf8 diagnostics\cpp-helper-directives.txt
          $directives = Get-Content diagnostics\cpp-helper-directives.txt -Raw
          if ($directives.IndexOf('RuntimeLibrary=MD_DynamicRelease', [System.StringComparison]::Ordinal) -lt 0) {
            throw 'C++ helper is not MD_DynamicRelease'
          }
          "CPP_HELPER_OBJ=$obj" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build representative Rust archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SMOKE_DIR 'probe.rs'
          $rlib = Join-Path $env:SMOKE_DIR 'libmsvcr14x_yy_probe.rlib'
          @'
          use std::collections::hash_map::RandomState;
          use std::ffi::c_void;
          use std::hint::black_box;
          use std::sync::{Arc, Condvar, Mutex, Once, RwLock};
          use std::thread;
          use std::time::Duration;

          #[repr(C)]
          struct FileTime { low: u32, high: u32 }

          #[link(name = "kernel32", kind = "raw-dylib")]
          unsafe extern "system" {
              fn GetSystemTimePreciseAsFileTime(file_time: *mut FileTime);
              fn LockResource(hmem: *mut c_void) -> *mut c_void;
          }

          #[inline(never)]
          pub fn run_probe() {
              black_box(RandomState::new());
              static INIT: Once = Once::new();
              INIT.call_once(|| black_box(()));
              let rw = RwLock::new(1usize);
              *rw.write().unwrap() += 1;
              black_box(*rw.read().unwrap());
              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let waiter_pair = Arc::clone(&pair);
              let waiter = thread::spawn(move || {
                  let (lock, cv) = &*waiter_pair;
                  let guard = lock.lock().unwrap();
                  let (_guard, _timeout) = cv.wait_timeout_while(guard, Duration::from_millis(1), |ready| !*ready).unwrap();
              });
              {
                  let (lock, cv) = &*pair;
                  let mut ready = lock.lock().unwrap();
                  *ready = true;
                  cv.notify_all();
              }
              waiter.join().unwrap();
              let mut ft = FileTime { low: 0, high: 0 };
              unsafe { GetSystemTimePreciseAsFileTime(&mut ft); }
              black_box((ft.low, ft.high));
              black_box(LockResource as unsafe extern "system" fn(*mut c_void) -> *mut c_void);
          }
          '@ | Set-Content -Encoding utf8 $src
          & rustc $src --crate-name msvcr14x_yy_probe --crate-type rlib --edition 2021 --target $env:RUST_TARGET -O -o $rlib
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $rlib)) { throw "Rust archive build failed: $LASTEXITCODE" }
          $probeSymbols = (& dumpbin.exe /nologo /linkermember:1 $rlib 2>&1 | Out-String)
          $probeSymbols | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'rust-probe-symbols.txt')
          foreach ($required in @('LockResource','GetSystemTimePreciseAsFileTime')) {
            if ($probeSymbols.IndexOf($required, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) { throw "Rust probe missing $required" }
          }
          $targetLibDir = (& rustc --print target-libdir --target $env:RUST_TARGET 2>&1 | Out-String).Trim()
          $std = Get-ChildItem -Path $targetLibDir -File -Filter 'libstd-*.rlib' | Select-Object -First 1
          if (-not $std) { throw 'Pinned Rust libstd not found' }
          $stdSymbols = (& dumpbin.exe /nologo /linkermember:1 $std.FullName 2>&1 | Out-String)
          $stdSymbols | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'rust-libstd-symbols.txt')
          if ($stdSymbols.IndexOf('ProcessPrng', [System.StringComparison]::OrdinalIgnoreCase) -lt 0) { throw 'Pinned Rust libstd lacks ProcessPrng' }
          if ($stdSymbols -notmatch '(?i)WaitOnAddress|WakeByAddressAll|WakeByAddressSingle') { throw 'Pinned Rust libstd lacks synchronization imports' }
          "RUST_PROBE_RLIB=$rlib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Link one coexistence candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $main = Join-Path $env:SMOKE_DIR 'main.rs'
          $exe = Join-Path $env:SMOKE_DIR 'msvcr14x-rust-yy-smoke.exe'
          $wrapper = Join-Path $env:SMOKE_DIR 'lld-msvcr14x-yy.cmd'
          $linkLog = Join-Path $env:SMOKE_DIR 'final-link-command.txt'
          $linkOutput = Join-Path $env:SMOKE_DIR 'final-link-output.txt'
          $map = Join-Path $env:SMOKE_DIR 'final-link.map'
          @'
          extern crate msvcr14x_yy_probe;
          unsafe extern "C" { fn cpp_probe() -> i32; }
          fn main() {
              msvcr14x_yy_probe::run_probe();
              let n = unsafe { cpp_probe() };
              assert_eq!(n, 3);
          }
          '@ | Set-Content -Encoding utf8 $main
          @"
          @echo off
          >"$linkLog" echo "$env:REAL_LLD_LINK" "-LIBPATH:$env:MSVCR14X_RELEASE" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_YY_LIB" %*
          "$env:REAL_LLD_LINK" "-LIBPATH:$env:MSVCR14X_RELEASE" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_YY_LIB" %*
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Encoding ascii $wrapper
          & rustc $main --edition 2021 --target $env:RUST_TARGET -O `
            --extern "msvcr14x_yy_probe=$env:RUST_PROBE_RLIB" `
            "-Clinker=$wrapper" `
            "-Clink-arg=$env:CPP_HELPER_OBJ" `
            "-Clink-arg=/map:$map" `
            -o $exe 2>&1 | Tee-Object -FilePath $linkOutput
          if ($LASTEXITCODE -ne 0) { throw "Coexistence link failed: $LASTEXITCODE" }
          if (-not (Test-Path $exe) -or -not (Test-Path $map)) { throw 'Final executable or map missing' }
          $mapText = Get-Content $map -Raw
          foreach ($required in @('YY_Thunks_ProcessPrng','YY_Thunks_GetSystemTimePreciseAsFileTime')) {
            if ($mapText.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) { throw "Final link did not select $required" }
          }
          $logged = Get-Content $linkLog -Raw
          if ($logged.IndexOf($env:THUNK_YY_KERNEL32_LIB, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Full YY kernel32.lib reached final link command' }
          if ($logged.IndexOf("-LIBPATH:$env:THUNK_YY_LIB", [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Full YY library directory reached final LIBPATH' }
          "SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit final PE imports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = @(& dumpbin.exe /nologo /imports $env:SMOKE_EXE 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $raw | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'final-imports-raw.txt')
          $dlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $apis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $mode = 'none'
          foreach ($line in $raw) {
            if ($line -match '^\s*Section contains the following imports:\s*$') { $mode = 'direct'; continue }
            if ($line -match '^\s*Section contains the following delay load imports:\s*$') { $mode = 'delay'; continue }
            if ($mode -ne 'direct') { continue }
            if ($line -match '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') { [void]$dlls.Add($matches[1]); continue }
            $entry = $line.Trim()
            if ($entry -match '^[0-9A-Fa-f]+\s+(\S+)$') { [void]$apis.Add($matches[1]) }
          }
          @($dlls | Sort-Object) | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'final-direct-dlls.txt')
          @($apis | Sort-Object) | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'final-direct-apis.txt')

          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($dll in $dlls) {
            if ($dll -match '^(?i)(api-ms-win-|ext-ms-)') { $hits.Add($dll) }
            if ($dll -match '^(?i)VCRUNTIME140(?:_1)?\.dll$') { $hits.Add($dll) }
          }
          foreach ($api in @('ProcessPrng','WaitOnAddress','WakeByAddressAll','WakeByAddressSingle','GetSystemTimePreciseAsFileTime','GetOverlappedResultEx')) {
            if ($apis.Contains($api)) { $hits.Add($api) }
          }
          $hits | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'forbidden-direct-imports.txt')
          if ($hits.Count -gt 0) { throw "Forbidden direct imports survived: $($hits -join ', ')" }
          if (-not $dlls.Contains('KERNEL32.dll')) { throw 'KERNEL32.dll control import missing' }
          if (-not $dlls.Contains('ucrtbase.dll')) { throw 'ucrtbase.dll was not selected' }
          if (-not $dlls.Contains('msvcp140.dll')) { throw 'msvcp140.dll was not selected for the /MD C++ helper' }
          if (-not $apis.Contains('LockResource')) { throw 'LockResource positive control is absent' }

      - name: Run coexistence probe on runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Force (Join-Path $env:MSVCR14X_RELEASE '*.dll') $env:SMOKE_DIR
          & $env:SMOKE_EXE 2>&1 | Tee-Object -FilePath (Join-Path $env:SMOKE_DIR 'run.txt')
          if ($LASTEXITCODE -ne 0) { throw "Probe execution failed: $LASTEXITCODE" }

      - name: Upload coexistence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvcr14x-rust-yy-coexistence-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            diagnostics\**\*
            ${{ runner.temp }}\msvcr14x-rust-yy-smoke\**\*

      - name: GATE - Summarize coexistence result
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $hits = @(Get-Content -ErrorAction SilentlyContinue (Join-Path $env:SMOKE_DIR 'forbidden-direct-imports.txt') | Where-Object { $_.Trim() })
          if ($hits.Count -gt 0) { throw "Forbidden direct imports remain: $($hits -join ', ')" }
          "## msvcr14x + Rust + YY coexistence: PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- C++ helper remained MD_DynamicRelease." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Rust libstd ProcessPrng/synchronization surface linked with YY-Thunks 1.2.2 narrow provider." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- GetSystemTimePreciseAsFileTime was redirected by the same narrow YY provider." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- LockResource remained a normal KERNEL32 raw-dylib import without a duplicate-symbol collision." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- msvcr14x supplied ucrtbase/msvcp without direct API-set or VCRUNTIME140*.dll dependencies in the final PE." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
