name: XP ANGLE D3D9-only regeneration smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - ".github/workflows/xp-angle-d3d9-regenerate.yml"
      - ".github/scripts/xp/angle-d3d9-regenerate-test.ps1"

permissions:
  contents: read

jobs:
  regenerate-angle:
    name: Regenerate exact vendored ANGLE with D3D11 disabled
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout exact XP source under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate ANGLE D3D9-only graph
        shell: powershell
        run: |
          & .\source\.github\scripts\xp\angle-d3d9-regenerate-test.ps1 `
            -Source .\source `
            -WorkRoot .\angle-regeneration-work `
            -Diagnostics .\diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish regeneration summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path .\diagnostics\summary.txt) {
            Get-Content .\diagnostics\summary.txt | ForEach-Object { "$_  " } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          foreach ($diff in @('.\diagnostics\BUILD.gn.d3d9-format-split.diff', '.\diagnostics\libGLESv2.moz.build.diff')) {
            if (Test-Path $diff) {
              "`n### $([System.IO.Path]::GetFileName($diff))`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "``````diff" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content $diff | Select-Object -First 300 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Upload regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-angle-d3d9-regeneration-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: warn
          retention-days: 14
