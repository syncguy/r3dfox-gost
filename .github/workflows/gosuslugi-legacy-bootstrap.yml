name: Legacy Gosuslugi XPI bootstrap

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/gosuslugi-legacy-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    name: Validate and vendor legacy Gosuslugi XPI
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      XPI_URL: https://ds-plugin.gosuslugi.ru/plugin/upload/assets/distrib/addon-1.2.8-fx.xpi
      XPI_ID: pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru
      XPI_SHA256: 72916b4ed2adefd91049fbd93aff5e028c423c971c2e0012603a2dae343bdc80
      XPI_PATH: r3dfox\extensions\pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru.xpi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and validate official XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'addon-1.2.8-fx.xpi'
          Invoke-WebRequest -Uri $env:XPI_URL -OutFile $candidate
          $hash = (Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()
          if ($hash -ne $env:XPI_SHA256) { throw "Official XPI SHA-256 mismatch: $hash" }
          python build\validate-bundled-extension.py $candidate `
            --expected-id $env:XPI_ID `
            --expected-version 1.2.8 `
            --require-permission nativeMessaging `
            --require-native-host ru.rtlabs.ifcplugin `
            --metadata legacy-gosuslugi-xpi.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force (Split-Path $env:XPI_PATH) | Out-Null
          Copy-Item -Force $candidate $env:XPI_PATH

      - name: Commit exact validated fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:XPI_PATH
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Validated fallback is already committed.'
            exit 0
          }
          git commit -m 'build(extensions): vendor legacy Gosuslugi XPI'
          git push origin HEAD:agent/gost-tls-poc
