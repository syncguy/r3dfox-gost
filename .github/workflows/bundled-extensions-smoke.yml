name: Bundled extensions smoke

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - "build/bundled-extensions.json"
      - "build/validate-bundled-extension.py"
      - "r3dfox/extensions/ru.cryptopro.nmcades@cryptopro.ru.xpi"
      - "r3dfox/extensions/pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru.xpi"
      - "r3dfox/extensions/gosuslugi@plugin.xpi"
      - "r3dfox/moz.build"
      - "r3dfox/r3dfox-bundle.js"
      - "browser/installer/package-manifest.in"
      - ".github/workflows/bundled-extensions-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate bundled extension baselines and integration
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            build
            r3dfox/moz.build
            r3dfox/r3dfox-bundle.js
            r3dfox/extensions
            browser/installer/package-manifest.in
          sparse-checkout-cone-mode: false

      - name: GATE - Validate CryptoPro committed fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python build\validate-bundled-extension.py `
            'r3dfox\extensions\ru.cryptopro.nmcades@cryptopro.ru.xpi' `
            --expected-id 'ru.cryptopro.nmcades@cryptopro.ru' `
            --expected-version '1.2.14' `
            --metadata 'smoke\cryptopro.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Validate legacy Gosuslugi committed fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python build\validate-bundled-extension.py `
            'r3dfox\extensions\pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru.xpi' `
            --expected-id 'pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru' `
            --expected-version '1.2.8' `
            --require-permission nativeMessaging `
            --require-native-host 'ru.rtlabs.ifcplugin' `
            --metadata 'smoke\gosuslugi-legacy.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Validate Gosplugin committed fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python build\validate-bundled-extension.py `
            'r3dfox\extensions\gosuslugi@plugin.xpi' `
            --expected-id 'gosuslugi@plugin' `
            --expected-version '1.3.43.0' `
            --require-permission nativeMessaging `
            --metadata 'smoke\gosplugin.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify registry hashes and versions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          from pathlib import Path

          registry = json.loads(Path('build/bundled-extensions.json').read_text(encoding='utf-8'))
          if len(registry['extensions']) != 3:
              raise SystemExit(f"Expected exactly three bundled extensions, got {len(registry['extensions'])}")
          for item in registry['extensions']:
              path = Path(item['fallback'])
              if not path.is_file():
                  raise SystemExit(f"Missing committed fallback: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['fallback_sha256']:
                  raise SystemExit(f"SHA-256 mismatch for {item['id']}: {digest}")
              print(f"registry-ok id={item['id']} version={item['fallback_version']} sha256={digest}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify Mozilla integration and Russian-first language default
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          from pathlib import Path

          registry = json.loads(Path('build/bundled-extensions.json').read_text(encoding='utf-8'))
          moz = Path('r3dfox/moz.build').read_text(encoding='utf-8')
          package = Path('browser/installer/package-manifest.in').read_text(encoding='utf-8')
          prefs = Path('r3dfox/r3dfox-bundle.js').read_text(encoding='utf-8')

          for item in registry['extensions']:
              filename = Path(item['fallback']).name
              moz_entry = f'"extensions/{filename}"'
              package_entry = f'@RESPATH@/distribution/extensions/{filename}'
              if moz_entry not in moz:
                  raise SystemExit(f'Missing moz.build extension entry: {moz_entry}')
              if package_entry not in package:
                  raise SystemExit(f'Missing package-manifest extension entry: {package_entry}')

          if '"r3dfox-bundle.js"' not in moz:
              raise SystemExit('r3dfox-bundle.js is not staged by r3dfox/moz.build')
          if '@RESPATH@/defaults/pref/r3dfox-bundle.js' not in package:
              raise SystemExit('r3dfox-bundle.js is not included by package-manifest.in')
          expected = 'pref("intl.accept_languages", "ru, en-US, en");'
          if expected not in prefs:
              raise SystemExit('Russian-first intl.accept_languages default is missing')
          print('integration-ok extensions=3 language-order=ru,en-US,en')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Live check - legacy Gosuslugi official URL when reachable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'addon-1.2.8-fx.xpi'
          $urls = @(
            'https://ds-plugin.gosuslugi.ru/plugin/upload/assets/distrib/addon-1.2.8-fx.xpi',
            'https://ds-plugin.gosuslugi.ru/assets/distrib/addon-1.2.8-fx.xpi'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $candidate -TimeoutSec 15
              Write-Host "Reached official Gosuslugi endpoint: $url"
              $downloaded = $true
              break
            } catch {
              Write-Warning "Official Gosuslugi endpoint is unreachable from this runner: $url - $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) {
            Write-Warning 'No official Gosuslugi endpoint was reachable; committed fallback remains authoritative.'
            exit 0
          }
          $hash = (Get-FileHash -Algorithm SHA256 $candidate).Hash.ToLowerInvariant()
          $expected = '72916b4ed2adefd91049fbd93aff5e028c423c971c2e0012603a2dae343bdc80'
          if ($hash -ne $expected) { throw "Reachable official XPI differs from committed baseline: $hash" }
          python build\validate-bundled-extension.py $candidate `
            --expected-id 'pbafkdcnd@ngodfeigfdgiodgnmbgcfha.ru' `
            --expected-version '1.2.8' `
            --require-permission nativeMessaging `
            --require-native-host 'ru.rtlabs.ifcplugin'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-extensions-smoke
          if-no-files-found: warn
          retention-days: 30
          path: smoke/*.json
