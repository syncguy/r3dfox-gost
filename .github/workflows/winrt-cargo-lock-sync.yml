name: "Sync WinRT PoC Cargo.lock and dispatch XP x32 full build"

on:
  workflow_dispatch:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - ".github/workflows/winrt-cargo-lock-sync.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync-and-dispatch:
    name: Offline Cargo.lock sync then full build dispatch
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout source PoC branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: agent/winrt-source-poc

      - name: Record source identity
        shell: powershell
        run: |
          "source=$env:GITHUB_SHA" | Set-Content cargo-lock-sync-identity.txt
          git rev-parse HEAD | Add-Content cargo-lock-sync-identity.txt

      - name: Repair vendored mime_guess checksum for offline metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mime = 'third_party\rust\mime_guess\src\mime_types.rs'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          $stale = '57ee8db84eb0fc4f06a3eac0da8c730a334cb99a7e81e60413f5febd886d91f4'
          $expected = '1579ebd4fae3e0e8b1fe2d7677165868e6ba856c5e587538d9cb7b478a91078b'
          $actual = (Get-FileHash -Algorithm SHA256 $mime).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected mime_guess source hash: $actual" }
          $text = [System.IO.File]::ReadAllText($checksum)
          if ($text.Contains($stale)) {
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($checksum, $text.Replace($stale, $expected), $utf8NoBom)
          }

      - name: Refresh Cargo.lock from vendored sources only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item '.cargo\config.toml.in' '.cargo\config.toml' -Force
          cargo metadata --format-version 1 --offline | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -- third_party/rust/mime_guess/.cargo-checksum.json
          git diff -- Cargo.lock | Set-Content cargo-lock-sync.diff

      - name: Commit refreshed Cargo.lock when changed
        id: commit-lock
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = git status --porcelain -- Cargo.lock
          if (-not $dirty) {
            'changed=false' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
            "LOCK_SHA=$(git rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build(win7): refresh Cargo.lock offline for WinRT full build'
          git push origin HEAD:agent/winrt-source-poc
          $sha = (git rev-parse HEAD).Trim()
          "LOCK_SHA=$sha" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'changed=true' | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Dispatch existing XP x32 full build on synced SHA
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run gost-poc-build-xp-x32.yml --repo $env:GITHUB_REPOSITORY --ref agent/winrt-source-poc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "dispatched_source=$env:LOCK_SHA" | Add-Content cargo-lock-sync-identity.txt

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winrt-cargo-lock-sync-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            cargo-lock-sync-identity.txt
            cargo-lock-sync.diff
