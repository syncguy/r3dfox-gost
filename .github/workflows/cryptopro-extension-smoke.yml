name: CryptoPro extension packaging smoke

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - "build/update-cryptopro-extension.py"
      - ".github/workflows/cryptopro-extension-smoke.yml"
      - "r3dfox/extensions/ru.cryptopro.nmcades@cryptopro.ru.xpi"

permissions:
  contents: write

jobs:
  cryptopro-extension-smoke:
    name: CryptoPro XPI update / fallback / package smoke
    runs-on: windows-2022
    timeout-minutes: 15

    env:
      EXTENSION_ID: ru.cryptopro.nmcades@cryptopro.ru
      FALLBACK_XPI: r3dfox\extensions\ru.cryptopro.nmcades@cryptopro.ru.xpi
      OFFICIAL_URL: https://www.cryptopro.ru/sites/default/files/products/cades/extensions/firefox_cryptopro_extension_latest.xpi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            build
            r3dfox/extensions
          sparse-checkout-cone-mode: false

      - name: Bootstrap exact supplied fallback if repository copy is absent
        shell: powershell
        env:
          EXPECTED_BOOTSTRAP_SHA256: 3df7ee8c7d655921abce942befc2bfd6e0ddcf9179e6173d72e35083844cc0e7
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:FALLBACK_XPI) {
            Write-Host 'Committed fallback already present; bootstrap not needed.'
            exit 0
          }
          New-Item -ItemType Directory -Force (Split-Path $env:FALLBACK_XPI) | Out-Null
          Invoke-WebRequest -Uri $env:OFFICIAL_URL -OutFile $env:FALLBACK_XPI
          $actual = (Get-FileHash -Algorithm SHA256 $env:FALLBACK_XPI).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_BOOTSTRAP_SHA256) {
            Remove-Item -Force $env:FALLBACK_XPI
            throw "Official XPI does not match the user-supplied baseline hash. expected=$env:EXPECTED_BOOTSTRAP_SHA256 actual=$actual"
          }
          Write-Host "Bootstrapped exact supplied CryptoPro XPI sha256=$actual"

      - name: GATE - Validate fallback baseline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url 'http://127.0.0.1:1/unreachable.xpi' `
            --timeout 1 `
            --output smoke\fallback-selected.xpi `
            --metadata smoke\fallback-selected.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = Get-Content smoke\fallback-selected.json -Raw | ConvertFrom-Json
          if ($meta.source -ne 'fallback') { throw "Expected fallback source, got $($meta.source)" }
          if ($meta.selected.id -ne $env:EXTENSION_ID) { throw 'Fallback extension ID mismatch.' }

      - name: Commit bootstrapped fallback baseline
        if: hashFiles('r3dfox/extensions/ru.cryptopro.nmcades@cryptopro.ru.xpi') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git ls-files -- $env:FALLBACK_XPI)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tracked.Count -gt 0) {
            Write-Host 'Fallback is already tracked; no bootstrap commit needed.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- $env:FALLBACK_XPI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'chore(extensions): vendor CryptoPro XPI 1.2.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/gost-tls-poc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create deterministic XPI fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import zipfile
          from pathlib import Path

          source = Path(r"r3dfox/extensions/ru.cryptopro.nmcades@cryptopro.ru.xpi")
          fixtures = Path("smoke/fixtures")
          fixtures.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(source) as zin:
              content = {name: zin.read(name) for name in zin.namelist()}

          manifest = json.loads(content["manifest.json"].decode("utf-8"))
          manifest["version"] = "99.0.0-smoke"
          content["manifest.json"] = json.dumps(manifest, separators=(",", ":")).encode("utf-8")
          with zipfile.ZipFile(fixtures / "valid-newer.xpi", "w", zipfile.ZIP_DEFLATED) as zout:
              for name, data in content.items():
                  zout.writestr(name, data)

          wrong = dict(content)
          wrong_manifest = json.loads(wrong["manifest.json"].decode("utf-8"))
          wrong_manifest.setdefault("applications", {}).setdefault("gecko", {})["id"] = "wrong@example.invalid"
          wrong_manifest.pop("browser_specific_settings", None)
          wrong["manifest.json"] = json.dumps(wrong_manifest, separators=(",", ":")).encode("utf-8")
          with zipfile.ZipFile(fixtures / "wrong-id.xpi", "w", zipfile.ZIP_DEFLATED) as zout:
              for name, data in wrong.items():
                  zout.writestr(name, data)

          (fixtures / "not-an-xpi.html").write_text("<html>not an xpi</html>", encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Accept valid downloaded candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = ([System.Uri](Resolve-Path smoke\fixtures\valid-newer.xpi)).AbsoluteUri
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url $url `
            --output smoke\download-selected.xpi `
            --metadata smoke\download-selected.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = Get-Content smoke\download-selected.json -Raw | ConvertFrom-Json
          if ($meta.source -ne 'download') { throw "Expected downloaded candidate, got $($meta.source)" }
          if ($meta.selected.version -ne '99.0.0-smoke') { throw 'Downloaded fixture version was not selected.' }

      - name: GATE - Reject malformed download and keep fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = ([System.Uri](Resolve-Path smoke\fixtures\not-an-xpi.html)).AbsoluteUri
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url $url `
            --output smoke\malformed-selected.xpi `
            --metadata smoke\malformed-selected.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = Get-Content smoke\malformed-selected.json -Raw | ConvertFrom-Json
          if ($meta.source -ne 'fallback' -or -not $meta.candidate_error) {
            throw 'Malformed candidate did not fall back as expected.'
          }

      - name: GATE - Reject wrong extension ID and keep fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = ([System.Uri](Resolve-Path smoke\fixtures\wrong-id.xpi)).AbsoluteUri
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url $url `
            --output smoke\wrong-id-selected.xpi `
            --metadata smoke\wrong-id-selected.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = Get-Content smoke\wrong-id-selected.json -Raw | ConvertFrom-Json
          if ($meta.source -ne 'fallback' -or $meta.candidate_error -notmatch 'Unexpected extension ID') {
            throw 'Wrong-ID candidate did not fall back as expected.'
          }

      - name: Live check - Official CryptoPro endpoint with safe fallback
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url $env:OFFICIAL_URL `
            --timeout 30 `
            --output smoke\official-selected.xpi `
            --metadata smoke\official-selected.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content smoke\official-selected.json

      - name: GATE - Stage selected XPI into distribution layout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "smoke\dist\distribution\extensions\$env:EXTENSION_ID.xpi"
          New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
          Copy-Item -Force smoke\official-selected.xpi $dest

          $selected = (Get-FileHash -Algorithm SHA256 smoke\official-selected.xpi).Hash
          $staged = (Get-FileHash -Algorithm SHA256 $dest).Hash
          if ($selected -ne $staged) { throw 'Staged XPI hash differs from selected XPI.' }

      - name: GATE - Package and verify final archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path smoke\dist\* -DestinationPath smoke\cryptopro-extension-smoke-package.zip -Force
          @'
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          expected_id = "ru.cryptopro.nmcades@cryptopro.ru"
          package = Path("smoke/cryptopro-extension-smoke-package.zip")
          selected = Path("smoke/official-selected.xpi")
          member = f"distribution/extensions/{expected_id}.xpi"

          with zipfile.ZipFile(package) as outer:
              names = {name.replace("\\", "/"): name for name in outer.namelist()}
              if member not in names:
                  raise SystemExit(f"Packaged extension missing: {member}")
              data = outer.read(names[member])

          if hashlib.sha256(data).hexdigest() != hashlib.sha256(selected.read_bytes()).hexdigest():
              raise SystemExit("Packaged XPI hash differs from selected XPI")

          with zipfile.ZipFile(io.BytesIO(data)) as inner:
              manifest = json.loads(inner.read("manifest.json"))
              addon_id = (
                  manifest.get("browser_specific_settings", {}).get("gecko", {}).get("id")
                  or manifest.get("applications", {}).get("gecko", {}).get("id")
              )
              if addon_id != expected_id:
                  raise SystemExit(f"Packaged extension ID mismatch: {addon_id!r}")
              print(f"packaged-id={addon_id} version={manifest.get('version')}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptopro-extension-smoke
          if-no-files-found: warn
          retention-days: 30
          path: |
            smoke/*.json
            smoke/*.xpi
            smoke/*.zip
