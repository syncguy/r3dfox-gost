name: bcrypt XP docs update

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/bcrypt-xp-docs-update.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gost-tls-poc
          fetch-depth: 1
          sparse-checkout: |
            docs/gost
          sparse-checkout-cone-mode: false

      - name: Record focused One-Core bcrypt experiment
        shell: python
        run: |
          from pathlib import Path

          test_log = Path('docs/gost/TEST_LOG.md')
          text = test_log.read_text(encoding='utf-8')
          marker = '---\n\n'
          entry = '''## 2026-09-01 — focused One-Core-API `bcrypt.dll` XP x86 smoke defines exact closure; hosted exact-local load is blocked by Code Integrity\n\nTrack: Windows XP x86 binary compatibility only. This experiment is independent of Firefox compilation, YY-Thunks synchronization work, and GOST TLS runtime/handshake behavior.\n\nExact experiment identity:\n\n- source-under-test `9be3a933c3eac2defec24df4826fded48ead02f4` on `agent/gost-tls-poc`;\n- workflow `bcrypt XP x86 smoke`;\n- Actions run `33475562495`, job `99753970359`;\n- run/job conclusion: **failure**, because the exact-local hosted runtime criterion did not pass;\n- runtime artifact `9788031922` (`bcrypt-xp-x86-runtime`), digest `sha256:c0d60f0a0bc18acd09abb9138ea2769a36c3996e71c87018ccf4842abd9e0817`;\n- diagnostics artifact `9788032206` (`bcrypt-xp-x86-diagnostics`), digest `sha256:83685ec9aebb4987e95e42cff6c74f958a1c9252d06721383323e0ab5b200fbe`.\n\nPinned upstream identity:\n\n- repository `shorthorn-project/One-Core-API-Binaries`;\n- immutable upstream commit `6c3b3b372d46dace7ba729dcd16b316b0acf664c`;\n- path `Packages/x86/Pack Installer/base/bcrypt.dll`;\n- Git blob `0b7d83ddbae62142ee6fca69208d77a8a5d3b0f7`;\n- size `279552` bytes;\n- SHA-256 `ada28a011cf08d9e10780fde09966899f5f40e08c4f5abb05eaa38dbc2f0cfc5`.\n\nStatic PE audit:\n\n- `bcrypt.dll` is x86 (`0x14c`); PE operating-system/image/subsystem version fields are `6.00`;\n- direct DLL imports are `ADVAPI32.dll`, `KERNEL32.dll`, and `ntdll.dll`;\n- recursive local dependency closure therefore contains **only `bcrypt.dll`**; adjacent upstream `bcryptprimitives.dll` is not imported and is not part of the runtime bundle;\n- the current explicit XP hard-import audit found no obvious post-XP hard import in this closure;\n- all required exports are present: `BCryptOpenAlgorithmProvider`, `BCryptCloseAlgorithmProvider`, `BCryptGetProperty`, `BCryptCreateHash`, `BCryptHashData`, `BCryptFinishHash`, `BCryptDestroyHash`, and `BCryptGenRandom`;\n- DLL characteristics include `Check integrity`, while the PE Certificate Directory is zero and Authenticode inspection reports `NotSigned`.\n\nProbe/build evidence:\n\n- `bcrypt-dynamic.exe` and `bcrypt-linked.exe` both build as x86 with PE subsystem floor `5.01`;\n- the dynamic probe has no link-time `bcrypt.dll` import and explicitly calls `LoadLibraryW(L".\\\\bcrypt.dll")` plus `GetProcAddress`;\n- the linked probe has a normal IAT dependency on `bcrypt.dll` through `bcrypt.lib`;\n- the staged runtime archive contains exactly `bcrypt.dll`, both probes, `run-on-xp.cmd`, and `README-XP.md`; the staged `bcrypt.dll` retains SHA-256 `ada28a...0cfc5`.\n\nHosted Windows Server 2022 runtime result:\n\n- exact-local dynamic load: `LOAD FAIL error=0x00000241`, `ExitCode=1`; decimal 577 is `ERROR_INVALID_IMAGE_HASH`; together with `Check integrity` plus no embedded signature, this is modern Windows Code Integrity refusal of the exact upstream image, not evidence of a missing dependency;\n- ordinary linked consumer: `LOAD PASS`, `EXPORTS PASS`, `RNG PASS`, `SHA256 PASS`, `ExitCode=0`, but `MODULE PATH` is `C:\\Windows\\System32\\bcrypt.dll`; modern Windows therefore satisfied the normal `bcrypt.dll` name with its system KnownDLL, so this success is only a consumer/build smoke and **does not execute the local One-Core bytes**.\n\nConclusion: **CI FAIL by the intentionally strict hosted criterion; physical-XP viability remains OPEN.** Do not clear `Check integrity`, re-sign, retarget, or otherwise mutate the upstream DLL merely to make Windows Server 2022 load it, because that would cease to test the pinned candidate. The next decisive experiment is to run artifact `9788031922` unchanged on physical Windows XP SP3 x86 via `run-on-xp.cmd`. Only a successful physical-XP run of both probes can mark this One-Core-API `bcrypt.dll` candidate physically XP-verified.\n\n---\n\n'''
          if 'focused One-Core-API `bcrypt.dll` XP x86 smoke defines exact closure' not in text:
              text = text.replace(marker, marker + entry, 1)
              test_log.write_text(text, encoding='utf-8', newline='\n')

          status = Path('docs/gost/XP_BCRYPT_STATUS.md')
          status.write_text('''# Windows XP x86 `bcrypt.dll` compatibility status\n\nLast updated: 2026-09-01\n\nThis document records the adopted remediation and current evidence for the Windows XP x86 `bcrypt.dll` dependency. It belongs to the Windows compatibility track only and is not GOST TLS handshake evidence.\n\n## Decision\n\nThe project continues to use the XP-compatible `bcrypt.dll` supplied by `shorthorn-project/One-Core-API-Binaries` as the selected dependency-level remediation for the core-browser `bcrypt.dll` imports. This remains independent of the YY-Thunks synchronization provider.\n\n## Exact candidate identity\n\nThe focused smoke pins the candidate to immutable upstream content rather than floating `master`:\n\n- repository: `shorthorn-project/One-Core-API-Binaries`;\n- upstream commit: `6c3b3b372d46dace7ba729dcd16b316b0acf664c`;\n- path: `Packages/x86/Pack Installer/base/bcrypt.dll`;\n- Git blob: `0b7d83ddbae62142ee6fca69208d77a8a5d3b0f7`;\n- size: `279552` bytes;\n- SHA-256: `ada28a011cf08d9e10780fde09966899f5f40e08c4f5abb05eaa38dbc2f0cfc5`.\n\n`bcryptprimitives.dll` is present beside the candidate upstream, but the recursive PE import audit does not include it in the dependency closure.\n\n## Focused smoke evidence\n\nCurrent exact focused experiment:\n\n- source-under-test: `9be3a933c3eac2defec24df4826fded48ead02f4`;\n- workflow: `bcrypt XP x86 smoke`;\n- Actions run `33475562495`, job `99753970359`;\n- runtime artifact `9788031922`, digest `sha256:c0d60f0a0bc18acd09abb9138ea2769a36c3996e71c87018ccf4842abd9e0817`;\n- diagnostics artifact `9788032206`, digest `sha256:83685ec9aebb4987e95e42cff6c74f958a1c9252d06721383323e0ab5b200fbe`;\n- CI conclusion: **failure**, specifically because the exact-local hosted runtime probe cannot load the unmodified candidate on Windows Server 2022.\n\nStatic surface established by this run:\n\n- machine: x86 (`0x14c`);\n- PE operating-system/image/subsystem version: `6.00`;\n- direct DLL imports: `ADVAPI32.dll`, `KERNEL32.dll`, `ntdll.dll`;\n- recursive local closure: **`bcrypt.dll` only**;\n- current explicit XP hard-import audit: no obvious post-XP hard imports detected in that closure;\n- required BCrypt exports all present: `BCryptOpenAlgorithmProvider`, `BCryptCloseAlgorithmProvider`, `BCryptGetProperty`, `BCryptCreateHash`, `BCryptHashData`, `BCryptFinishHash`, `BCryptDestroyHash`, `BCryptGenRandom`;\n- DLL characteristics contain `Check integrity`; Certificate Directory is zero; Authenticode status is `NotSigned`.\n\nBoth focused x86 consumer probes build with PE subsystem floor `5.01`. `bcrypt-dynamic.exe` has no link-time bcrypt dependency and explicitly requests `.\\bcrypt.dll`; `bcrypt-linked.exe` is an ordinary `bcrypt.lib` consumer with a normal `bcrypt.dll` IAT import.\n\n## Hosted-runner limitation\n\nOn the exact run, the dynamic local-load probe returns:\n\n```text\nLOAD FAIL error=0x00000241\nExitCode=1\n```\n\n`0x241` / 577 is `ERROR_INVALID_IMAGE_HASH`. Given the exact image's `Check integrity` characteristic and absence of an embedded signature, current Windows Server 2022 refuses the exact local upstream image under modern Code Integrity. This hosted failure must not be treated as physical-XP evidence and must not be worked around by mutating the candidate bytes.\n\nThe ordinary linked probe passes its functional RNG/SHA-256 test on the hosted runner, but records:\n\n```text\nMODULE PATH: C:\\Windows\\System32\\bcrypt.dll\n```\n\nThus modern Windows resolves the normal `bcrypt.dll` dependency to its system copy. That result proves the linked probe itself is a valid ordinary consumer; it does **not** validate the local One-Core-API implementation.\n\n## Physical XP acceptance boundary\n\nArtifact `9788031922` is the current physical Windows XP SP3 x86 test bundle. It contains exactly:\n\n- `bcrypt.dll` — 279552 bytes, SHA-256 `ada28a011cf08d9e10780fde09966899f5f40e08c4f5abb05eaa38dbc2f0cfc5`;\n- `bcrypt-dynamic.exe` — SHA-256 `851994bc485f850660a4a7409d224b1490a2ef46d64342b58ab2317d14a6bc37`;\n- `bcrypt-linked.exe` — SHA-256 `c9e0fc9d316da3286be9c2ca839ba1cd26f07979710825ffd69c1de514f4da57`;\n- `run-on-xp.cmd`;\n- `README-XP.md`.\n\nThe candidate is **not physically XP-verified yet**. The next decisive step is to copy this archive unchanged to physical Windows XP SP3 x86 and run `run-on-xp.cmd`. Both probes must return `ExitCode=0`; the functional output must include `LOAD PASS`, `EXPORTS PASS`, `RNG PASS`, and `SHA256 PASS`.\n\nDo not call the replacement fully accepted for XP runtime until that exact physical test succeeds.\n\n## Relationship to the full-browser work\n\nHistorical broad audit source `1635d28360ee35d47c1d8237bcf8f5864cc1144f`, Actions run `33310150314`, job `99253613546`, reported direct `bcrypt.dll` dependencies in `xul.dll` and `mozglue.dll`. The One-Core candidate remains the selected remediation for that DLL-level boundary.\n\nThis focused experiment neither builds Firefox nor changes the independent SRW/condition-variable/CRT/YY-Thunks line. Successful compilation or packaging elsewhere must not be confused with successful loading of this exact `bcrypt.dll` on physical XP.\n''', encoding='utf-8', newline='\n')

          state = Path('docs/gost/PROJECT_STATE.md')
          text = state.read_text(encoding='utf-8')
          needle = '`bcrypt.dll` remains directly imported by core browser PEs and is an independent compatibility boundary.'
          replacement = '''`bcrypt.dll` remains directly imported by core browser PEs and is an independent compatibility boundary. Its selected One-Core-API replacement now has focused immutable evidence at source `9be3a933c3eac2defec24df4826fded48ead02f4`, workflow `bcrypt XP x86 smoke`, run `33475562495`, job `99753970359`. The candidate is pinned to upstream commit `6c3b3b372d46dace7ba729dcd16b316b0acf664c`, blob `0b7d83ddbae62142ee6fca69208d77a8a5d3b0f7`, size `279552`, SHA-256 `ada28a011cf08d9e10780fde09966899f5f40e08c4f5abb05eaa38dbc2f0cfc5`. Its recursive local closure is only `bcrypt.dll` (adjacent `bcryptprimitives.dll` is not imported); required BCrypt exports are present and the current audit finds no obvious post-XP hard import in the closure.\n\nThe exact candidate is x86 but carries PE OS/image/subsystem version `6.00`, `Check integrity`, no Certificate Directory, and no Authenticode signature. Accordingly the exact-local dynamic probe on hosted Windows Server 2022 fails at `LoadLibraryW(.\\bcrypt.dll)` with `ERROR_INVALID_IMAGE_HASH` (`577` / `0x241`). The ordinary linked probe passes there only through `C:\\Windows\\System32\\bcrypt.dll`, so neither hosted result is physical-XP proof. Runtime artifact `9788031922` preserves the exact upstream DLL plus both XP-floor (`5.01`) x86 probes and is the next decisive physical Windows XP SP3 x86 experiment. Do not mutate the candidate merely to satisfy modern Code Integrity and do not mark it physically XP-verified before that artifact passes on real XP.'''
          if needle in text and 'run `33475562495`, job `99753970359`' not in text:
              text = text.replace(needle, replacement, 1)
              state.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gost/TEST_LOG.md docs/gost/PROJECT_STATE.md docs/gost/XP_BCRYPT_STATUS.md
          if git diff --cached --quiet; then
            echo "No documentation changes needed"
            exit 0
          fi
          git commit -m "docs(xp): record focused One-Core bcrypt smoke"
          git push origin HEAD:agent/gost-tls-poc
