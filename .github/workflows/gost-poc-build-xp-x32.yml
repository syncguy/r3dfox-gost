name: "GOST TLS PoC build  XP x32"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xp-x32:
    name: Windows x86 / r3dfox GOST / XP SP3 full build
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost-xp-x32
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      RUST_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET: "i686-pc-windows-msvc"
      RUSTFLAGS: "--cfg moz_xp_compat"
      MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
      MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
      YY_THUNKS_VERSION: "1.2.2"
      YY_THUNKS_TARGET: "5.1.2600.0"
      WINDOWS_XP_SUBSYSTEM: "5.01"
      OBJDIR: "obj-gost-xp-x32"
      BCRYPT_TAG: "xp-bcrypt-v1"
      BCRYPT_RELEASE_ID: "380563342"
      BCRYPT_ASSET_ID: "539647946"
      BCRYPT_SOURCE_SHA: "a30a701fcf50eb08b6ea7574cb7cc927f6eae014"
      BCRYPT_SIZE: "520704"
      BCRYPT_SHA1: "ae021f44edc48b03bb4d67cb5773b62bdf60cb67"
      BCRYPT_SHA256: "f157f8026347d180e9ab42732bedaad0ea2b3b03dfd0d9ba8b8abe9612aff193"

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify XP DPI pre-Vista source guard
        id: dpi-source-guard
        shell: powershell
        run: .\.github\scripts\xp\verify-dpi-source-guard.ps1

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: .\.github\scripts\xp\plan-pagefile.ps1

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile and show runner CPU
        shell: powershell
        run: .\.github\scripts\xp\verify-runner-pagefile.ps1
        
      - name: GATE - Verify committed mime_guess vendored checksum
        shell: powershell
        run: .\.github\scripts\xp\verify-mime-guess-checksum.ps1

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }

      - name: Prepare pinned legacy Firefox XP D3DCompiler_47
        shell: powershell
        run: .\.github\scripts\xp\prepare-legacy-d3dcompiler47.ps1

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD
          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"
          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) { throw 'Expected MSSPI Windows.h include was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($msspiCpp, $source.Replace('#include <Windows.h>', '#include <windows.h>').Replace('SECPKG_ATTR_REMOTE_CERT_CHAIN', 'SECPKG_ATTR_REMOTE_CERT_CONTEXT'), $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]
          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += ["msspi/src/msspi.cpp"]
              LOCAL_INCLUDES += ["msspi/src", "msspi/third_party/cprocsp/include"]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare pinned XP bcrypt release asset
        shell: powershell
        run: .\.github\scripts\xp\prepare-pinned-xp-bcrypt.ps1

      - name: Install pinned ordinary Rust x86 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Build pinned msvcr14x Release x86
        shell: powershell
        run: .\.github\scripts\xp\build-msvcr14x-release-x86.ps1

      - name: GATE - Require proven XP x86 msvcr14x runtime contract
        shell: powershell
        run: .\.github\scripts\xp\verify-msvcr14x-xp-contract.ps1

      - name: Prepare pinned private DirectWrite integration
        id: prepare-private-dwrite
        shell: powershell
        run: .\.github\scripts\xp\prepare-private-dwrite-integration.ps1

      - name: Download YY-Thunks 1.2.2 XP x86 libraries
        shell: powershell
        run: .\.github\scripts\xp\prepare-yy-thunks-x86.ps1

      - name: Build narrow YY XP x86 provider
        shell: powershell
        run: .\.github\scripts\xp\build-narrow-yy.ps1

      - name: Activate narrow YY XP x86 provider for all target links
        shell: powershell
        run: .\.github\scripts\xp\activate-narrow-yy-provider.ps1

      - name: GATE - Verify committed xul.dll YY TLS entry-point contract
        shell: powershell
        run: .\.github\scripts\xp\verify-xul-yy-entrypoint-contract.ps1

      - name: Write XP x32 mozconfig
        shell: powershell
        run: |
          @'
          mk_add_options AUTOCLOBBER=1
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-gost-xp-x32
          mk_add_options MOZ_PARALLEL_BUILD=4
          mk_add_options MOZ_MAKE_FLAGS="-j4"
          ac_add_options --enable-bootstrap
          ac_add_options --target=i686
          ac_add_options --disable-cargo-incremental
          ac_add_options --enable-application=browser
          ac_add_options --disable-artifact-builds
          ac_add_options --enable-official-branding
          ac_add_options --disable-debug
          ac_add_options --disable-debug-js-modules
          ac_add_options --enable-debug-symbols
          ac_add_options --disable-tests
          ac_add_options --disable-sandbox
          ac_add_options --enable-hardening
          ac_add_options --enable-stl-hardening
          ac_add_options --enable-jemalloc
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --enable-rust-simd
          ac_add_options --enable-replace-malloc
          ac_add_options --disable-eme
          ac_add_options --enable-jxl
          ac_add_options --enable-raw
          ac_add_options --disable-webrtc
          ac_add_options --disable-backgroundtasks
          ac_add_options --disable-bits-download
          ac_add_options --disable-crashreporter
          ac_add_options --disable-default-browser-agent
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-necko-wifi
          ac_add_options --disable-notification-server
          ac_add_options --disable-parental-controls
          ac_add_options --without-onnx-runtime
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --disable-update-agent
          ac_add_options --disable-updater
          mk_add_options MOZ_CRASHREPORTER=0
          mk_add_options MOZ_DATA_REPORTING=0
          mk_add_options MOZ_SERVICES_HEALTHREPORT=0
          mk_add_options MOZ_TELEMETRY_REPORTING=
          export CFLAGS="$CFLAGS -DMOZ_NO_WINRT -DMOZ_XP_COMPAT"
          export CXXFLAGS="$CXXFLAGS -DMOZ_NO_WINRT -DMOZ_XP_COMPAT"
          export MOZ_CRASHREPORTER=0
          export MOZ_DATA_REPORTING=0
          export MOZ_REQUIRE_SIGNING=
          export MOZ_TELEMETRY_REPORTING=
          export MOZ_PACKAGE_JSSHELL=1
          '@ | Set-Content '.mozconfig-gost-xp-x32'

      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Firefox x86 target
        shell: powershell
        run: .\.github\scripts\xp\configure-firefox-x86-target.ps1

      - name: Build export prerequisites
        shell: powershell
        run: .\.github\scripts\xp\build-export-prerequisites.ps1

      - name: GATE - Compile security manager SSL target objects
        shell: powershell
        run: .\.github\scripts\xp\compile-security-manager-ssl-targets.ps1

      - name: Build release r3dfox XP x32
        id: build-release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: DIAG - Record xul IPHLPAPI XP compatibility imports
        id: xul-iphlpapi-import-diag
        if: always() && steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\diag-xul-iphlpapi.ps1

      - name: GATE - Require XP battery Vista-only USER32 imports absent from xul.dll
        id: battery-power-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-xul-battery-user32-imports.ps1

      - name: GATE - Require source-remediation quartet absent from xul.dll
        id: source-remediation-quartet
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-xul-source-remediation-quartet.ps1

      - name: GATE - Require ADVAPI32 compatibility family absent from xul.dll
        id: advapi32-etw-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-xul-advapi32-compat-imports.ps1

      - name: GATE - Verify mozglue SetProcessDPIAware stays delay-loaded
        id: dpi-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-mozglue-dpi-delay-import.ps1

      - name: GATE - Reject proven core browser XP direct imports
        id: sync-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\reject-core-browser-xp-direct-imports.ps1

      - name: Stage msvcr14x XP runtime DLLs
        id: stage-runtime
        if: always() && steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          if (-not (Test-Path $bin)) { throw "Firefox dist/bin missing: $bin" }
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $src = Join-Path $env:MSVCR14X_RELEASE $dll
            if (-not (Test-Path $src)) { throw "Required msvcr14x runtime missing: $src" }
            Copy-Item -Force $src (Join-Path $bin $dll)
          }

      - name: Stage pinned legacy Firefox XP D3DCompiler_47
        id: stage-legacy-d3dcompiler
        if: steps.stage-runtime.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $dst = Join-Path $bin 'd3dcompiler_47.dll'
          if (-not (Test-Path $dst)) { throw "Build-produced D3DCompiler_47 missing: $dst" }
          $before = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          Copy-Item -Force $env:LEGACY_D3DCOMPILER47 $dst
          $after = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          if ($after -ne $expected) { throw "Legacy D3DCompiler_47 stage hash mismatch: $after" }
          $version = (Get-Item $dst).VersionInfo.FileVersion
          if ($version -notlike '10.0.14393.33*') { throw "Unexpected legacy D3DCompiler_47 version: $version" }
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @("source=$env:LEGACY_D3DCOMPILER47", "build_dll_sha256=$before", "legacy_source_sha256=$after", "file_version=$version") | Set-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

      - name: Stage pinned private DirectWrite closure
        id: stage-private-dwrite
        if: steps.stage-legacy-d3dcompiler.outcome == 'success'
        shell: powershell
        run: .\.github\scripts\xp\dwrite-private-closure.ps1 -Mode Stage

      - name: Retarget dist/bin PE subsystem headers to XP x86
        id: retarget-pe
        if: steps.stage-private-dwrite.outcome == 'success'
        shell: powershell
        run: .\.github\scripts\xp\retarget-dist-bin-pe-subsystem.ps1

      - name: GATE - Verify retargeted legacy D3DCompiler_47
        id: verify-retargeted-d3dcompiler
        if: steps.retarget-pe.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-retargeted-legacy-d3dcompiler47.ps1

      - name: GATE - Verify private DirectWrite closure after PE retarget
        id: verify-private-dwrite
        if: steps.retarget-pe.outcome == 'success'
        shell: powershell
        run: .\.github\scripts\xp\dwrite-private-closure.ps1 -Mode Verify

      - name: Stage proven XP bcrypt.dll
        id: stage-xp-bcrypt
        if: always() && steps.verify-private-dwrite.outcome == 'success'
        shell: powershell
        run: .\.github\scripts\xp\stage-proven-xp-bcrypt.ps1

      - name: GATE - Record staged XP CRT identity before packaging
        id: record-staged-crt
        if: steps.stage-xp-bcrypt.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $rows = [System.Collections.Generic.List[string]]::new()
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $path = Join-Path $bin $dll
            if (-not (Test-Path $path)) { throw "Staged XP CRT missing before packaging: $path" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $rows.Add("$dll|sha256=$hash")
            if ($dll -eq 'ucrtbase.dll') { "XP_UCRTBASE_STAGED_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 } else { "XP_MSVCP140_STAGED_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $rows | Set-Content -Encoding utf8 diagnostics\packaged-crt-contract.txt

      - name: Package XP x32 experiment
        id: package-release
        if: steps.record-staged-crt.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify legacy D3DCompiler_47 survived packaging
        id: verify-legacy-d3dcompiler
        if: steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:LEGACY_D3DCOMPILER47_RETARGETED_SHA256
          if (-not $expected) { throw 'Retargeted D3DCompiler_47 hash was not recorded' }
          $dll = Join-Path $env:OBJDIR 'dist\bin\d3dcompiler_47.dll'
          if (-not (Test-Path $dll)) { throw "Staged D3DCompiler_47 disappeared after package: $dll" }
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "D3DCompiler_47 changed during package: expected=$expected actual=$hash" }
          "post_package_sha256=$hash" | Add-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

      - name: GATE - Verify msvcr14x CRT survived portable packaging
        id: verify-packaged-crt
        if: always() && steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: .\.github\scripts\xp\verify-packaged-msvcr14x-crt.ps1

      - name: GATE - Verify private DirectWrite closure survived portable packaging
        id: verify-packaged-private-dwrite
        if: always() && steps.verify-packaged-crt.outcome == 'success'
        shell: powershell
        run: .\.github\scripts\xp\dwrite-private-closure.ps1 -Mode VerifyPackage

      - name: GATE - Verify proven bcrypt survived portable packaging
        id: verify-packaged-bcrypt
        if: always() && steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:XP_PORTABLE_ARCHIVE -or -not (Test-Path $env:XP_PORTABLE_ARCHIVE)) { throw 'Portable archive is unavailable for bcrypt gate' }
          if (-not $env:XP_BCRYPT_STAGED_SHA256) { throw 'Staged bcrypt hash was not recorded before packaging' }
          $extract = Join-Path $env:RUNNER_TEMP ("xp-package-bcrypt-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 7z.exe x $env:XP_PORTABLE_ARCHIVE "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract portable archive for bcrypt gate' }
          $found = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'bcrypt.dll')
          if ($found.Count -ne 1) { throw "Portable package must contain exactly one bcrypt.dll; found $($found.Count)" }
          $item = Get-Item $found[0].FullName
          $sha1 = (Get-FileHash -Algorithm SHA1 $found[0].FullName).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -Algorithm SHA256 $found[0].FullName).Hash.ToLowerInvariant()
          if ([string]$item.Length -ne $env:BCRYPT_SIZE) { throw "Packaged bcrypt.dll size mismatch: $($item.Length)" }
          if ($sha1 -ne $env:BCRYPT_SHA1) { throw "Packaged bcrypt.dll SHA1 mismatch: $sha1" }
          if ($sha256 -ne $env:XP_BCRYPT_STAGED_SHA256 -or $sha256 -ne $env:BCRYPT_SHA256) { throw "Packaged bcrypt.dll SHA256 mismatch: expected=$env:BCRYPT_SHA256 staged=$env:XP_BCRYPT_STAGED_SHA256 actual=$sha256" }
          @("archive=$env:XP_PORTABLE_ARCHIVE","packaged_path=$($found[0].FullName)","bcrypt.dll|size=$($item.Length)","bcrypt.dll|sha1=$sha1","bcrypt.dll|sha256=$sha256") | Add-Content -Encoding utf8 diagnostics\packaged-bcrypt-contract.txt

      - name: Build XP x32 runtime test archive from dist/bin
        id: runtime-archive
        if: always() && steps.package-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (Resolve-Path (Join-Path $env:OBJDIR 'dist\bin')).Path
          $dist = (Resolve-Path (Join-Path $env:OBJDIR 'dist')).Path
          $archive = Join-Path $dist 'r3dfox-gost-xp-x32-runtime.7z'
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Push-Location $bin
          try { & 7z.exe a -t7z -mx=7 $archive '.\*'; if ($LASTEXITCODE -ne 0) { throw "7z runtime archive failed: $LASTEXITCODE" } } finally { Pop-Location }
          "XP_RUNTIME_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: GATE - Audit XP x32 PE floor and direct imports
        id: xp-import-audit
        if: steps.runtime-archive.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Normalize-Api([string]$name) { if ($name -match '^_(.+)@\d+$') { return $matches[1] }; return $name }
          function Read-Binary([System.IO.FileInfo]$binary, [string]$diagRoot) {
            $safe = ($binary.FullName.Substring((Resolve-Path (Join-Path $env:OBJDIR 'dist\bin')).Path.Length).TrimStart('\') -replace '[^A-Za-z0-9_.-]', '_')
            $headers = @(& dumpbin.exe /nologo /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed: $($binary.FullName)" }
            $headers | Set-Content -Encoding utf8 (Join-Path $diagRoot "$safe-headers.txt")
            $machine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machine -or $machine -notmatch '(?i)^\s*14C machine \(x86\)') { throw "$($binary.FullName) is not PE x86 machine 14C" }
            $versionLine = $headers | Where-Object { $_ -match '(?i)subsystem version' } | Select-Object -First 1
            if (-not $versionLine -or $versionLine -notmatch '^\s*([0-9]+)\.([0-9]+)\s+subsystem version') { throw "Cannot parse subsystem version: $($binary.FullName)" }
            $version = [version]("$([int]$matches[1]).$([int]$matches[2])")
            if ($version -gt [version]'5.1') { throw "$($binary.FullName) subsystem $version is newer than XP x86 5.01" }
            $importsRaw = @(& dumpbin.exe /nologo /imports $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed: $($binary.FullName)" }
            $importsRaw | Set-Content -Encoding utf8 (Join-Path $diagRoot "$safe-imports.txt")
            $dlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $apis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $delayDlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $delayApis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $mode = 'none'
            foreach ($line in $importsRaw) {
              if ($line -match '^\s*Section contains the following imports:\s*$') { $mode = 'direct'; continue }
              if ($line -match '^\s*Section contains the following delay load imports:\s*$') { $mode = 'delay'; continue }
              if ($line -match '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') { if ($mode -eq 'direct') { [void]$dlls.Add($matches[1]) } elseif ($mode -eq 'delay') { [void]$delayDlls.Add($matches[1]) }; continue }
              $entry = $line.Trim()
              if ($entry -match '^[0-9A-Fa-f]+\s+(\S+)$') { $api = Normalize-Api $matches[1]; if ($mode -eq 'direct') { [void]$apis.Add($api) } elseif ($mode -eq 'delay') { [void]$delayApis.Add($api) } }
            }
            return @{ Dlls=$dlls; Apis=$apis; DelayDlls=$delayDlls; DelayApis=$delayApis }
          }
          $diagRoot = Join-Path $env:GITHUB_WORKSPACE 'xp-x32-import-audit'
          New-Item -ItemType Directory -Force $diagRoot | Out-Null
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $binResolved = (Resolve-Path $bin).Path
          $targets = @(Get-ChildItem -LiteralPath $bin -Recurse -File | Where-Object { $_.Extension -in @('.exe','.dll') })
          $forbiddenDllPatterns = @('^(?i)(api-ms-win-|ext-ms-)','^(?i)KERNELBASE\.dll$','^(?i)BCRYPTPRIMITIVES\.dll$','^(?i)COMBASE\.dll$','^(?i)NCRYPT\.dll$','^(?i)WEVTAPI\.dll$','^(?i)DWMAPI\.dll$','^(?i)SHCORE\.dll$','^(?i)PATHCCH\.dll$','^(?i)NORMALIZ\.dll$','^(?i)PROPSYS\.dll$','^(?i)DXGI\.dll$','^(?i)VCRUNTIME140(?:_1)?\.dll$')
          $privateDwriteApiSets = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($name in @('api-ms-win-crt-heap-l1-1-0.dll','api-ms-win-crt-math-l1-1-0.dll','api-ms-win-crt-runtime-l1-1-0.dll','api-ms-win-crt-stdio-l1-1-0.dll','api-ms-win-crt-string-l1-1-0.dll')) { [void]$privateDwriteApiSets.Add($name) }
          $forbiddenApis = @(
            'AcquireSRWLockExclusive','AcquireSRWLockShared','CancelIoEx','CompareStringEx','CompareStringOrdinal','CreateEventExA','CreateEventExW','CreateFile2','CreateMutexExA','CreateMutexExW','CreateSemaphoreExW',
            'CreateSymbolicLinkA','CreateSymbolicLinkW','CreateThreadpool','CreateThreadpoolCleanupGroup','CreateThreadpoolIo','CreateThreadpoolTimer','CreateThreadpoolWait','CreateThreadpoolWork','FlsAlloc','FlsFree','FlsGetValue','FlsSetValue',
            'GetActiveProcessorCount','GetCurrentProcessorNumber','GetCurrentProcessorNumberEx','GetFileInformationByHandleEx','GetFinalPathNameByHandleA','GetFinalPathNameByHandleW','GetLocaleInfoEx','GetLogicalProcessorInformationEx',
            'GetMaximumProcessorCount','GetOverlappedResultEx','GetSystemTimePreciseAsFileTime','GetTempPath2A','GetTempPath2W','GetTickCount64','GetUserDefaultLocaleName','InitializeConditionVariable','InitializeCriticalSectionEx','InitializeSRWLock',
            'IsThreadAFiber','LCIDToLocaleName','LocaleNameToLCID','ProcessPrng','QueryUnbiasedInterruptTime','ReleaseSRWLockExclusive','ReleaseSRWLockShared','SetFileInformationByHandle','SetThreadDescription','SetThreadStackGuarantee',
            'SleepConditionVariableCS','SleepConditionVariableSRW','SubmitThreadpoolWork','TryAcquireSRWLockExclusive','TryAcquireSRWLockShared','WaitOnAddress','WakeAllConditionVariable','WakeByAddressAll','WakeByAddressSingle','WakeConditionVariable',
            'CreateWaitableTimerExA','CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread','GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear',
            'GetUserPreferredUILanguages','GetThreadPreferredUILanguages','InitOnceExecuteOnce','InitOnceBeginInitialize','InitOnceComplete','GetApplicationRestartSettings','RegisterApplicationRestart','UnregisterApplicationRestart',
            'GetNamedPipeServerProcessId','SetProcessDPIAware','NtCancelIoFileEx','EventRegister','EventUnregister','EventWrite','EventWriteTransfer','RegGetValueW','WSAIoctl','inet_ntop','WSASendMsg','WSCGetProviderInfo',
            'QueryFullProcessImageNameA','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime'
          )
          $hits = [System.Collections.Generic.List[string]]::new()
          $rows = [System.Collections.Generic.List[string]]::new()
          $delayRows = [System.Collections.Generic.List[string]]::new()
          foreach ($target in $targets) {
            $relativeTarget = $target.FullName.Substring($binResolved.Length).TrimStart('\') -replace '\\','/'
            $imports = Read-Binary $target $diagRoot
            foreach ($dll in @($imports.Dlls | Sort-Object)) {
              $rows.Add("$($target.FullName)|DLL|$dll")
              $privateDwriteApiSet = $relativeTarget -ieq 'xpcompat/dwrite/DWrite.dll' -and $privateDwriteApiSets.Contains($dll)
              if ($privateDwriteApiSet) { continue }
              foreach ($pattern in $forbiddenDllPatterns) { if ($dll -match $pattern) { $hits.Add("$($target.FullName)|DLL|$dll"); break } }
            }
            foreach ($api in @($imports.Apis | Sort-Object)) { $rows.Add("$($target.FullName)|API|$api"); if ($forbiddenApis -contains $api) { $hits.Add("$($target.FullName)|API|$api") } }
            foreach ($dll in @($imports.DelayDlls | Sort-Object)) { $delayRows.Add("$($target.FullName)|DLL|$dll") }
            foreach ($api in @($imports.DelayApis | Sort-Object)) { $delayRows.Add("$($target.FullName)|API|$api") }
          }
          $rows | Set-Content -Encoding utf8 xp-x32-direct-imports.txt
          $delayRows | Set-Content -Encoding utf8 xp-x32-delay-imports.txt
          $hits | Sort-Object -Unique | Set-Content -Encoding utf8 xp-x32-forbidden-direct-imports.txt
          if ($hits.Count -gt 0) { throw 'Known direct post-XP imports survived; see xp-x32-forbidden-direct-imports.txt' }

      - name: DIAG - Inventory YY-Thunks DLL entry-point coverage
        id: yy-dll-entrypoint-diag
        if: always() && steps.runtime-archive.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $bin = (Resolve-Path (Join-Path $env:OBJDIR 'dist\bin')).Path
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\yy-dll-entrypoint-audit.txt'
          $missingPath = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\yy-dll-entrypoint-missing-contract.txt'

          function Read-U16([byte[]]$Data, [int]$Offset) {
            if ($Offset -lt 0 -or ($Offset + 2) -gt $Data.Length) { throw "PE read U16 out of range at $Offset" }
            return [BitConverter]::ToUInt16($Data, $Offset)
          }
          function Read-U32([byte[]]$Data, [int]$Offset) {
            if ($Offset -lt 0 -or ($Offset + 4) -gt $Data.Length) { throw "PE read U32 out of range at $Offset" }
            return [BitConverter]::ToUInt32($Data, $Offset)
          }
          function Convert-RvaToFileOffset([byte[]]$Data, [int]$SectionTable, [int]$SectionCount, [uint32]$Rva) {
            for ($i = 0; $i -lt $SectionCount; $i++) {
              $section = $SectionTable + (40 * $i)
              $virtualSize = Read-U32 $Data ($section + 8)
              $virtualAddress = Read-U32 $Data ($section + 12)
              $rawSize = Read-U32 $Data ($section + 16)
              $rawPointer = Read-U32 $Data ($section + 20)
              $span = [Math]::Max([uint64]$virtualSize, [uint64]$rawSize)
              $rva64 = [uint64]$Rva
              $va64 = [uint64]$virtualAddress
              if ($rva64 -ge $va64 -and $rva64 -lt ($va64 + $span)) {
                return [int]([uint64]$rawPointer + ($rva64 - $va64))
              }
            }
            throw ("Cannot map RVA 0x{0:X8}" -f $Rva)
          }
          function Test-FixedBytes([byte[]]$Data, [int]$Offset, [hashtable]$Expected) {
            foreach ($key in $Expected.Keys) {
              $index = $Offset + [int]$key
              if ($index -lt 0 -or $index -ge $Data.Length -or $Data[$index] -ne [byte]$Expected[$key]) { return $false }
            }
            return $true
          }

          $entryFingerprint = @{
            0=0x53; 1=0x56; 2=0x57; 3=0x8B; 4=0x3D;
            9=0x85; 10=0xFF; 11=0x75; 12=0x05; 13=0xBF;
            18=0x8B; 19=0x44; 20=0x24; 21=0x14; 22=0x83; 23=0xE8; 24=0x00
          }
          $firstCallbackFingerprint = @{
            0=0x33; 1=0xC0; 2=0x40; 3=0x39; 4=0x44; 5=0x24; 6=0x08;
            7=0x75; 8=0x0E; 9=0x83; 10=0x3D; 15=0x00; 16=0x75; 17=0x05;
            18=0xA3; 23=0xC2; 24=0x0C; 25=0x00
          }

          function Get-YyDllContract([byte[]]$Data, [string]$Path) {
            if ($Data.Length -lt 0x100) { throw "PE too small: $Path" }
            $peOffset = [int](Read-U32 $Data 0x3C)
            if (($peOffset + 24) -gt $Data.Length) { throw "Invalid PE offset: $Path" }
            if ($Data[$peOffset] -ne 0x50 -or $Data[$peOffset + 1] -ne 0x45 -or $Data[$peOffset + 2] -ne 0 -or $Data[$peOffset + 3] -ne 0) { throw "Missing PE signature: $Path" }
            $coff = $peOffset + 4
            $machine = Read-U16 $Data $coff
            if ($machine -ne 0x14C) { return [pscustomobject]@{ X86=$false; EntryWrapper=$false; FirstTlsCallback=$false } }
            $sectionCount = [int](Read-U16 $Data ($coff + 2))
            $optionalSize = [int](Read-U16 $Data ($coff + 16))
            $optional = $coff + 20
            if ((Read-U16 $Data $optional) -ne 0x10B) { throw "Expected PE32 optional header: $Path" }
            $entryRva = Read-U32 $Data ($optional + 16)
            $imageBase = Read-U32 $Data ($optional + 28)
            $sectionTable = $optional + $optionalSize

            $entryWrapper = $false
            if ($entryRva -ne 0) {
              $entryOffset = Convert-RvaToFileOffset $Data $sectionTable $sectionCount $entryRva
              $entryWrapper = Test-FixedBytes $Data $entryOffset $entryFingerprint
            }

            $firstTlsCallback = $false
            $numberOfRvaAndSizes = Read-U32 $Data ($optional + 92)
            if ($numberOfRvaAndSizes -gt 9) {
              $tlsRva = Read-U32 $Data ($optional + 96 + (9 * 8))
              if ($tlsRva -ne 0) {
                $tlsOffset = Convert-RvaToFileOffset $Data $sectionTable $sectionCount $tlsRva
                $callbacksVa = Read-U32 $Data ($tlsOffset + 12)
                if ([uint64]$callbacksVa -ge [uint64]$imageBase -and $callbacksVa -ne 0) {
                  $callbacksRva = [uint32]([uint64]$callbacksVa - [uint64]$imageBase)
                  $callbacksOffset = Convert-RvaToFileOffset $Data $sectionTable $sectionCount $callbacksRva
                  for ($i = 0; $i -lt 32; $i++) {
                    $callbackVa = Read-U32 $Data ($callbacksOffset + (4 * $i))
                    if ($callbackVa -eq 0) { break }
                    if ([uint64]$callbackVa -lt [uint64]$imageBase) { continue }
                    $callbackRva = [uint32]([uint64]$callbackVa - [uint64]$imageBase)
                    try {
                      $callbackOffset = Convert-RvaToFileOffset $Data $sectionTable $sectionCount $callbackRva
                      if (Test-FixedBytes $Data $callbackOffset $firstCallbackFingerprint) { $firstTlsCallback = $true; break }
                    } catch { }
                  }
                }
              }
            }
            return [pscustomobject]@{ X86=$true; EntryWrapper=$entryWrapper; FirstTlsCallback=$firstTlsCallback }
          }

          $trackedApis = @(
            'ProcessPrng','GetSystemTimePreciseAsFileTime','FlsAlloc','FlsFree','FlsSetValue',
            'IsThreadAFiber','SetThreadStackGuarantee','AcquireSRWLockExclusive','AcquireSRWLockShared',
            'ReleaseSRWLockExclusive','ReleaseSRWLockShared','InitializeSRWLock','InitializeConditionVariable',
            'SleepConditionVariableCS','SleepConditionVariableSRW','WakeAllConditionVariable','WakeConditionVariable',
            'GetTickCount64','InitializeCriticalSectionEx','CompareStringOrdinal','GetCurrentProcessorNumber',
            'GetFileInformationByHandleEx','GetFinalPathNameByHandleW','GetLocaleInfoEx','LCIDToLocaleName',
            'LocaleNameToLCID','SetFileInformationByHandle','CancelIoEx','CreateWaitableTimerExW',
            'CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread','GetQueuedCompletionStatusEx',
            'GetThreadId','GetTimeZoneInformationForYear','GetUserPreferredUILanguages','GetThreadPreferredUILanguages',
            'InitOnceExecuteOnce','InitOnceBeginInitialize','InitOnceComplete','QueryFullProcessImageNameA',
            'QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime','TryAcquireSRWLockExclusive','FlsGetValue',
            'NtCancelIoFileEx','EventRegister','EventUnregister','EventWrite','EventWriteTransfer','RegGetValueW','WSAIoctl','inet_ntop'
          )

          $report = [System.Collections.Generic.List[string]]::new()
          $missing = [System.Collections.Generic.List[string]]::new()
          $strongCount = 0
          $contractCount = 0
          $xulPositiveControl = $false
          $dlls = @(Get-ChildItem -LiteralPath $bin -Recurse -File -Filter '*.dll' | Sort-Object FullName)
          foreach ($dll in $dlls) {
            $relative = $dll.FullName.Substring($bin.Length).TrimStart('\') -replace '\\','/'
            try {
              $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
              $pe = Get-YyDllContract $bytes $dll.FullName
              if (-not $pe.X86) {
                $report.Add("dll=$relative|classification=SKIP_NON_X86")
                continue
              }
              $imports = @(& dumpbin.exe /nologo /imports $dll.FullName 2>&1)
              $dumpbinExit = $LASTEXITCODE
              if ($dumpbinExit -ne 0) {
                $report.Add("dll=$relative|classification=INCONCLUSIVE_IMPORT_SCAN|dumpbin_exit=$dumpbinExit")
                continue
              }
              $importText = $imports -join "`n"
              $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
              $resolverHits = [System.Collections.Generic.List[string]]::new()
              foreach ($api in $trackedApis) {
                if ($ascii.IndexOf($api, [System.StringComparison]::Ordinal) -lt 0) { continue }
                if ($importText.IndexOf($api, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { continue }
                $resolverHits.Add($api)
              }
              $strong = $resolverHits.Count -ge 2
              $contract = [bool]($pe.EntryWrapper -and $pe.FirstTlsCallback)
              if ($strong) { $strongCount++ }
              if ($contract) { $contractCount++ }
              if ($strong -and $contract) { $classification = 'YY_CANDIDATE_CONTRACT_PRESENT' }
              elseif ($strong) { $classification = 'YY_CANDIDATE_CONTRACT_MISSING' }
              elseif ($contract) { $classification = 'YY_CONTRACT_PRESENT_NO_STRONG_RESOLVER_EVIDENCE' }
              else { $classification = 'NO_STRONG_YY_RESOLVER_EVIDENCE' }
              $hash = (Get-FileHash -Algorithm SHA256 $dll.FullName).Hash.ToLowerInvariant()
              $report.Add("dll=$relative|sha256=$hash|resolver_nonimport_hits=$($resolverHits.Count)|entry_wrapper=$($pe.EntryWrapper.ToString().ToLowerInvariant())|yy_first_tls_callback=$($pe.FirstTlsCallback.ToString().ToLowerInvariant())|contract=$($contract.ToString().ToLowerInvariant())|classification=$classification|apis=$($resolverHits -join ',')")
              if ($classification -eq 'YY_CANDIDATE_CONTRACT_MISSING') { $missing.Add("$relative|apis=$($resolverHits -join ',')") }
              if ($relative -ieq 'xul.dll' -and $strong -and $contract) { $xulPositiveControl = $true }
            } catch {
              $report.Add("dll=$relative|classification=INCONCLUSIVE_EXCEPTION|message=$($_.Exception.Message -replace '[\r\n]+',' ')")
            } finally {
              Remove-Variable ascii,bytes -ErrorAction SilentlyContinue
            }
          }

          $header = @(
            "source=$env:GITHUB_SHA",
            'scope=dist/bin/**/*.dll',
            'mode=non-blocking heuristic inventory',
            'strong_candidate_rule=at least two tracked YY-provider API strings absent from ordinary/delay import dump',
            'contract_rule=YY v1.2.2 x86 entry-wrapper fingerprint AND YY FirstCallback TLS fingerprint',
            "xul_positive_control=$($xulPositiveControl.ToString().ToLowerInvariant())",
            "strong_candidates=$strongCount",
            "contracts_present=$contractCount",
            "missing_contract_candidates=$($missing.Count)"
          )
          @($header + $report) | Set-Content -Encoding utf8 $reportPath
          if ($missing.Count -gt 0) { $missing | Set-Content -Encoding utf8 $missingPath } else { 'none' | Set-Content -Encoding utf8 $missingPath }

          Write-Host "YY DLL inventory: strong candidates=$strongCount, contracts=$contractCount, missing-contract candidates=$($missing.Count)"
          if (-not $xulPositiveControl) { Write-Warning 'xul.dll did not satisfy the known-good YY wrapper/TLS callback positive control; treat this diagnostic as inconclusive.' }
          if ($missing.Count -gt 0) {
            Write-Warning 'Strong YY resolver candidates without the DLL entry-point/TLS contract were found. This is evidence for follow-up, not proof that any physical XP crash is caused by YY-Thunks.'
            $missing | ForEach-Object { Write-Warning $_ }
          }

      - name: Upload XP x32 full-build package
        if: always() && steps.package-release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-package
          if-no-files-found: error
          compression-level: 0
          path: |
            obj-gost-xp-x32/dist/*.zip
            obj-gost-xp-x32/dist/*.7z
            obj-gost-xp-x32/dist/*.installer.exe

      - name: Upload XP x32 physical-test runtime archive
        if: always() && steps.runtime-archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-runtime
          if-no-files-found: error
          compression-level: 0
          path: ${{ env.XP_RUNTIME_ARCHIVE }}

      - name: Upload XP x32 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-diagnostics
          if-no-files-found: warn
          path: |
            configure-xp-x32.log
            xp-x32-retargeted-pe.txt
            xp-x32-direct-imports.txt
            xp-x32-delay-imports.txt
            xp-x32-forbidden-direct-imports.txt
            xp-x32-battery-power-import/**
            xp-x32-source-remediation-quartet/**
            xp-x32-advapi32-etw-import/**
            xp-x32-dpi-delay-import/**
            xp-x32-sync-import-gate/**
            xp-x32-import-audit/**
            diagnostics/**
            obj-gost-xp-x32/**/xul.pdb
            ${{ runner.temp }}/r3dfox-xp-x32-narrow-yy/**
            ${{ runner.temp }}/r3dfox-xp-x32-ntcancel-alias/**
            ${{ runner.temp }}/r3dfox-xp-x32-advapi32-etw-alias/**
            ${{ runner.temp }}/r3dfox-xp-x32-ws2_32-alias/**

      - name: GATE - Summarize XP x32 full build
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Name='dpi-source-guard'; Outcome='${{ steps.dpi-source-guard.outcome }}' },
            @{ Name='battery-power-import'; Outcome='${{ steps.battery-power-import-gate.outcome }}' },
            @{ Name='source-remediation-quartet'; Outcome='${{ steps.source-remediation-quartet.outcome }}' },
            @{ Name='advapi32-compat-import'; Outcome='${{ steps.advapi32-etw-import-gate.outcome }}' },
            @{ Name='dpi-import-mode'; Outcome='${{ steps.dpi-import-gate.outcome }}' },
            @{ Name='core-import'; Outcome='${{ steps.sync-import-gate.outcome }}' },
            @{ Name='retargeted-d3dcompiler'; Outcome='${{ steps.verify-retargeted-d3dcompiler.outcome }}' },
            @{ Name='private-dwrite'; Outcome='${{ steps.verify-private-dwrite.outcome }}' },
            @{ Name='packaged-d3dcompiler'; Outcome='${{ steps.verify-legacy-d3dcompiler.outcome }}' },
            @{ Name='packaged-crt'; Outcome='${{ steps.verify-packaged-crt.outcome }}' },
            @{ Name='packaged-private-dwrite'; Outcome='${{ steps.verify-packaged-private-dwrite.outcome }}' },
            @{ Name='packaged-bcrypt'; Outcome='${{ steps.verify-packaged-bcrypt.outcome }}' },
            @{ Name='broad-import-audit'; Outcome='${{ steps.xp-import-audit.outcome }}' }
          )
          $operations = @(
            @{ Name='build'; Outcome='${{ steps.build-release.outcome }}' },
            @{ Name='package'; Outcome='${{ steps.package-release.outcome }}' },
            @{ Name='runtime-archive'; Outcome='${{ steps.runtime-archive.outcome }}' }
          )
          $red = [System.Collections.Generic.List[string]]::new()
          "## GOST TLS PoC build XP x32: final evidence summary" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source: $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Target: i686-pc-windows-msvc / Windows XP SP3 x86." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- XP source defines: MOZ_NO_WINRT + MOZ_XP_COMPAT via CFLAGS/CXXFLAGS." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Private DirectWrite: focused contract source 8c30be63ea03a289ca24de4e2dc3e3859f34473e / run 34321430843 / job 102368728335; packaged as xpcompat/dwrite with exact 10-member pinned closure, shared msvcr14x ucrtbase.dll, absolute private DWrite path + LOAD_WITH_ALTERED_SEARCH_PATH, and no explicit pwrp preload." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Under MOZ_XP_COMPAT both XRE startup and gfx Factory DirectWrite load paths use LoadLibraryXPPrivateDWrite; LoadLibrarySystem32(DWrite.dll) remains non-XP only. Optimized read-ahead uses the packaged private path." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Broad PE audit retains the api-ms-win-* prohibition except for the five exact pinned CRT API-set imports of xpcompat/dwrite/DWrite.dll; the dedicated private-DWrite closure gate validates that exception recursively." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- DPI pre-Vista source guard: ${{ steps.dpi-source-guard.outcome }}." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Battery USER32 import gate: ${{ steps.battery-power-import-gate.outcome }}; RegisterPowerSettingNotification/UnregisterPowerSettingNotification must be absent from both ordinary and delay imports in xul.dll for the MOZ_XP_COMPAT legacy PBT_APMPOWERSTATUSCHANGE path." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source-remediation quartet gate: ${{ steps.source-remediation-quartet.outcome }} (evidence-preserving; survivors make the final verdict RED)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- ADVAPI32 compatibility final xul.dll gate: ${{ steps.advapi32-etw-import-gate.outcome }}; ETW focused capability source 53971dcfdf12e7bcd7f35692ff2c02fb3360d792 / run 33882235341 / job 101053403554; RegGetValueW focused capability source 8ad1d5e9a935ed1cce8ee268f693af72aad1f7c4 / run 33946751857 / job 101254130849." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- WS2_32 focused YY capability: WSAIoctl + inet_ntop from source 5451673565030445262f5b6ef48b4059e0e0501e / run 34021400841 / job 101454550948; production link uses only their weak-alias pairs plus the shared narrow YY implementation." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- WSASendMsg is source late-bound and WSCGetProviderInfo LSP-category diagnostics are compiled out under MOZ_XP_COMPAT; all four WS2_32 names are forbidden as ordinary final imports." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- xul IPHLPAPI legacy MTU diagnostic: ${{ steps.xul-iphlpapi-import-diag.outcome }} (non-blocking; see diagnostics/xul-iphlpapi-xp-imports.txt)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- YY DLL entry-point inventory: ${{ steps.yy-dll-entrypoint-diag.outcome }} (non-blocking; see diagnostics/yy-dll-entrypoint-audit.txt and diagnostics/yy-dll-entrypoint-missing-contract.txt)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- mozglue SetProcessDPIAware import-mode gate: ${{ steps.dpi-import-gate.outcome }}." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Final all-PE audit records both ordinary and delay imports; only proven forbidden ordinary dependencies/APIs drive this gate." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- CRT/UCRT: pinned msvcr14x $env:MSVCR14X_SHA, preserving Firefox /MD." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- XP bcrypt: exact release $env:BCRYPT_TAG / asset $env:BCRYPT_ASSET_ID / SHA-256 $env:BCRYPT_SHA256." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- YY-Thunks: v$env:YY_THUNKS_VERSION target $env:YY_THUNKS_TARGET/x86; NtCancelIoFileEx ntdll alias + five-name ADVAPI32 alias family + two-name WS2_32 alias family + narrow provider + synchronization.lib are injected through global target LDFLAGS; full kernel32.lib, ntdll.lib, advapi32.lib and ws2_32.lib remain prohibited." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "### Operations" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($item in $operations) {
            "- $($item.Name): $($item.Outcome)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($item.Outcome -ne 'success') { $red.Add("operation:$($item.Name)=$($item.Outcome)") }
          }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "### Diagnostic gates" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($item in $checks) {
            "- $($item.Name): $($item.Outcome)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($item.Outcome -notin @('success','skipped')) { $red.Add("gate:$($item.Name)=$($item.Outcome)") }
          }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Package/runtime/diagnostics uploads execute before this final verdict." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- A diagnostic RED does not suppress later evidence collection." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Real Firefox startup on physical XP remains a separate runtime gate." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($red.Count -gt 0) {
            $red | Set-Content -Encoding utf8 diagnostics\final-red-gates.txt
            throw ("XP x32 build completed evidence collection with RED outcomes: " + ($red -join '; '))
          }
