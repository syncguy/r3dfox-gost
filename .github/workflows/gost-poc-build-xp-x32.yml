      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Firefox x86 target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = .\mach.ps1 configure 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath configure-xp-x32.log
          if ($exitCode -ne 0) { exit $exitCode }
          $joined = $output -join "`n"
          if ($joined -notmatch 'checking for rust target triplet\.\.\.\s+i686-pc-windows-msvc') {
            throw 'XP x32 build did not select i686-pc-windows-msvc Rust target.'
          }

      - name: Build export prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          & $mozmake -C $env:OBJDIR recurse_pre-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mozmake -C $env:OBJDIR recurse_export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Compile security manager SSL target objects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          & $mozmake -C $env:OBJDIR 'security/manager/ssl/target-objects'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release r3dfox XP x32
        id: build-release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Require source-remediation quartet absent from xul.dll
        id: source-remediation-quartet
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xul = Join-Path $env:OBJDIR 'dist\bin\xul.dll'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'xp-x32-source-remediation-quartet'
          New-Item -ItemType Directory -Force $diag | Out-Null
          if (-not (Test-Path $xul)) {
            'result=FAIL|reason=xul.dll missing' | Set-Content -Encoding utf8 (Join-Path $diag 'result.txt')
            throw "xul.dll missing for source-remediation quartet gate: $xul"
          }
          $raw = (& dumpbin.exe /nologo /imports $xul 2>&1 | Out-String)
          $dumpbinExit = $LASTEXITCODE
          $raw | Set-Content -Encoding utf8 (Join-Path $diag 'xul.dll-imports.txt')
          if ($dumpbinExit -ne 0) {
            "result=FAIL|reason=dumpbin exit $dumpbinExit" | Set-Content -Encoding utf8 (Join-Path $diag 'result.txt')
            throw "dumpbin /imports failed for xul.dll with exit $dumpbinExit"
          }
          $apis = @(
            'GetApplicationRestartSettings',
            'RegisterApplicationRestart',
            'UnregisterApplicationRestart',
            'GetNamedPipeServerProcessId'
          )
          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($api in $apis) {
            if ($raw.IndexOf($api, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              $hits.Add($api)
            }
          }
          $hits | Set-Content -Encoding utf8 (Join-Path $diag 'surviving-quartet-imports.txt')
          if ($hits.Count -gt 0) {
            ("result=FAIL|surviving=" + ($hits -join ',')) | Set-Content -Encoding utf8 (Join-Path $diag 'result.txt')
            throw ("xul.dll still imports source-remediation quartet members: " + ($hits -join ', '))
          }
          'result=PASS|surviving=none' | Set-Content -Encoding utf8 (Join-Path $diag 'result.txt')
          Write-Host 'xul.dll contains none of the four source-remediation imports.'

      - name: GATE - Verify mozglue SetProcessDPIAware stays delay-loaded
        id: dpi-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:OBJDIR 'dist\bin\mozglue.dll'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'xp-x32-dpi-delay-import'
          New-Item -ItemType Directory -Force $diag | Out-Null
          if (-not (Test-Path $dll)) { throw "mozglue.dll missing for DPI import-mode gate: $dll" }
          $raw = @(& dumpbin.exe /nologo /imports $dll 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /imports failed for mozglue.dll' }
          $raw | Set-Content -Encoding utf8 (Join-Path $diag 'mozglue.dll-imports.txt')

          $mode = 'none'
          $currentDll = ''
          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $raw) {
            if ($line -match '^\s*Section contains the following imports:\s*$') {
              $mode = 'direct'
              $currentDll = ''
              continue
            }
            if ($line -match '^\s*Section contains the following delay load imports:\s*$') {
              $mode = 'delay'
              $currentDll = ''
              continue
            }
            if ($line -match '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') {
              $currentDll = $matches[1]
              continue
            }
            if ($line.IndexOf('SetProcessDPIAware', [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              $hits.Add("$mode|$currentDll|$($line.Trim())")
            }
          }
          $hits | Set-Content -Encoding utf8 (Join-Path $diag 'setprocessdpiaware-import-mode.txt')
          $directHits = @($hits | Where-Object { $_ -like 'direct|*' })
          $delayUser32Hits = @($hits | Where-Object { $_ -match '(?i)^delay\|USER32\.dll\|' })
          if ($directHits.Count -gt 0) {
            throw 'mozglue.dll has an ordinary SetProcessDPIAware import; XP startup would remain loader-incompatible.'
          }
          if ($delayUser32Hits.Count -ne 1 -or $hits.Count -ne 1) {
            throw "Expected exactly one USER32.dll delay import for SetProcessDPIAware; observed: $($hits -join '; ')"
          }
          'result=PASS|direct=0|delay_user32=1' |
            Set-Content -Encoding utf8 (Join-Path $diag 'result.txt')

      - name: GATE - Reject proven core browser XP direct imports
        id: sync-import-gate
        if: steps.build-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'xp-x32-sync-import-gate'
          New-Item -ItemType Directory -Force $diag | Out-Null
          $apis = @(
            'GetTickCount64','InitializeCriticalSectionEx','CompareStringOrdinal',
            'GetCurrentProcessorNumber','GetFileInformationByHandleEx','GetFinalPathNameByHandleW',
            'GetLocaleInfoEx','LCIDToLocaleName','LocaleNameToLCID','SetFileInformationByHandle','CancelIoEx',
            'CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread',
            'GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear','GetUserPreferredUILanguages',
            'InitOnceExecuteOnce','InitOnceBeginInitialize','InitOnceComplete',
            'QueryFullProcessImageNameA','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime',
            'AcquireSRWLockExclusive','AcquireSRWLockShared',
            'ReleaseSRWLockExclusive','ReleaseSRWLockShared',
            'InitializeSRWLock','InitializeConditionVariable',
            'SleepConditionVariableCS','SleepConditionVariableSRW',
            'WakeAllConditionVariable','WakeConditionVariable'
          )
          $targets = @('r3dfox.exe','xul.dll','mozglue.dll','plugin-container.exe')
          $hits = [System.Collections.Generic.List[string]]::new()
          foreach ($name in $targets) {
            $path = Join-Path $bin $name
            if (-not (Test-Path $path)) { throw "Core browser PE missing for synchronization gate: $path" }
            $raw = (& dumpbin.exe /nologo /imports $path 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed: $path" }
            $raw | Set-Content -Encoding utf8 (Join-Path $diag "$name-imports.txt")
            foreach ($api in $apis) {
              if ($raw.IndexOf($api,[System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                $hits.Add("$name|$api")
              }
            }
          }
          $hits | Set-Content -Encoding utf8 (Join-Path $diag 'surviving-sync-imports.txt')
          if ($hits.Count -gt 0) {
            throw 'Core browser imports survived the proven SRW/KERNEL32 YY integration; see xp-x32-sync-import-gate/surviving-sync-imports.txt'
          }

      - name: Stage msvcr14x XP runtime DLLs
        id: stage-runtime
        if: always() && steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          if (-not (Test-Path $bin)) { throw "Firefox dist/bin missing: $bin" }
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $src = Join-Path $env:MSVCR14X_RELEASE $dll
            if (-not (Test-Path $src)) { throw "Required msvcr14x runtime missing: $src" }
            Copy-Item -Force $src (Join-Path $bin $dll)
          }

      - name: Stage pinned legacy Firefox XP D3DCompiler_47
        id: stage-legacy-d3dcompiler
        if: steps.stage-runtime.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $dst = Join-Path $bin 'd3dcompiler_47.dll'
          if (-not (Test-Path $dst)) { throw "Build-produced D3DCompiler_47 missing: $dst" }
          $before = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          Copy-Item -Force $env:LEGACY_D3DCOMPILER47 $dst
          $after = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          if ($after -ne $expected) { throw "Legacy D3DCompiler_47 stage hash mismatch: $after" }
          $version = (Get-Item $dst).VersionInfo.FileVersion
          if ($version -notlike '10.0.14393.33*') { throw "Unexpected legacy D3DCompiler_47 version: $version" }
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @("source=$env:LEGACY_D3DCOMPILER47", "build_dll_sha256=$before", "legacy_source_sha256=$after", "file_version=$version") |
            Set-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

      - name: Retarget dist/bin PE subsystem headers to XP x86
        id: retarget-pe
        if: steps.stage-legacy-d3dcompiler.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $rows = [System.Collections.Generic.List[string]]::new()
          $targets = @(Get-ChildItem -LiteralPath $bin -Recurse -File | Where-Object { $_.Extension -in @('.exe','.dll') })
          foreach ($target in $targets) {
            $headers = @(& dumpbin.exe /nologo /headers $target.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed: $($target.FullName)" }
            $machine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machine -or $machine -notmatch '(?i)^\s*14C machine \(x86\)') { continue }
            $subsystem = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ subsystem \(' } | Select-Object -First 1
            if (-not $subsystem) { continue }
            if ($subsystem -match '(?i)Windows CUI') { $kind = 'CONSOLE' }
            elseif ($subsystem -match '(?i)Windows GUI') { $kind = 'WINDOWS' }
            else { continue }
            & editbin.exe /nologo "/SUBSYSTEM:$kind,$env:WINDOWS_XP_SUBSYSTEM" $target.FullName
            if ($LASTEXITCODE -ne 0) { throw "editbin failed for $($target.FullName)" }
            $rows.Add("$($target.FullName)|$kind|$env:WINDOWS_XP_SUBSYSTEM")
          }
          $rows | Set-Content -Encoding utf8 xp-x32-retargeted-pe.txt

      - name: GATE - Verify retargeted legacy D3DCompiler_47
        id: verify-retargeted-d3dcompiler
        if: steps.retarget-pe.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Join-Path $env:OBJDIR 'dist\bin\d3dcompiler_47.dll'
          if (-not (Test-Path $dll)) { throw "Retargeted D3DCompiler_47 missing: $dll" }
          $version = (Get-Item $dll).VersionInfo.FileVersion
          if ($version -notlike '10.0.14393.33*') { throw "Unexpected retargeted D3DCompiler_47 version: $version" }
          $headers = @(& dumpbin.exe /nologo /headers $dll 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /headers failed for retargeted D3DCompiler_47' }
          $subsystem = $headers | Where-Object { $_ -match '(?i)^\s*5\.01\s+subsystem version' } | Select-Object -First 1
          if (-not $subsystem) { throw 'Retargeted D3DCompiler_47 is not subsystem 5.01' }
          $imports = (& dumpbin.exe /nologo /imports $dll 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /imports failed for retargeted D3DCompiler_47' }
          foreach ($forbidden in @('FlsAlloc','FlsFree','FlsGetValue','FlsSetValue','InitializeCriticalSectionEx')) {
            if ($imports -match ('(?m)\b' + [regex]::Escape($forbidden) + '\b')) { throw "Legacy D3DCompiler_47 still imports $forbidden" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          "LEGACY_D3DCOMPILER47_RETARGETED_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @("retargeted_sha256=$hash", "retargeted_file_version=$version", "retargeted_subsystem=5.01") |
            Add-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

      - name: Stage proven XP bcrypt.dll
        id: stage-xp-bcrypt
        if: always() && steps.retarget-pe.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PROVEN_XP_BCRYPT -or -not (Test-Path $env:PROVEN_XP_BCRYPT)) { throw 'Proven XP bcrypt release asset is unavailable' }
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $dst = Join-Path $bin 'bcrypt.dll'
          Copy-Item -Force $env:PROVEN_XP_BCRYPT $dst
          $item = Get-Item $dst
          $sha1 = (Get-FileHash -Algorithm SHA1 $dst).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          if ([string]$item.Length -ne $env:BCRYPT_SIZE) { throw "Staged bcrypt.dll size mismatch: $($item.Length)" }
          if ($sha1 -ne $env:BCRYPT_SHA1) { throw "Staged bcrypt.dll SHA1 mismatch: $sha1" }
          if ($sha256 -ne $env:BCRYPT_SHA256) { throw "Staged bcrypt.dll SHA256 mismatch: $sha256" }
          "XP_BCRYPT_STAGED_SHA256=$sha256" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "bcrypt.dll|size=$($item.Length)",
            "bcrypt.dll|sha1=$sha1",
            "bcrypt.dll|sha256=$sha256",
            "source_tag=$env:BCRYPT_TAG",
            "source_asset_id=$env:BCRYPT_ASSET_ID"
          ) | Set-Content -Encoding utf8 diagnostics\packaged-bcrypt-contract.txt

      - name: GATE - Record staged XP CRT identity before packaging
        id: record-staged-crt
        if: steps.stage-xp-bcrypt.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $rows = [System.Collections.Generic.List[string]]::new()
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $path = Join-Path $bin $dll
            if (-not (Test-Path $path)) { throw "Staged XP CRT missing before packaging: $path" }
            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $rows.Add("$dll|sha256=$hash")
            if ($dll -eq 'ucrtbase.dll') {
              "XP_UCRTBASE_STAGED_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            } else {
              "XP_MSVCP140_STAGED_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          $rows | Set-Content -Encoding utf8 diagnostics\packaged-crt-contract.txt

      - name: Package XP x32 experiment
        id: package-release
        if: steps.record-staged-crt.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify legacy D3DCompiler_47 survived packaging
        id: verify-legacy-d3dcompiler
        if: steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:LEGACY_D3DCOMPILER47_RETARGETED_SHA256
          if (-not $expected) { throw 'Retargeted D3DCompiler_47 hash was not recorded' }
          $dll = Join-Path $env:OBJDIR 'dist\bin\d3dcompiler_47.dll'
          if (-not (Test-Path $dll)) { throw "Staged D3DCompiler_47 disappeared after package: $dll" }
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "D3DCompiler_47 changed during package: expected=$expected actual=$hash" }
          "post_package_sha256=$hash" | Add-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

      - name: GATE - Verify msvcr14x CRT survived portable packaging
        id: verify-packaged-crt
        if: always() && steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:XP_UCRTBASE_STAGED_SHA256 -or -not $env:XP_MSVCP140_STAGED_SHA256) {
            throw 'Staged XP CRT hashes were not recorded before packaging'
          }
          $expected = @{
            'ucrtbase.dll' = $env:XP_UCRTBASE_STAGED_SHA256
            'msvcp140.dll' = $env:XP_MSVCP140_STAGED_SHA256
          }
          $dist = (Resolve-Path (Join-Path $env:OBJDIR 'dist')).Path
          $archives = @(Get-ChildItem -LiteralPath $dist -File |
            Where-Object { $_.Extension -in @('.7z','.zip') -and $_.Name -ne 'r3dfox-gost-xp-x32-runtime.7z' } |
            Sort-Object LastWriteTimeUtc -Descending)
          if ($archives.Count -eq 0) { throw "No portable package archive found under $dist" }

          "XP_PORTABLE_ARCHIVE=$($archives[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $verifiedArchive = $null
          foreach ($archive in $archives) {
            $extract = Join-Path $env:RUNNER_TEMP ("xp-package-crt-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Force $extract | Out-Null
            & 7z.exe x $archive.FullName "-o$extract" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { continue }

            $matches = @{}
            $candidateOk = $true
            foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
              $found = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter $dll)
              if ($found.Count -ne 1) { $candidateOk = $false; break }
              $hash = (Get-FileHash -Algorithm SHA256 $found[0].FullName).Hash.ToLowerInvariant()
              if ($hash -ne $expected[$dll]) {
                throw "$dll packaged hash mismatch in $($archive.Name): expected=$($expected[$dll]) actual=$hash"
              }
              $matches[$dll] = $hash
            }
            if (-not $candidateOk) { continue }

            $verifiedArchive = $archive
            @(
              "archive=$($archive.FullName)",
              "ucrtbase.dll|sha256=$($matches['ucrtbase.dll'])",
              "msvcp140.dll|sha256=$($matches['msvcp140.dll'])"
            ) | Add-Content -Encoding utf8 diagnostics\packaged-crt-contract.txt
            "XP_PORTABLE_ARCHIVE=$($verifiedArchive.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            break
          }
          if (-not $verifiedArchive) { throw 'No produced portable package contains exactly one matching ucrtbase.dll and msvcp140.dll' }

      - name: GATE - Verify proven bcrypt survived portable packaging
        id: verify-packaged-bcrypt
        if: always() && steps.package-release.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:XP_PORTABLE_ARCHIVE -or -not (Test-Path $env:XP_PORTABLE_ARCHIVE)) { throw 'Portable archive is unavailable for bcrypt gate' }
          if (-not $env:XP_BCRYPT_STAGED_SHA256) { throw 'Staged bcrypt hash was not recorded before packaging' }
          $extract = Join-Path $env:RUNNER_TEMP ("xp-package-bcrypt-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 7z.exe x $env:XP_PORTABLE_ARCHIVE "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract portable archive for bcrypt gate' }
          $found = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'bcrypt.dll')
          if ($found.Count -ne 1) { throw "Portable package must contain exactly one bcrypt.dll; found $($found.Count)" }
          $item = Get-Item $found[0].FullName
          $sha1 = (Get-FileHash -Algorithm SHA1 $found[0].FullName).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -Algorithm SHA256 $found[0].FullName).Hash.ToLowerInvariant()
          if ([string]$item.Length -ne $env:BCRYPT_SIZE) { throw "Packaged bcrypt.dll size mismatch: $($item.Length)" }
          if ($sha1 -ne $env:BCRYPT_SHA1) { throw "Packaged bcrypt.dll SHA1 mismatch: $sha1" }
          if ($sha256 -ne $env:XP_BCRYPT_STAGED_SHA256 -or $sha256 -ne $env:BCRYPT_SHA256) {
            throw "Packaged bcrypt.dll SHA256 mismatch: expected=$env:BCRYPT_SHA256 staged=$env:XP_BCRYPT_STAGED_SHA256 actual=$sha256"
          }
          @(
            "archive=$env:XP_PORTABLE_ARCHIVE",
            "packaged_path=$($found[0].FullName)",
            "bcrypt.dll|size=$($item.Length)",
            "bcrypt.dll|sha1=$sha1",
            "bcrypt.dll|sha256=$sha256"
          ) | Add-Content -Encoding utf8 diagnostics\packaged-bcrypt-contract.txt

      - name: Build XP x32 runtime test archive from dist/bin
        id: runtime-archive
        if: always() && steps.package-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (Resolve-Path (Join-Path $env:OBJDIR 'dist\bin')).Path
          $dist = (Resolve-Path (Join-Path $env:OBJDIR 'dist')).Path
          $archive = Join-Path $dist 'r3dfox-gost-xp-x32-runtime.7z'
          if (Test-Path $archive) { Remove-Item -Force $archive }
          Push-Location $bin
          try {
            & 7z.exe a -t7z -mx=7 $archive '.\*'
            if ($LASTEXITCODE -ne 0) { throw "7z runtime archive failed: $LASTEXITCODE" }
          } finally { Pop-Location }
          "XP_RUNTIME_ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: GATE - Audit XP x32 PE floor and direct imports
        id: xp-import-audit
        if: steps.runtime-archive.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Normalize-Api([string]$name) {
            if ($name -match '^_(.+)@\d+$') { return $matches[1] }
            return $name
          }

          function Read-Binary([System.IO.FileInfo]$binary, [string]$diagRoot) {
            $safe = ($binary.FullName.Substring((Resolve-Path (Join-Path $env:OBJDIR 'dist\bin')).Path.Length).TrimStart('\') -replace '[^A-Za-z0-9_.-]', '_')
            $headers = @(& dumpbin.exe /nologo /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed: $($binary.FullName)" }
            $headers | Set-Content -Encoding utf8 (Join-Path $diagRoot "$safe-headers.txt")
            $machine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machine -or $machine -notmatch '(?i)^\s*14C machine \(x86\)') {
              throw "$($binary.FullName) is not PE x86 machine 14C"
            }
            $versionLine = $headers | Where-Object { $_ -match '(?i)subsystem version' } | Select-Object -First 1
            if (-not $versionLine -or $versionLine -notmatch '^\s*([0-9]+)\.([0-9]+)\s+subsystem version') {
              throw "Cannot parse subsystem version: $($binary.FullName)"
            }
            $version = [version]("$([int]$matches[1]).$([int]$matches[2])")
            if ($version -gt [version]'5.1') { throw "$($binary.FullName) subsystem $version is newer than XP x86 5.01" }

            $importsRaw = @(& dumpbin.exe /nologo /imports $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed: $($binary.FullName)" }
            $importsRaw | Set-Content -Encoding utf8 (Join-Path $diagRoot "$safe-imports.txt")
            $dlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $apis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $delayDlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $delayApis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $mode = 'none'
            foreach ($line in $importsRaw) {
              if ($line -match '^\s*Section contains the following imports:\s*$') { $mode = 'direct'; continue }
              if ($line -match '^\s*Section contains the following delay load imports:\s*$') { $mode = 'delay'; continue }
              if ($line -match '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') {
                if ($mode -eq 'direct') { [void]$dlls.Add($matches[1]) }
                elseif ($mode -eq 'delay') { [void]$delayDlls.Add($matches[1]) }
                continue
              }
              $entry = $line.Trim()
              if ($entry -match '^[0-9A-Fa-f]+\s+(\S+)$') {
                $api = Normalize-Api $matches[1]
                if ($mode -eq 'direct') { [void]$apis.Add($api) }
                elseif ($mode -eq 'delay') { [void]$delayApis.Add($api) }
              }
            }
            return @{ Dlls=$dlls; Apis=$apis; DelayDlls=$delayDlls; DelayApis=$delayApis }
          }

          $diagRoot = Join-Path $env:GITHUB_WORKSPACE 'xp-x32-import-audit'
          New-Item -ItemType Directory -Force $diagRoot | Out-Null
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $targets = @(Get-ChildItem -LiteralPath $bin -Recurse -File | Where-Object { $_.Extension -in @('.exe','.dll') })

          $forbiddenDllPatterns = @(
            '^(?i)(api-ms-win-|ext-ms-)',
            '^(?i)KERNELBASE\.dll$',
            '^(?i)BCRYPTPRIMITIVES\.dll$',
            '^(?i)COMBASE\.dll$',
            '^(?i)NCRYPT\.dll$',
            '^(?i)WEVTAPI\.dll$',
            '^(?i)DWMAPI\.dll$',
            '^(?i)SHCORE\.dll$',
            '^(?i)PATHCCH\.dll$',
            '^(?i)NORMALIZ\.dll$',
            '^(?i)PROPSYS\.dll$',
            '^(?i)DXGI\.dll$',
            '^(?i)VCRUNTIME140(?:_1)?\.dll$'
          )
          $forbiddenApis = @(
            'AcquireSRWLockExclusive','AcquireSRWLockShared','CancelIoEx','CompareStringEx','CompareStringOrdinal',
            'CreateEventExA','CreateEventExW','CreateFile2','CreateMutexExA','CreateMutexExW','CreateSemaphoreExW',
            'CreateSymbolicLinkA','CreateSymbolicLinkW','CreateThreadpool','CreateThreadpoolCleanupGroup','CreateThreadpoolIo',
            'CreateThreadpoolTimer','CreateThreadpoolWait','CreateThreadpoolWork','FlsAlloc','FlsFree','FlsGetValue','FlsSetValue',
            'GetActiveProcessorCount','GetCurrentProcessorNumber','GetCurrentProcessorNumberEx','GetFileInformationByHandleEx',
            'GetFinalPathNameByHandleA','GetFinalPathNameByHandleW','GetLocaleInfoEx','GetLogicalProcessorInformationEx',
            'GetMaximumProcessorCount','GetOverlappedResultEx','GetSystemTimePreciseAsFileTime','GetTempPath2A','GetTempPath2W',
            'GetTickCount64','GetUserDefaultLocaleName','InitializeConditionVariable','InitializeCriticalSectionEx','InitializeSRWLock',
            'IsThreadAFiber','LCIDToLocaleName','LocaleNameToLCID','ProcessPrng','QueryUnbiasedInterruptTime',
            'ReleaseSRWLockExclusive','ReleaseSRWLockShared','SetFileInformationByHandle','SetThreadDescription',
            'SetThreadStackGuarantee','SleepConditionVariableCS','SleepConditionVariableSRW','SubmitThreadpoolWork',
            'TryAcquireSRWLockExclusive','TryAcquireSRWLockShared','WaitOnAddress','WakeAllConditionVariable',
            'WakeByAddressAll','WakeByAddressSingle','WakeConditionVariable',
            'CreateWaitableTimerExA','CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation',
            'GetProcessIdOfThread','GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear',
            'GetUserPreferredUILanguages','InitOnceExecuteOnce','InitOnceBeginInitialize','InitOnceComplete',
            'GetApplicationRestartSettings','RegisterApplicationRestart','UnregisterApplicationRestart',
            'GetNamedPipeServerProcessId','SetProcessDPIAware',
            'QueryFullProcessImageNameA','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime'
          )

          $hits = [System.Collections.Generic.List[string]]::new()
          $rows = [System.Collections.Generic.List[string]]::new()
          $delayRows = [System.Collections.Generic.List[string]]::new()
          foreach ($target in $targets) {
            $imports = Read-Binary $target $diagRoot
            foreach ($dll in @($imports.Dlls | Sort-Object)) {
              $rows.Add("$($target.FullName)|DLL|$dll")
              foreach ($pattern in $forbiddenDllPatterns) {
                if ($dll -match $pattern) { $hits.Add("$($target.FullName)|DLL|$dll"); break }
              }
            }
            foreach ($api in @($imports.Apis | Sort-Object)) {
              $rows.Add("$($target.FullName)|API|$api")
              if ($forbiddenApis -contains $api) { $hits.Add("$($target.FullName)|API|$api") }
            }
            foreach ($dll in @($imports.DelayDlls | Sort-Object)) {
              $delayRows.Add("$($target.FullName)|DLL|$dll")
            }
            foreach ($api in @($imports.DelayApis | Sort-Object)) {
              $delayRows.Add("$($target.FullName)|API|$api")
            }
          }

          $rows | Set-Content -Encoding utf8 xp-x32-direct-imports.txt
          $delayRows | Set-Content -Encoding utf8 xp-x32-delay-imports.txt
          $hits | Sort-Object -Unique | Set-Content -Encoding utf8 xp-x32-forbidden-direct-imports.txt
          if ($hits.Count -gt 0) { throw 'Known direct post-XP imports survived; see xp-x32-forbidden-direct-imports.txt' }

      - name: Upload XP x32 full-build package
        if: always() && steps.package-release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-package
          if-no-files-found: error
          compression-level: 0
          path: |
            obj-gost-xp-x32/dist/*.zip
            obj-gost-xp-x32/dist/*.7z
            obj-gost-xp-x32/dist/*.installer.exe

      - name: Upload XP x32 physical-test runtime archive
        if: always() && steps.runtime-archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-runtime
          if-no-files-found: error
          compression-level: 0
          path: ${{ env.XP_RUNTIME_ARCHIVE }}

      - name: Upload XP x32 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-xp-x32-diagnostics
          if-no-files-found: warn
          path: |
            configure-xp-x32.log
            xp-x32-retargeted-pe.txt
            xp-x32-direct-imports.txt
            xp-x32-delay-imports.txt
            xp-x32-forbidden-direct-imports.txt
            xp-x32-source-remediation-quartet/**
            xp-x32-dpi-delay-import/**
            xp-x32-sync-import-gate/**
            xp-x32-import-audit/**
            diagnostics/**
            ${{ runner.temp }}/r3dfox-xp-x32-narrow-yy/**

      - name: GATE - Summarize XP x32 full build
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Name='dpi-source-guard'; Outcome='${{ steps.dpi-source-guard.outcome }}' },
            @{ Name='source-remediation-quartet'; Outcome='${{ steps.source-remediation-quartet.outcome }}' },
            @{ Name='dpi-import-mode'; Outcome='${{ steps.dpi-import-gate.outcome }}' },
            @{ Name='core-import'; Outcome='${{ steps.sync-import-gate.outcome }}' },
            @{ Name='retargeted-d3dcompiler'; Outcome='${{ steps.verify-retargeted-d3dcompiler.outcome }}' },
            @{ Name='packaged-d3dcompiler'; Outcome='${{ steps.verify-legacy-d3dcompiler.outcome }}' },
            @{ Name='packaged-crt'; Outcome='${{ steps.verify-packaged-crt.outcome }}' },
            @{ Name='packaged-bcrypt'; Outcome='${{ steps.verify-packaged-bcrypt.outcome }}' },
            @{ Name='broad-import-audit'; Outcome='${{ steps.xp-import-audit.outcome }}' }
          )
          $operations = @(
            @{ Name='build'; Outcome='${{ steps.build-release.outcome }}' },
            @{ Name='package'; Outcome='${{ steps.package-release.outcome }}' },
            @{ Name='runtime-archive'; Outcome='${{ steps.runtime-archive.outcome }}' }
          )
          $red = [System.Collections.Generic.List[string]]::new()

          "## GOST TLS PoC build XP x32: final evidence summary" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source: $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Target: i686-pc-windows-msvc / Windows XP SP3 x86." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- XP source defines: MOZ_NO_WINRT + MOZ_XP_COMPAT via CFLAGS/CXXFLAGS." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- DPI pre-Vista source guard: ${{ steps.dpi-source-guard.outcome }}." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Source-remediation quartet gate: ${{ steps.source-remediation-quartet.outcome }} (evidence-preserving; survivors make the final verdict RED)." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- mozglue SetProcessDPIAware import-mode gate: ${{ steps.dpi-import-gate.outcome }}." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Final all-PE audit records both ordinary and delay imports; only proven forbidden ordinary dependencies/APIs drive this gate." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- CRT/UCRT: pinned msvcr14x $env:MSVCR14X_SHA, preserving Firefox /MD." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- XP bcrypt: exact release $env:BCRYPT_TAG / asset $env:BCRYPT_ASSET_ID / SHA-256 $env:BCRYPT_SHA256." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- YY-Thunks: v$env:YY_THUNKS_VERSION target $env:YY_THUNKS_TARGET/x86; synchronization.lib + narrow provider are injected through global target LDFLAGS; full kernel32.lib remains prohibited." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "### Operations" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($item in $operations) {
            "- $($item.Name): $($item.Outcome)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($item.Outcome -ne 'success') { $red.Add("operation:$($item.Name)=$($item.Outcome)") }
          }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "### Diagnostic gates" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          foreach ($item in $checks) {
            "- $($item.Name): $($item.Outcome)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($item.Outcome -notin @('success','skipped')) { $red.Add("gate:$($item.Name)=$($item.Outcome)") }
          }
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Package/runtime/diagnostics uploads execute before this final verdict." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- A diagnostic RED does not suppress later evidence collection." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Real Firefox startup on physical XP remains a separate runtime gate." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($red.Count -gt 0) {
            $red | Set-Content -Encoding utf8 diagnostics\final-red-gates.txt
            throw ("XP x32 build completed evidence collection with RED outcomes: " + ($red -join '; '))
          }
