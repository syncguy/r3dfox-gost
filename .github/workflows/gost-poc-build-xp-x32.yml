name: "GOST TLS PoC build  XP x32"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xp-x32:
    name: Windows x86 / r3dfox GOST / XP SP3 full build
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost-xp-x32
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      RUST_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET: "i686-pc-windows-msvc"
      MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
      MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
      YY_THUNKS_VERSION: "1.2.2"
      YY_THUNKS_TARGET: "5.1.2600.0"
      WINDOWS_XP_SUBSYSTEM: "5.01"
      OBJDIR: "obj-gost-xp-x32"
      BCRYPT_TAG: "xp-bcrypt-v1"
      BCRYPT_RELEASE_ID: "380563342"
      BCRYPT_ASSET_ID: "539647946"
      BCRYPT_SOURCE_SHA: "a30a701fcf50eb08b6ea7574cb7cc927f6eae014"
      BCRYPT_SIZE: "520704"
      BCRYPT_SHA1: "ae021f44edc48b03bb4d67cb5773b62bdf60cb67"
      BCRYPT_SHA256: "f157f8026347d180e9ab42732bedaad0ea2b3b03dfd0d9ba8b8abe9612aff193"

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize upstream JSContext include order
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'js\src\vm\JSContext.cpp'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)
          $dump = '#include "js/friend/DumpFunctions.h"  // for stack trace utilities'
          $errors = '#include "js/friend/ErrorMessages.h"  // js::GetErrorMessage, JSMSG_*'
          $printer = '#include "js/Printer.h"               // for FixedBufferPrinter'
          $printf = '#include "js/Printf.h"'
          foreach ($line in @($dump, $printer)) { while ($lines.Remove($line)) { } }
          $errorsIndex = $lines.IndexOf($errors)
          $printfIndex = $lines.IndexOf($printf)
          if ($errorsIndex -lt 0 -or $printfIndex -lt 0) { throw 'Expected JSContext include anchors were not found.' }
          $lines.Insert($errorsIndex, $dump)
          $printfIndex = $lines.IndexOf($printf)
          $lines.Insert($printfIndex, $printer)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($path, $lines, $utf8NoBom)

      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify XP DPI pre-Vista source guard
        id: dpi-source-guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $path = 'mozglue\misc\WindowsDpiInitialization.cpp'
          if (-not (Test-Path $path)) { throw "DPI initialization source missing: $path" }
          $source = [System.IO.File]::ReadAllText($path)
          $guardPattern = 'if\s*\(\s*!IsVistaOrLater\(\)\s*\)\s*\{\s*return\s+WindowsDpiInitializationResult::Success;\s*\}'
          $guard = [regex]::Match(
            $source,
            $guardPattern,
            [System.Text.RegularExpressions.RegexOptions]::Singleline
          )
          if (-not $guard.Success) {
            throw 'XP DPI contract missing pre-Vista success/no-op guard.'
          }
          $directCall = $source.IndexOf(
            'if (!SetProcessDPIAware())',
            [System.StringComparison]::Ordinal
          )
          if ($directCall -lt 0) { throw 'Expected SetProcessDPIAware fallback call was not found.' }
          if ($guard.Index -gt $directCall) {
            throw 'XP DPI pre-Vista guard occurs after SetProcessDPIAware fallback.'
          }
          @(
            "source=$path",
            "guard_index=$($guard.Index)",
            "setprocessdpiaware_call_index=$directCall",
            'result=PASS'
          ) | Set-Content -Encoding utf8 diagnostics\xp-dpi-source-guard.txt

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }
          if ($activeMB -ge 20480) {
            'need=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $activeRoots = @($active | ForEach-Object {
            if ($_.Name -match '^([A-Za-z]:)\\') { $matches[1].ToUpperInvariant() }
          })
          $candidate = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { ($activeRoots -notcontains $_.DeviceID.ToUpperInvariant()) -and $_.FreeSpace -ge 30GB } |
            Sort-Object FreeSpace -Descending |
            Select-Object -First 1
          if (-not $candidate) { throw 'No non-active fixed drive with at least 30 GB free was found for pagefile.' }
          'need=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "disk=$($candidate.DeviceID)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile and show runner CPU
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cpu = @(Get-CimInstance Win32_Processor)
          $system = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }

          [pscustomobject]@{
            CpuName           = ($cpu.Name -join '; ')
            CpuSockets        = $cpu.Count
            CpuCores          = ($cpu | Measure-Object NumberOfCores -Sum).Sum
            LogicalProcessors = ($cpu | Measure-Object NumberOfLogicalProcessors -Sum).Sum
            SystemLogicalCPUs = $system.NumberOfLogicalProcessors
            TotalPhysicalGB   = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            FreePhysicalGB    = [math]::Round($os.FreePhysicalMemorySize / 1MB, 2)
            TotalVirtualGB    = [math]::Round($os.TotalVirtualMemorySize / 1MB, 2)
            FreeVirtualGB     = [math]::Round($os.FreeVirtualMemory / 1MB, 2)
          } | Format-List

          $active | Select-Object Name,AllocatedBaseSize,CurrentUsage,PeakUsage | Format-Table -AutoSize
          if ($activeMB -lt 20480) { throw "Build blocked: active pagefile is only $activeMB MB." }

      - name: Repair stale mime_guess vendored checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mime = 'third_party\rust\mime_guess\src\mime_types.rs'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          $stale = '57ee8db84eb0fc4f06a3eac0da8c730a334cb99a7e81e60413f5febd886d91f4'
          $expected = '1579ebd4fae3e0e8b1fe2d7677165868e6ba856c5e587538d9cb7b478a91078b'
          $actual = (Get-FileHash -Algorithm SHA256 $mime).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected mime_guess source hash: $actual" }
          $text = [System.IO.File]::ReadAllText($checksum)
          if (-not $text.Contains($stale)) { throw 'Expected stale mime_guess checksum was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($checksum, $text.Replace($stale, $expected), $utf8NoBom)

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }

      - name: Prepare pinned legacy Firefox XP D3DCompiler_47
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $uri = 'https://archive.mozilla.org/pub/firefox/releases/52.2.1esr/win32/en-US/Firefox%20Setup%2052.2.1esr.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 7z.exe x $installer "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract pinned legacy Firefox installer: $LASTEXITCODE" }
          $match = $null
          foreach ($candidate in @(Get-ChildItem -Path $extract -Recurse -File -Filter 'd3dcompiler_47.dll')) {
            $hash = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLowerInvariant()
            if ($hash -eq $expected) { $match = $candidate; break }
          }
          if (-not $match) { throw "Pinned Firefox source does not contain expected D3DCompiler_47 SHA256 $expected" }
          "LEGACY_D3DCOMPILER47=$($match.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD
          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"
          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) { throw 'Expected MSSPI Windows.h include was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($msspiCpp, $source.Replace('#include <Windows.h>', '#include <windows.h>').Replace('SECPKG_ATTR_REMOTE_CERT_CHAIN', 'SECPKG_ATTR_REMOTE_CERT_CONTEXT'), $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]
          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += ["msspi/src/msspi.cpp"]
              LOCAL_INCLUDES += ["msspi/src", "msspi/third_party/cprocsp/include"]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare pinned XP bcrypt release asset
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'xp-bcrypt-release'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          New-Item -ItemType Directory -Force $root | Out-Null

          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BCRYPT_TAG"
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri $releaseUri
          if ([string]$release.id -ne $env:BCRYPT_RELEASE_ID) { throw "Unexpected bcrypt release id: $($release.id)" }
          if ($release.tag_name -ne $env:BCRYPT_TAG) { throw "Unexpected bcrypt release tag: $($release.tag_name)" }
          if ($release.target_commitish -ne $env:BCRYPT_SOURCE_SHA) { throw "Unexpected bcrypt release source: $($release.target_commitish)" }
          $assets = @($release.assets | Where-Object { $_.name -eq 'bcrypt.dll' })
          if ($assets.Count -ne 1) { throw "Expected exactly one bcrypt.dll release asset; found $($assets.Count)" }
          $asset = $assets[0]
          if ([string]$asset.id -ne $env:BCRYPT_ASSET_ID) { throw "Unexpected bcrypt asset id: $($asset.id)" }
          if ([string]$asset.size -ne $env:BCRYPT_SIZE) { throw "Unexpected bcrypt asset size metadata: $($asset.size)" }

          $dll = Join-Path $root 'bcrypt.dll'
          Invoke-WebRequest -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri $asset.browser_download_url -OutFile $dll
          $item = Get-Item $dll
          $sha1 = (Get-FileHash -Algorithm SHA1 $dll).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ([string]$item.Length -ne $env:BCRYPT_SIZE) { throw "bcrypt.dll size mismatch: expected=$env:BCRYPT_SIZE actual=$($item.Length)" }
          if ($sha1 -ne $env:BCRYPT_SHA1) { throw "bcrypt.dll SHA1 mismatch: expected=$env:BCRYPT_SHA1 actual=$sha1" }
          if ($sha256 -ne $env:BCRYPT_SHA256) { throw "bcrypt.dll SHA256 mismatch: expected=$env:BCRYPT_SHA256 actual=$sha256" }

          $headers = @(& dumpbin.exe /nologo /headers $dll 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /headers failed for proven bcrypt.dll' }
          $imports = @(& dumpbin.exe /nologo /imports $dll 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /imports failed for proven bcrypt.dll' }
          $exports = @(& dumpbin.exe /nologo /exports $dll 2>&1)
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin /exports failed for proven bcrypt.dll' }
          $headers | Set-Content -Encoding utf8 diagnostics\bcrypt-release-headers.txt
          $imports | Set-Content -Encoding utf8 diagnostics\bcrypt-release-imports.txt
          $exports | Set-Content -Encoding utf8 diagnostics\bcrypt-release-exports.txt
          if (-not ($headers -match '(?im)^\s*14C machine \(x86\)')) { throw 'Proven bcrypt.dll is not x86 machine 14C' }
          $importsText = $imports -join "`n"
          foreach ($pattern in @('(?i)\bmbedtls\.dll\b','(?i)\bapi-ms-win-','(?i)\bext-ms-','(?i)\bKERNELBASE\.dll\b','(?i)\bBCRYPTPRIMITIVES\.dll\b')) {
            if ($importsText -match $pattern) { throw "Proven bcrypt.dll retains forbidden dependency pattern: $pattern" }
          }
          foreach ($name in @(
            'BCryptOpenAlgorithmProvider','BCryptCloseAlgorithmProvider','BCryptGetProperty',
            'BCryptCreateHash','BCryptHashData','BCryptFinishHash','BCryptDestroyHash','BCryptGenRandom'
          )) {
            if (-not (($exports -join "`n") -match ('\b' + [regex]::Escape($name) + '\b'))) { throw "Required bcrypt export missing: $name" }
          }

          @(
            "tag=$($release.tag_name)",
            "release_id=$($release.id)",
            "source_sha=$($release.target_commitish)",
            "asset_id=$($asset.id)",
            "asset_size=$($asset.size)",
            "sha1=$sha1",
            "sha256=$sha256",
            "source_path=$dll"
          ) | Set-Content -Encoding utf8 diagnostics\bcrypt-release-provenance.txt
          "PROVEN_XP_BCRYPT=$dll" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned ordinary Rust x86 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Build pinned msvcr14x Release x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'msvcr14x'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          git init $root
          git -C $root remote add origin $env:MSVCR14X_REPO
          git -C $root fetch --depth=1 origin $env:MSVCR14X_SHA
          git -C $root checkout --detach FETCH_HEAD
          git -C $root submodule update --init --recursive --depth 1
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:MSVCR14X_SHA) { throw "Unexpected msvcr14x commit: $actual" }

          & msbuild.exe (Join-Path $root 'msvcr14x.sln') /m /t:Build '/p:Configuration=Release;Platform=x86' -r "/bl:$env:GITHUB_WORKSPACE\diagnostics\msvcr14x-release-x86.binlog"
          if ($LASTEXITCODE -ne 0) { throw "msvcr14x build failed: $LASTEXITCODE" }

          $required = @('ucrtbase.dll','ucrt.lib','vcruntime.lib','msvcprt.lib','msvcp140.dll')
          $release = $null
          $candidateDirs = @(Get-ChildItem -Path $root -Recurse -File -Filter 'ucrtbase.dll' |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique)
          foreach ($candidate in $candidateDirs) {
            $missing = @($required | Where-Object { -not (Test-Path (Join-Path $candidate $_)) })
            if ($missing.Count -gt 0) { continue }
            $headers = (& dumpbin.exe /nologo /headers (Join-Path $candidate 'ucrtbase.dll') 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -and $headers -match '(?im)^\s*14C machine \(x86\)') {
              $release = $candidate
              break
            }
          }
          if (-not $release) { throw 'Cannot locate complete x86 msvcr14x Release output' }

          "MSVCR14X_RELEASE=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$release;$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LDFLAGS=-LIBPATH:$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -LiteralPath $release -File | Sort-Object Name |
            Select-Object Name,Length | Format-Table -AutoSize | Out-String -Width 240 |
            Set-Content -Encoding utf8 diagnostics\msvcr14x-release-files.txt

      - name: GATE - Require proven XP x86 msvcr14x runtime contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $forbiddenApis = @(
            'FlsAlloc','FlsFree','FlsGetValue','FlsSetValue',
            'AcquireSRWLockExclusive','AcquireSRWLockShared',
            'ReleaseSRWLockExclusive','ReleaseSRWLockShared',
            'InitializeSRWLock','InitializeConditionVariable',
            'SleepConditionVariableCS','SleepConditionVariableSRW',
            'WakeAllConditionVariable','WakeConditionVariable',
            'TryAcquireSRWLockExclusive','TryAcquireSRWLockShared'
          )
          $forbiddenDllPatterns = @(
            '^(?i)(api-ms-win-|ext-ms-)',
            '^(?i)KERNELBASE\.dll$',
            '^(?i)BCRYPT(?:PRIMITIVES)?\.dll$',
            '^(?i)COMBASE\.dll$',
            '^(?i)NCRYPT\.dll$',
            '^(?i)VCRUNTIME140(?:_1)?\.dll$'
          )
          $report = [System.Collections.Generic.List[string]]::new()
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $path = Join-Path $env:MSVCR14X_RELEASE $dll
            if (-not (Test-Path $path)) { throw "XP CRT contract missing runtime: $path" }

            $headers = @(& dumpbin.exe /nologo /headers $path 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed: $path" }
            $headers | Set-Content -Encoding utf8 (Join-Path 'diagnostics' "$dll-headers.txt")
            $machine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machine -or $machine -notmatch '(?i)^\s*14C machine \(x86\)') { throw "$dll is not x86 machine 14C" }
            $versionLine = $headers | Where-Object { $_ -match '(?i)subsystem version' } | Select-Object -First 1
            if (-not $versionLine -or $versionLine -notmatch '^\s*([0-9]+)\.([0-9]+)\s+subsystem version') { throw "Cannot parse subsystem version: $dll" }
            $version = [version]("$([int]$matches[1]).$([int]$matches[2])")
            if ($version -gt [version]'5.1') { throw "$dll subsystem $version is newer than XP x86 5.01" }

            $imports = @(& dumpbin.exe /nologo /imports $path 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed: $path" }
            $imports | Set-Content -Encoding utf8 (Join-Path 'diagnostics' "$dll-imports.txt")
            $text = $imports -join "`n"
            foreach ($api in $forbiddenApis) {
              if ($text -match ('(?m)\b' + [regex]::Escape($api) + '\b')) { throw "$dll retains forbidden XP direct import $api" }
            }
            foreach ($line in $imports) {
              if ($line -notmatch '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') { continue }
              $dep = $matches[1]
              foreach ($pattern in $forbiddenDllPatterns) {
                if ($dep -match $pattern) { throw "$dll retains forbidden XP dependency $dep" }
              }
            }

            $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            $report.Add("$dll|sha256=$hash|subsystem=$version|machine=x86")
          }
          $report | Set-Content -Encoding utf8 diagnostics\msvcr14x-xp-contract.txt

      - name: Download YY-Thunks 1.2.2 XP x86 libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)Lib.*\.zip$|(?i)-Lib\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Lib asset not found" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-xp-x86'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root

          $targetPattern = [regex]::Escape($env:YY_THUNKS_TARGET)
          $yyLib = Get-ChildItem -Path $root -Recurse -Directory |
            Where-Object { $_.FullName -match "(?i)[\\/]Lib[\\/]$targetPattern[\\/]x86$" } |
            Select-Object -First 1
          if (-not $yyLib) { throw "YY-Thunks Lib/$env:YY_THUNKS_TARGET/x86 not found" }

          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          if (-not (Test-Path $kernel32) -or -not (Test-Path $synch)) { throw 'Required YY XP x86 libraries are missing' }
          "THUNK_YY_LIB=$($yyLib.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_SYNCH_LIB=$synch" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build narrow YY XP x86 provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'r3dfox-xp-x32-narrow-yy'
          $selected = Join-Path $work 'selected'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $selected | Out-Null

          $members = @(& lib.exe /nologo /list $env:THUNK_YY_KERNEL32_LIB 2>&1 |
            ForEach-Object { "$_".Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $members.Count -eq 0) { throw 'Cannot enumerate YY XP x86 kernel32.lib' }
          $members | Set-Content -Encoding utf8 (Join-Path $work 'yy-kernel32-members.txt')

          $implementationPattern = '(?i)[\\/]YY_Thunks_for_' + [regex]::Escape($env:YY_THUNKS_TARGET) + '\.obj$'
          $clusterApis = @(
            'GetTickCount64','InitializeCriticalSectionEx','CompareStringOrdinal',
            'GetCurrentProcessorNumber','GetFileInformationByHandleEx','GetFinalPathNameByHandleW',
            'GetLocaleInfoEx','LCIDToLocaleName','LocaleNameToLCID','SetFileInformationByHandle','CancelIoEx',
            'CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread',
            'GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear','GetUserPreferredUILanguages',
            'InitOnceExecuteOnce','InitOnceBeginInitialize','InitOnceComplete',
            'QueryFullProcessImageNameA','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime',
            'TryAcquireSRWLockExclusive','FlsGetValue'
          )
          $wanted = @(
            @{ Key='process-direct'; Pattern='(?i)[\\/]_ProcessPrng@8\.obj$' },
            @{ Key='process-import'; Pattern='(?i)[\\/]_ProcessPrng@8\.obi$' },
            @{ Key='precise-direct'; Pattern='(?i)[\\/]_GetSystemTimePreciseAsFileTime@4\.obj$' },
            @{ Key='precise-import'; Pattern='(?i)[\\/]_GetSystemTimePreciseAsFileTime@4\.obi$' },
            @{ Key='flsalloc-direct'; Pattern='(?i)[\\/]_FlsAlloc@4\.obj$' },
            @{ Key='flsalloc-import'; Pattern='(?i)[\\/]_FlsAlloc@4\.obi$' },
            @{ Key='flsfree-direct'; Pattern='(?i)[\\/]_FlsFree@4\.obj$' },
            @{ Key='flsfree-import'; Pattern='(?i)[\\/]_FlsFree@4\.obi$' },
            @{ Key='flsset-direct'; Pattern='(?i)[\\/]_FlsSetValue@8\.obj$' },
            @{ Key='flsset-import'; Pattern='(?i)[\\/]_FlsSetValue@8\.obi$' },
            @{ Key='isfiber-direct'; Pattern='(?i)[\\/]_IsThreadAFiber@0\.obj$' },
            @{ Key='isfiber-import'; Pattern='(?i)[\\/]_IsThreadAFiber@0\.obi$' },
            @{ Key='stackguarantee-direct'; Pattern='(?i)[\\/]_SetThreadStackGuarantee@4\.obj$' },
            @{ Key='stackguarantee-import'; Pattern='(?i)[\\/]_SetThreadStackGuarantee@4\.obi$' },
            @{ Key='srw-acq-ex-direct'; Pattern='(?i)[\\/]_AcquireSRWLockExclusive@4\.obj$' },
            @{ Key='srw-acq-ex-import'; Pattern='(?i)[\\/]_AcquireSRWLockExclusive@4\.obi$' },
            @{ Key='srw-acq-sh-direct'; Pattern='(?i)[\\/]_AcquireSRWLockShared@4\.obj$' },
            @{ Key='srw-acq-sh-import'; Pattern='(?i)[\\/]_AcquireSRWLockShared@4\.obi$' },
            @{ Key='srw-rel-ex-direct'; Pattern='(?i)[\\/]_ReleaseSRWLockExclusive@4\.obj$' },
            @{ Key='srw-rel-ex-import'; Pattern='(?i)[\\/]_ReleaseSRWLockExclusive@4\.obi$' },
            @{ Key='srw-rel-sh-direct'; Pattern='(?i)[\\/]_ReleaseSRWLockShared@4\.obj$' },
            @{ Key='srw-rel-sh-import'; Pattern='(?i)[\\/]_ReleaseSRWLockShared@4\.obi$' },
            @{ Key='srw-init-direct'; Pattern='(?i)[\\/]_InitializeSRWLock@4\.obj$' },
            @{ Key='srw-init-import'; Pattern='(?i)[\\/]_InitializeSRWLock@4\.obi$' },
            @{ Key='cv-init-direct'; Pattern='(?i)[\\/]_InitializeConditionVariable@4\.obj$' },
            @{ Key='cv-init-import'; Pattern='(?i)[\\/]_InitializeConditionVariable@4\.obi$' },
            @{ Key='cv-sleep-cs-direct'; Pattern='(?i)[\\/]_SleepConditionVariableCS@12\.obj$' },
            @{ Key='cv-sleep-cs-import'; Pattern='(?i)[\\/]_SleepConditionVariableCS@12\.obi$' },
            @{ Key='cv-sleep-srw-direct'; Pattern='(?i)[\\/]_SleepConditionVariableSRW@16\.obj$' },
            @{ Key='cv-sleep-srw-import'; Pattern='(?i)[\\/]_SleepConditionVariableSRW@16\.obi$' },
            @{ Key='cv-wake-all-direct'; Pattern='(?i)[\\/]_WakeAllConditionVariable@4\.obj$' },
            @{ Key='cv-wake-all-import'; Pattern='(?i)[\\/]_WakeAllConditionVariable@4\.obi$' },
            @{ Key='cv-wake-one-direct'; Pattern='(?i)[\\/]_WakeConditionVariable@4\.obj$' },
            @{ Key='cv-wake-one-import'; Pattern='(?i)[\\/]_WakeConditionVariable@4\.obi$' },
            @{ Key='implementation'; Pattern=$implementationPattern }
          )
          foreach ($api in $clusterApis) {
            $escaped = [regex]::Escape($api)
            $wanted += @{ Key="cluster-$api-direct"; Pattern="(?i)[\\/]_${escaped}@\d+\.obj$" }
            $wanted += @{ Key="cluster-$api-import"; Pattern="(?i)[\\/]_${escaped}@\d+\.obi$" }
          }

          $objects = @()
          $memberMap = [System.Collections.Generic.List[string]]::new()
          foreach ($spec in $wanted) {
            $matches = @($members | Where-Object { $_ -match $spec.Pattern })
            if ($matches.Count -ne 1) { throw "Expected one $($spec.Key) member; found $($matches.Count)" }
            $dir = Join-Path $selected $spec.Key
            New-Item -ItemType Directory -Force $dir | Out-Null
            Push-Location $dir
            try {
              & lib.exe /nologo "/extract:$($matches[0])" $env:THUNK_YY_KERNEL32_LIB *> extract.log
              if ($LASTEXITCODE -ne 0) { throw "Failed to extract $($matches[0])" }
            } finally { Pop-Location }
            $file = Get-ChildItem -LiteralPath $dir -File |
              Where-Object { $_.Name -ne 'extract.log' } |
              Sort-Object Length -Descending | Select-Object -First 1
            if (-not $file) { throw "No extracted object for $($spec.Key)" }
            $dst = Join-Path $dir 'member.obj'
            Copy-Item -Force $file.FullName $dst
            (& dumpbin.exe /nologo /symbols $dst 2>&1 | Out-String) |
              Set-Content -Encoding utf8 (Join-Path $dir 'symbols.txt')
            $objects += $dst
            $memberMap.Add("$($spec.Key)|$($matches[0])")
          }
          $memberMap | Set-Content -Encoding utf8 (Join-Path $work 'selected-members.txt')

          $narrow = Join-Path $work 'yy-xp-rust-provider.lib'
          & lib.exe /nologo "/out:$narrow" @objects
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $narrow)) { throw 'Failed to build narrow YY XP x86 provider' }
          $symbols = (& dumpbin.exe /nologo /linkermember:1 $narrow 2>&1 | Out-String)
          $symbols | Set-Content -Encoding utf8 (Join-Path $work 'narrow-provider-symbols.txt')
          foreach ($required in @(
            'YY_Thunks_ProcessPrng','YY_Thunks_GetSystemTimePreciseAsFileTime',
            'YY_Thunks_FlsAlloc','YY_Thunks_FlsFree','YY_Thunks_FlsSetValue',
            'YY_Thunks_IsThreadAFiber','YY_Thunks_SetThreadStackGuarantee',
            'YY_Thunks_AcquireSRWLockExclusive','YY_Thunks_AcquireSRWLockShared',
            'YY_Thunks_ReleaseSRWLockExclusive','YY_Thunks_ReleaseSRWLockShared',
            'YY_Thunks_InitializeSRWLock','YY_Thunks_InitializeConditionVariable',
            'YY_Thunks_SleepConditionVariableCS','YY_Thunks_SleepConditionVariableSRW',
            'YY_Thunks_WakeAllConditionVariable','YY_Thunks_WakeConditionVariable'
          )) {
            if ($symbols.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) { throw "Narrow provider missing $required" }
          }
          foreach ($api in $clusterApis) {
            $required = "YY_Thunks_$api"
            if ($symbols.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) { throw "Narrow provider missing $required" }
          }
          foreach ($broad in @('LockResource','__imp_LockResource')) {
            if ($symbols -match ('(?m)(?:^|\s)' + [regex]::Escape($broad) + '\s*$')) { throw "Narrow provider exposes broad symbol $broad" }
          }

          "NARROW_YY_LIB=$narrow" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Activate narrow YY XP x86 provider for all target links
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($required in @($env:THUNK_YY_SYNCH_LIB,$env:NARROW_YY_LIB,$env:THUNK_YY_KERNEL32_LIB)) {
            if (-not $required -or -not (Test-Path $required)) { throw "Required YY linker input missing: $required" }
          }
          $yySynch = $env:THUNK_YY_SYNCH_LIB -replace '\\','/'
          $narrow = $env:NARROW_YY_LIB -replace '\\','/'
          $fullKernel32 = $env:THUNK_YY_KERNEL32_LIB -replace '\\','/'
          $targetLdflags = "$env:LDFLAGS $yySynch $narrow".Trim()
          if ($targetLdflags.IndexOf($fullKernel32, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw 'Invariant violation: full YY kernel32.lib was injected into global target LDFLAGS'
          }
          "LDFLAGS=$targetLdflags" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            'scope=all-target-links',
            "synchronization_lib=$yySynch",
            "narrow_provider=$narrow",
            'full_kernel32_lib=prohibited',
            "target_ldflags=$targetLdflags"
          ) | Set-Content -Encoding utf8 diagnostics\xp-x32-global-yy-link-contract.txt

      - name: Write XP x32 mozconfig
        shell: powershell
        run: |
          @'
