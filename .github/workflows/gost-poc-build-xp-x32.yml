name: "GOST TLS PoC build  XP x32"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xp-x32:
    name: Windows x86 / r3dfox GOST / XP SP3 full build
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost-xp-x32
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      RUST_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET: "i686-pc-windows-msvc"
      RUSTFLAGS: "--cfg moz_xp_compat"
      MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
      MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
      YY_THUNKS_VERSION: "1.2.2"
      YY_THUNKS_TARGET: "5.1.2600.0"
      WINDOWS_XP_SUBSYSTEM: "5.01"
      OBJDIR: "obj-gost-xp-x32"
      BCRYPT_TAG: "xp-bcrypt-v1"
      BCRYPT_RELEASE_ID: "380563342"
      BCRYPT_ASSET_ID: "539647946"
      BCRYPT_SOURCE_SHA: "a30a701fcf50eb08b6ea7574cb7cc927f6eae014"
      BCRYPT_SIZE: "520704"
      BCRYPT_SHA1: "ae021f44edc48b03bb4d67cb5773b62bdf60cb67"
      BCRYPT_SHA256: "f157f8026347d180e9ab42732bedaad0ea2b3b03dfd0d9ba8b8abe9612aff193"

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify XP DPI pre-Vista source guard
        id: dpi-source-guard
        shell: powershell
        run: .\.github\scripts\xp\verify-dpi-source-guard.ps1

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: .\.github\scripts\xp\plan-pagefile.ps1

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile and show runner CPU
        shell: powershell
        run: .\.github\scripts\xp\verify-runner-pagefile.ps1
        
      - name: GATE - Verify committed mime_guess vendored checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mime = 'third_party\rust\mime_guess\src\mime_types.rs'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          $expected = '1579ebd4fae3e0e8b1fe2d7677165868e6ba856c5e587538d9cb7b478a91078b'

          $actual = (Get-FileHash -Algorithm SHA256 $mime).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Unexpected mime_guess source hash: $actual"
          }

          $text = [System.IO.File]::ReadAllText($checksum)
          if (-not $text.Contains($expected)) {
            throw 'Committed mime_guess checksum entry is missing.'
          }

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }

      - name: Prepare pinned legacy Firefox XP D3DCompiler_47
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $uri = 'https://archive.mozilla.org/pub/firefox/releases/52.2.1esr/win32/en-US/Firefox%20Setup%2052.2.1esr.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 7z.exe x $installer "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract pinned legacy Firefox installer: $LASTEXITCODE" }
          $match = $null
          foreach ($candidate in @(Get-ChildItem -Path $extract -Recurse -File -Filter 'd3dcompiler_47.dll')) {
            $hash = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLowerInvariant()
            if ($hash -eq $expected) { $match = $candidate; break }
          }
          if (-not $match) { throw "Pinned Firefox source does not contain expected D3DCompiler_47 SHA256 $expected" }
          "LEGACY_D3DCOMPILER47=$($match.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD
          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"
          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) { throw 'Expected MSSPI Windows.h include was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($msspiCpp, $source.Replace('#include <Windows.h>', '#include <windows.h>').Replace('SECPKG_ATTR_REMOTE_CERT_CHAIN', 'SECPKG_ATTR_REMOTE_CERT_CONTEXT'), $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]
          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += ["msspi/src/msspi.cpp"]
              LOCAL_INCLUDES += ["msspi/src", "msspi/third_party/cprocsp/include"]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare pinned XP bcrypt release asset
        shell: powershell
        run: .\.github\scripts\xp\prepare-pinned-xp-bcrypt.ps1

      - name: Install pinned ordinary Rust x86 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Build pinned msvcr14x Release x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $root = Join-Path $env:RUNNER_TEMP 'msvcr14x'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          git init $root
          git -C $root remote add origin $env:MSVCR14X_REPO
          git -C $root fetch --depth=1 origin $env:MSVCR14X_SHA
          git -C $root checkout --detach FETCH_HEAD
          git -C $root submodule update --init --recursive --depth 1
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:MSVCR14X_SHA) { throw "Unexpected msvcr14x commit: $actual" }

          & msbuild.exe (Join-Path $root 'msvcr14x.sln') /m /t:Build '/p:Configuration=Release;Platform=x86' -r "/bl:$env:GITHUB_WORKSPACE\diagnostics\msvcr14x-release-x86.binlog"
          if ($LASTEXITCODE -ne 0) { throw "msvcr14x build failed: $LASTEXITCODE" }

          $required = @('ucrtbase.dll','ucrt.lib','vcruntime.lib','msvcprt.lib','msvcp140.dll')
          $release = $null
          $candidateDirs = @(Get-ChildItem -Path $root -Recurse -File -Filter 'ucrtbase.dll' |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique)
          foreach ($candidate in $candidateDirs) {
            $missing = @($required | Where-Object { -not (Test-Path (Join-Path $candidate $_)) })
            if ($missing.Count -gt 0) { continue }
            $headers = (& dumpbin.exe /nologo /headers (Join-Path $candidate 'ucrtbase.dll') 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -and $headers -match '(?im)^\s*14C machine \(x86\)') {
              $release = $candidate
              break
            }
          }
          if (-not $release) { throw 'Cannot locate complete x86 msvcr14x Release output' }

          "MSVCR14X_RELEASE=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$release;$env:LIB" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LDFLAGS=-LIBPATH:$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -LiteralPath $release -File | Sort-Object Name |
            Select-Object Name,Length | Format-Table -AutoSize | Out-String -Width 240 |
            Set-Content -Encoding utf8 diagnostics\msvcr14x-release-files.txt

      - name: GATE - Require proven XP x86 msvcr14x runtime contract
        shell: powershell
        run: .\.github\scripts\xp\verify-msvcr14x-xp-contract.ps1

      - name: Prepare pinned private DirectWrite integration
        id: prepare-private-dwrite
        shell: powershell
        run: .\.github\scripts\xp\prepare-private-dwrite-integration.ps1

      - name: Download YY-Thunks 1.2.2 XP x86 libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)Lib.*\.zip$|(?i)-Lib\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Lib asset not found" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-xp-x86'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root

          $targetPattern = [regex]::Escape($env:YY_THUNKS_TARGET)
          $yyLib = Get-ChildItem -Path $root -Recurse -Directory |
            Where-Object { $_.FullName -match "(?i)[\\/]Lib[\\/]$targetPattern[\\/]x86$" } |
            Select-Object -First 1
          if (-not $yyLib) { throw "YY-Thunks Lib/$env:YY_THUNKS_TARGET/x86 not found" }

          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          $ws2 = Join-Path $yyLib.FullName 'ws2_32.lib'
          if (-not (Test-Path $kernel32) -or -not (Test-Path $synch) -or -not (Test-Path $ws2)) { throw 'Required YY XP x86 libraries are missing' }
          "THUNK_YY_LIB=$($yyLib.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_SYNCH_LIB=$synch" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_WS2_32_LIB=$ws2" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build narrow YY XP x86 provider
        shell: powershell
        run: .\.github\scripts\xp\build-narrow-yy.ps1

      - name: Activate narrow YY XP x86 provider for all target links
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ntdll = Join-Path $env:THUNK_YY_LIB 'ntdll.lib'
          $advapi = Join-Path $env:THUNK_YY_LIB 'advapi32.lib'
          $ws2 = $env:THUNK_YY_WS2_32_LIB
          foreach ($required in @($env:THUNK_YY_SYNCH_LIB,$env:NARROW_YY_LIB,$env:THUNK_YY_KERNEL32_LIB,$ntdll,$advapi,$ws2)) {
            if (-not $required -or -not (Test-Path $required)) { throw "Required YY linker input missing: $required" }
          }

          $members = @(& lib.exe /nologo /list $ntdll 2>&1 |
            ForEach-Object { "$_".Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $members.Count -eq 0) { throw 'Cannot enumerate YY XP x86 ntdll.lib' }
          $direct = @($members | Where-Object { $_ -match '(?i)[\\/]_NtCancelIoFileEx@12\.obj$' })
          $import = @($members | Where-Object { $_ -match '(?i)[\\/]_NtCancelIoFileEx@12\.obi$' })
          if ($direct.Count -ne 1 -or $import.Count -ne 1) { throw "Expected one NtCancelIoFileEx .obj/.obi pair; found obj=$($direct.Count) obi=$($import.Count)" }
          $aliasWork = Join-Path $env:RUNNER_TEMP 'r3dfox-xp-x32-ntcancel-alias'
          $selected = Join-Path $aliasWork 'selected'
          if (Test-Path $aliasWork) { Remove-Item -Recurse -Force $aliasWork }
          New-Item -ItemType Directory -Force $selected | Out-Null
          $aliasObjects = @()
          foreach ($item in @($direct[0],$import[0])) {
            $dir = Join-Path $selected ([IO.Path]::GetExtension($item).TrimStart('.'))
            New-Item -ItemType Directory -Force $dir | Out-Null
            Push-Location $dir
            try {
              & lib.exe /nologo "/extract:$item" $ntdll *> extract.log
              if ($LASTEXITCODE -ne 0) { throw 'NtCancelIoFileEx alias extraction failed' }
            } finally { Pop-Location }
            $file = Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -ne 'extract.log' } | Sort-Object Length -Descending | Select-Object -First 1
            if (-not $file) { throw 'NtCancelIoFileEx alias extraction produced no object' }
            $dst = Join-Path $dir 'member.obj'
            Copy-Item -Force $file.FullName $dst
            $aliasObjects += $dst
          }
          $ntCancelAlias = Join-Path $aliasWork 'yy-xp-ntcancel-alias.lib'
          & lib.exe /nologo "/out:$ntCancelAlias" @aliasObjects
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ntCancelAlias)) { throw 'NtCancelIoFileEx alias library build failed' }
          $aliasSymbols = (& dumpbin.exe /nologo /linkermember:1 $ntCancelAlias 2>&1 | Out-String)
          $aliasSymbols | Set-Content -Encoding utf8 (Join-Path $aliasWork 'alias-symbols.txt')
          if ($aliasSymbols.IndexOf('_NtCancelIoFileEx@12',[System.StringComparison]::Ordinal) -lt 0) { throw 'NtCancelIoFileEx alias library lacks the x86 entry symbol' }
          $providerSymbols = (& dumpbin.exe /nologo /linkermember:1 $env:NARROW_YY_LIB 2>&1 | Out-String)
          if ($providerSymbols.IndexOf('_YY_Thunks_NtCancelIoFileEx@12',[System.StringComparison]::Ordinal) -lt 0) { throw 'Proven narrow provider lacks YY_Thunks_NtCancelIoFileEx implementation' }
          @(
            "direct=$($direct[0])",
            "import=$($import[0])",
            "alias_provider=$ntCancelAlias",
            'implementation=existing NARROW_YY_LIB common YY object',
            'evidence_run=33861819326',
            'evidence_job=100987750213',
            'evidence_sha=be122cfc36d84e3144b73bcbaa2a2f46ff45f1a2',
            'capability=PASS'
          ) | Set-Content -Encoding utf8 diagnostics\yy-ntcancel-capability.txt

          $etwApis = @('EventRegister','EventUnregister','EventWrite','EventWriteTransfer','RegGetValueW')
          $advapiMembers = @(& lib.exe /nologo /list $advapi 2>&1 | ForEach-Object { "$_".Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $advapiMembers.Count -eq 0) { throw 'Cannot enumerate YY XP x86 advapi32.lib' }
          $etwAliasWork = Join-Path $env:RUNNER_TEMP 'r3dfox-xp-x32-advapi32-etw-alias'
          $etwSelected = Join-Path $etwAliasWork 'selected'
          if (Test-Path $etwAliasWork) { Remove-Item -Recurse -Force $etwAliasWork }
          New-Item -ItemType Directory -Force $etwSelected | Out-Null
          $etwAliasObjects = @()
          $etwEvidence = [System.Collections.Generic.List[string]]::new()
          foreach ($api in $etwApis) {
            $escaped = [regex]::Escape($api)
            $direct = @($advapiMembers | Where-Object { $_ -match "(?i)[\\/]_${escaped}@\d+\.obj$" })
            $import = @($advapiMembers | Where-Object { $_ -match "(?i)[\\/]_${escaped}@\d+\.obi$" })
            if ($direct.Count -ne 1 -or $import.Count -ne 1) { throw "Expected one $api .obj/.obi pair; found obj=$($direct.Count) obi=$($import.Count)" }
            $etwEvidence.Add("$api|direct=$($direct[0])|import=$($import[0])")
            foreach ($item in @($direct[0],$import[0])) {
              $kind = [IO.Path]::GetExtension($item).TrimStart('.')
              $dir = Join-Path $etwSelected "$api-$kind"
              New-Item -ItemType Directory -Force $dir | Out-Null
              Push-Location $dir
              try { & lib.exe /nologo "/extract:$item" $advapi *> extract.log; if ($LASTEXITCODE -ne 0) { throw "$api alias extraction failed" } } finally { Pop-Location }
              $file = Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -ne 'extract.log' } | Sort-Object Length -Descending | Select-Object -First 1
              if (-not $file) { throw "$api alias extraction produced no object" }
              $dst = Join-Path $dir 'member.obj'
              Copy-Item -Force $file.FullName $dst
              $etwAliasObjects += $dst
            }
          }
          $advapiEtwAlias = Join-Path $etwAliasWork 'yy-xp-advapi32-etw-alias.lib'
          & lib.exe /nologo "/out:$advapiEtwAlias" @etwAliasObjects
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $advapiEtwAlias)) { throw 'ADVAPI32 alias library build failed' }
          $etwAliasSymbols = (& dumpbin.exe /nologo /linkermember:1 $advapiEtwAlias 2>&1 | Out-String)
          $etwAliasSymbols | Set-Content -Encoding utf8 (Join-Path $etwAliasWork 'alias-symbols.txt')
          foreach ($api in $etwApis) {
            if ($etwAliasSymbols.IndexOf($api,[System.StringComparison]::Ordinal) -lt 0) { throw "ADVAPI32 alias provider missing $api" }
            if ($providerSymbols.IndexOf("YY_Thunks_$api",[System.StringComparison]::Ordinal) -lt 0) { throw "Proven narrow provider lacks YY_Thunks_$api implementation" }
          }
          $etwEvidence.Add("alias_provider=$advapiEtwAlias")
          $etwEvidence.Add('implementation=existing NARROW_YY_LIB common YY object')
          $etwEvidence.Add('apis=EventRegister,EventUnregister,EventWrite,EventWriteTransfer,RegGetValueW')
          $etwEvidence.Add('etw_evidence_run=33882235341')
          $etwEvidence.Add('etw_evidence_job=101053403554')
          $etwEvidence.Add('etw_evidence_sha=53971dcfdf12e7bcd7f35692ff2c02fb3360d792')
          $etwEvidence.Add('reggetvaluew_evidence_run=33946751857')
          $etwEvidence.Add('reggetvaluew_evidence_job=101254130849')
          $etwEvidence.Add('reggetvaluew_evidence_sha=8ad1d5e9a935ed1cce8ee268f693af72aad1f7c4')
          $etwEvidence.Add('capability=PASS')
          $etwEvidence | Set-Content -Encoding utf8 diagnostics\yy-etw-capability.txt

          $ws2Apis = @(@{ Name='WSAIoctl'; Stack=36 }, @{ Name='inet_ntop'; Stack=16 })
          $ws2Members = @(& lib.exe /nologo /list $ws2 2>&1 | ForEach-Object { "$_".Trim() } | Where-Object { $_ } | Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $ws2Members.Count -eq 0) { throw 'Cannot enumerate YY XP x86 ws2_32.lib' }
          $ws2AliasWork = Join-Path $env:RUNNER_TEMP 'r3dfox-xp-x32-ws2_32-alias'
          $ws2Selected = Join-Path $ws2AliasWork 'selected'
          if (Test-Path $ws2AliasWork) { Remove-Item -Recurse -Force $ws2AliasWork }
          New-Item -ItemType Directory -Force $ws2Selected | Out-Null
          $ws2AliasObjects = @()
          $ws2Evidence = [System.Collections.Generic.List[string]]::new()
          foreach ($spec in $ws2Apis) {
            $api = $spec.Name
            $stack = $spec.Stack
            $escaped = [regex]::Escape($api)
            $direct = @($ws2Members | Where-Object { $_ -match "(?i)[\\/]_${escaped}@$stack\.obj$" })
            $import = @($ws2Members | Where-Object { $_ -match "(?i)[\\/]_${escaped}@$stack\.obi$" })
            if ($direct.Count -ne 1 -or $import.Count -ne 1) { throw "Expected one proven $api @$stack .obj/.obi pair; found obj=$($direct.Count) obi=$($import.Count)" }
            if ($providerSymbols.IndexOf("YY_Thunks_$api",[System.StringComparison]::Ordinal) -lt 0) { throw "Proven narrow provider lacks YY_Thunks_$api implementation" }
            $ws2Evidence.Add("$api|direct=$($direct[0])|import=$($import[0])")
            foreach ($item in @($direct[0],$import[0])) {
              $kind = [IO.Path]::GetExtension($item).TrimStart('.')
              $dir = Join-Path $ws2Selected "$api-$kind"
              New-Item -ItemType Directory -Force $dir | Out-Null
              Push-Location $dir
              try { & lib.exe /nologo "/extract:$item" $ws2 *> extract.log; if ($LASTEXITCODE -ne 0) { throw "$api alias extraction failed" } } finally { Pop-Location }
              $file = Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -ne 'extract.log' } | Sort-Object Length -Descending | Select-Object -First 1
              if (-not $file) { throw "$api alias extraction produced no object"}
              $dst = Join-Path $dir 'member.obj'
              Copy-Item -Force $file.FullName $dst
              $ws2AliasObjects += $dst
            }
          }
          $ws2Alias = Join-Path $ws2AliasWork 'yy-xp-ws2_32-alias.lib'
          & lib.exe /nologo "/out:$ws2Alias" @ws2AliasObjects
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $ws2Alias)) { throw 'WS2_32 alias library build failed' }
          $ws2AliasSymbols = (& dumpbin.exe /nologo /linkermember:1 $ws2Alias 2>&1 | Out-String)
          $ws2AliasSymbols | Set-Content -Encoding utf8 (Join-Path $ws2AliasWork 'alias-symbols.txt')
          foreach ($spec in $ws2Apis) { if ($ws2AliasSymbols.IndexOf($spec.Name,[System.StringComparison]::Ordinal) -lt 0) { throw "WS2_32 alias provider missing $($spec.Name)" } }
          $ws2Evidence.Add("alias_provider=$ws2Alias")
          $ws2Evidence.Add('implementation=existing NARROW_YY_LIB common YY object')
          $ws2Evidence.Add('apis=WSAIoctl,inet_ntop')
          $ws2Evidence.Add('evidence_run=34021400841')
          $ws2Evidence.Add('evidence_job=101454550948')
          $ws2Evidence.Add('evidence_sha=5451673565030445262f5b6ef48b4059e0e0501e')
          $ws2Evidence.Add('capability=PASS')
          $ws2Evidence | Set-Content -Encoding utf8 diagnostics\yy-ws2_32-capability.txt

          $yySynch = $env:THUNK_YY_SYNCH_LIB -replace '\\','/'
          $narrow = $env:NARROW_YY_LIB -replace '\\','/'
          $ntCancelAliasLink = $ntCancelAlias -replace '\\','/'
          $advapiEtwAliasLink = $advapiEtwAlias -replace '\\','/'
          $ws2AliasLink = $ws2Alias -replace '\\','/'
          $fullKernel32 = $env:THUNK_YY_KERNEL32_LIB -replace '\\','/'
          $fullNtdll = $ntdll -replace '\\','/'
          $fullAdvapi = $advapi -replace '\\','/'
          $fullWs2 = $ws2 -replace '\\','/'
          $targetLdflags = "$env:LDFLAGS $ntCancelAliasLink $advapiEtwAliasLink $ws2AliasLink $narrow $yySynch".Trim()
          if ($targetLdflags.IndexOf($fullKernel32, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Invariant violation: full YY kernel32.lib was injected into global target LDFLAGS' }
          if ($targetLdflags.IndexOf($fullNtdll, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Invariant violation: full YY ntdll.lib was injected into global target LDFLAGS' }
          if ($targetLdflags.IndexOf($fullAdvapi, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Invariant violation: full YY advapi32.lib was injected into global target LDFLAGS' }
          if ($targetLdflags.IndexOf($fullWs2, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw 'Invariant violation: full YY ws2_32.lib was injected into global target LDFLAGS' }
          "LDFLAGS=$targetLdflags" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            'scope=all-target-links',
            "ntcancel_alias_provider=$ntCancelAliasLink",
            "advapi32_etw_alias_provider=$advapiEtwAliasLink",
            "ws2_32_alias_provider=$ws2AliasLink",
            "narrow_provider=$narrow",
            "synchronization_lib=$yySynch",
            'full_kernel32_lib=prohibited',
            'full_ntdll_lib=prohibited',
            'full_advapi32_lib=prohibited',
            'full_ws2_32_lib=prohibited',
            "target_ldflags=$targetLdflags"
          ) | Set-Content -Encoding utf8 diagnostics\xp-x32-global-yy-link-contract.txt

