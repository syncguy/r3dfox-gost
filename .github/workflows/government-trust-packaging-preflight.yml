name: Government trust packaging preflight

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - "r3dfox/policies.json"
      - "r3dfox/certificates/**"
      - "r3dfox/moz.build"
      - "browser/installer/package-manifest.in"
      - ".github/workflows/government-trust-packaging-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-preflight:
    name: Windows/NSS trust packaging contract
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      ROOT_CERT: r3dfox\certificates\russian_trusted_root_ca.cer
      ROOT_SHA256: d26d2d0231b7c39f92cc738512ba54103519e4405d68b5bd703e9788ca8ecf31

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: GATE - Policy imports Windows enterprise roots
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content 'r3dfox\policies.json' -Raw | ConvertFrom-Json
          if (-not $policy.policies.Certificates) {
            throw 'policies.json has no Certificates policy.'
          }
          if ($policy.policies.Certificates.ImportEnterpriseRoots -ne $true) {
            throw 'Certificates.ImportEnterpriseRoots must be true.'
          }
          $install = @($policy.policies.Certificates.Install)
          if ($install -notcontains 'russian_trusted_root_ca.cer') {
            throw 'Certificates.Install must contain russian_trusted_root_ca.cer.'
          }

      - name: GATE - Russian Trusted Root CA identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:ROOT_CERT)) {
            throw "Bundled root is missing: $env:ROOT_CERT"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $env:ROOT_CERT).Hash.ToLowerInvariant()
          if ($hash -ne $env:ROOT_SHA256) {
            throw "Root SHA-256 mismatch: expected $env:ROOT_SHA256 got $hash"
          }
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($env:ROOT_CERT)
          Write-Host "Subject=$($cert.Subject)"
          Write-Host "Issuer=$($cert.Issuer)"
          Write-Host "NotBefore=$($cert.NotBefore.ToUniversalTime().ToString('o'))"
          Write-Host "NotAfter=$($cert.NotAfter.ToUniversalTime().ToString('o'))"
          if ($cert.Subject -ne $cert.Issuer) { throw 'Expected a self-signed root certificate.' }
          if ($cert.Subject -notmatch 'CN=Russian Trusted Root CA') { throw 'Unexpected root subject.' }
          if ($cert.Subject -notmatch 'Ministry of Digital Development') { throw 'Unexpected root organization.' }
          $bc = $cert.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.19' } | Select-Object -First 1
          if (-not $bc) { throw 'BasicConstraints extension is missing.' }
          $bc2 = [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]$bc
          if (-not $bc2.CertificateAuthority) { throw 'Bundled certificate is not a CA.' }

      - name: GATE - Build and package manifests stage the root
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $moz = [System.IO.File]::ReadAllText('r3dfox\moz.build')
          if (-not $moz.Contains('certificates/russian_trusted_root_ca.cer')) {
            throw 'r3dfox/moz.build does not stage the Russian Trusted Root CA.'
          }
          $manifest = [System.IO.File]::ReadAllText('browser\installer\package-manifest.in')
          if (-not $manifest.Contains('@RESPATH@/distribution/Certificates/russian_trusted_root_ca.cer')) {
            throw 'package-manifest.in does not package the Russian Trusted Root CA.'
          }

      - name: Summary
        if: always()
        shell: powershell
        run: |
          @'
          ## Government trust packaging preflight

          Required contract:
          - Windows enterprise roots explicitly enabled by Firefox policy
          - Russian Trusted Root CA bundled as the only explicit fallback root
          - no bundled intermediate trust anchor
          - exact root SHA-256 pinned
          - moz.build and package-manifest staging required
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
