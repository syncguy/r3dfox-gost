name: Publish proven XP bcrypt release

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - .github/workflows/publish-xp-bcrypt-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci(xp): publish bcrypt release v1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: xp-bcrypt-v1
      TARGET_SHA: a30a701fcf50eb08b6ea7574cb7cc927f6eae014
      SOURCE_RUN: '33513084915'
      SOURCE_JOB: '99873297193'
      RUNTIME_ARTIFACT_ID: '9802703271'
      ARTIFACT_NAME: onecore-bcrypt-source-xp-x86-runtime
      EXPECTED_SIZE: '520704'
      EXPECTED_SHA1: ae021f44edc48b03bb4d67cb5773b62bdf60cb67
      EXPECTED_SHA256: f157f8026347d180e9ab42732bedaad0ea2b3b03dfd0d9ba8b8abe9612aff193
    steps:
      - name: Reject existing tag or release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Download exact proven runtime artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir runtime
          test -f runtime/bcrypt.dll

      - name: Verify exact bcrypt binary
        shell: bash
        run: |
          set -euo pipefail
          actual_size="$(stat -c '%s' runtime/bcrypt.dll)"
          actual_sha1="$(sha1sum runtime/bcrypt.dll | awk '{print $1}')"
          actual_sha256="$(sha256sum runtime/bcrypt.dll | awk '{print $1}')"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha1" = "$EXPECTED_SHA1"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          printf 'bcrypt.dll size=%s\nSHA-1=%s\nSHA-256=%s\n' "$actual_size" "$actual_sha1" "$actual_sha256"

      - name: Publish raw DLL as technical release asset
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Physically proven Windows XP x86 bcrypt compatibility primitive for r3dfox-gost.

          - project source-under-test: \`$TARGET_SHA\`
          - GitHub Actions run: \`$SOURCE_RUN\`
          - job: \`$SOURCE_JOB\`
          - runtime artifact: \`$RUNTIME_ARTIFACT_ID\`
          - upstream One-Core source: \`9eb3c31de9460c1ccce3f6a10c9c4a704f032514\`
          - architecture: x86
          - physical runtime: Windows XP 5.1.2600 PASS
          - deployment closure: one app-local \`bcrypt.dll\`; mbedTLS C implementation embedded; no runtime \`mbedtls.dll\`
          - bcrypt.dll size: \`$EXPECTED_SIZE\` bytes
          - SHA-1: \`$EXPECTED_SHA1\`
          - SHA-256: \`$EXPECTED_SHA256\`

          The attached \`bcrypt.dll\` is the raw proven binary, not an archive.
          EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "XP bcrypt primitive v1" \
            --notes-file release-notes.md \
            --prerelease \
            runtime/bcrypt.dll
