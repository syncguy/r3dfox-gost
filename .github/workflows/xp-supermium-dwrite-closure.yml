name: XP Supermium DWrite closure audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dwrite-closure-x86:
    name: Supermium DWrite / XP x86 dependency closure
    runs-on: windows-2022
    timeout-minutes: 30

    env:
      SUPERMIUM_TAG: "v132-r5-02"
      SUPERMIUM_ASSET: "supermium_132_32_nonsetup.zip"
      SUPERMIUM_ASSET_SHA256: "3e181d50818fc95769f123012ad4cc0ffefe882f2fa4606620d2c031638a5912"
      DWRITE_SHA1: "4e466d98bebea7b31764cfb15603b91a5f53fe72"
      DWRITE_SHA256: "945f83efcec25ea71334a2d6117666aa625641cc2a92def474ef96cffa969e77"
      DWRITE_SIZE: "2667048"
      YY_THUNKS_TAG: "v1.2.2"
      YY_THUNKS_SOURCE_SHA: "83d9d0d3f2f212411006e4aa5c5f3db8a6ae2f20"
      YY_THUNKS_LIB_SHA256: "ffe4d9c1b6bb53225ee2af1cac7b36bce90bb1f33ae65f9ba523debcb33ce6ab"
      YY_THUNKS_TARGET: "5.1.2600.0"
      WINDOWS_XP_SUBSYSTEM: "5.01"

    steps:
      - name: Record experiment identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @(
            "repo=$env:GITHUB_REPOSITORY",
            "workflow_sha=$env:GITHUB_SHA",
            "workflow_ref=$env:GITHUB_REF",
            'firefox_source=NOT_APPLICABLE',
            'scope=external static Supermium DWrite dependency-closure plus pinned YY-Thunks coverage audit only',
            "supermium_tag=$env:SUPERMIUM_TAG",
            "supermium_asset=$env:SUPERMIUM_ASSET",
            "supermium_asset_sha256=$env:SUPERMIUM_ASSET_SHA256",
            "dwrite_sha256=$env:DWRITE_SHA256",
            "yy_thunks_tag=$env:YY_THUNKS_TAG",
            "yy_thunks_source_sha=$env:YY_THUNKS_SOURCE_SHA",
            "yy_thunks_lib_sha256=$env:YY_THUNKS_LIB_SHA256",
            "yy_thunks_target=$env:YY_THUNKS_TARGET"
          ) | Set-Content -Encoding utf8 diagnostics\identity.txt

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Download and verify pinned YY-Thunks x86 provider libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://github.com/Chuyu-Team/YY-Thunks/releases/download/$env:YY_THUNKS_TAG/YY-Thunks-Lib.zip"
          $archive = Join-Path $env:RUNNER_TEMP 'YY-Thunks-Lib.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'yy-thunks-lib'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:YY_THUNKS_LIB_SHA256) {
            throw "Pinned YY-Thunks libraries SHA256 mismatch: expected=$env:YY_THUNKS_LIB_SHA256 actual=$actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          "YY_LIB_ROOT=$extract" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "source_uri=$uri",
            "tag=$env:YY_THUNKS_TAG",
            "source_sha=$env:YY_THUNKS_SOURCE_SHA",
            "archive_sha256=$actual",
            "target=$env:YY_THUNKS_TARGET",
            'architecture=x86'
          ) | Set-Content -Encoding utf8 diagnostics\yy-thunks-source.txt

      - name: Index pinned YY-Thunks fallback providers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rawRoot = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\yy-linkermember'
          New-Item -ItemType Directory -Force $rawRoot | Out-Null

          $allLibs = @(Get-ChildItem -LiteralPath $env:YY_LIB_ROOT -Recurse -File -Filter '*.lib')
          $allLibs | ForEach-Object {
            $_.FullName.Substring($env:YY_LIB_ROOT.Length).TrimStart([char[]]'\/')
          } | Sort-Object | Set-Content -Encoding utf8 diagnostics\yy-lib-paths.txt

          $targetToken = [regex]::Escape($env:YY_THUNKS_TARGET)
          $targetPattern = "(?i)[\\/]$targetToken[\\/]x86[\\/]"
          $libs = @($allLibs | Where-Object { $_.FullName -match $targetPattern })
          if ($libs.Count -eq 0) {
            throw "No YY-Thunks libraries found for target $env:YY_THUNKS_TARGET x86; inspect yy-lib-paths.txt."
          }

          $rows = [System.Collections.Generic.List[object]]::new()
          foreach ($lib in $libs) {
            $module = (([System.IO.Path]::GetFileNameWithoutExtension($lib.Name)) + '.dll').ToLowerInvariant()
            $safe = $lib.Name -replace '[^A-Za-z0-9_.-]', '_'
            $lines = @(& dumpbin.exe /nologo /linkermember:2 $lib.FullName 2>&1)
            $exitCode = $LASTEXITCODE
            $lines | Set-Content -Encoding utf8 (Join-Path $rawRoot "$safe.txt")
            if ($exitCode -ne 0) { throw "dumpbin /linkermember:2 failed for $($lib.FullName) with exit $exitCode" }

            foreach ($line in $lines) {
              $text = $line.Trim()
              if ($text -notmatch '^[0-9A-Fa-f]+\s+(\S+)$') { continue }
              $symbol = $matches[1]
              if ($symbol -match '^__imp_(.+)$') { $symbol = $matches[1] }
              if ($symbol -match '^_(.+)$') { $symbol = $matches[1] }
              if ($symbol -match '^(.+)@\d+$') { $symbol = $matches[1] }
              if ($symbol -notmatch '^YY_Thunks_([A-Za-z][A-Za-z0-9_]*)$') { continue }
              $api = $matches[1]
              $rows.Add([pscustomobject]@{
                Module=$module
                API=$api
                Provider=("$($lib.Name)!YY_Thunks_$api")
                Library=$lib.FullName
              })
            }
          }

          $unique = @($rows | Sort-Object Module,API,Provider -Unique)
          if ($unique.Count -eq 0) {
            throw "No explicit YY_Thunks_* fallback symbols found for target $env:YY_THUNKS_TARGET x86; inspect yy-linkermember diagnostics."
          }
          $unique | Export-Csv -NoTypeInformation -Encoding utf8 diagnostics\yy-fallback-providers.csv
          "YY_PROVIDER_INDEX=$env:GITHUB_WORKSPACE\diagnostics\yy-fallback-providers.csv" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "library_count=$($libs.Count)",
            "fallback_provider_count=$($unique.Count)",
            "target=$env:YY_THUNKS_TARGET",
            'architecture=x86',
            'coverage_basis=explicit YY_Thunks_<API> public symbol in pinned target library'
          ) | Add-Content -Encoding utf8 diagnostics\yy-thunks-source.txt

      - name: Download and verify pinned Supermium x86 package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://github.com/win32ss/supermium/releases/download/$env:SUPERMIUM_TAG/$env:SUPERMIUM_ASSET"
          $archive = Join-Path $env:RUNNER_TEMP $env:SUPERMIUM_ASSET
          $extract = Join-Path $env:RUNNER_TEMP 'supermium-dwrite-closure'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:SUPERMIUM_ASSET_SHA256) {
            throw "Pinned Supermium asset SHA256 mismatch: expected=$env:SUPERMIUM_ASSET_SHA256 actual=$actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          "SUPERMIUM_EXTRACT=$extract" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "source_uri=$uri",
            "archive=$archive",
            "archive_sha256=$actual"
          ) | Set-Content -Encoding utf8 diagnostics\supermium-source.txt

      - name: GATE - Locate exact DWrite.dll
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $matchesFound = [System.Collections.Generic.List[System.IO.FileInfo]]::new()
          foreach ($candidate in @(Get-ChildItem -LiteralPath $env:SUPERMIUM_EXTRACT -Recurse -File -Filter 'DWrite.dll')) {
            $sha256 = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLowerInvariant()
            if ($sha256 -eq $env:DWRITE_SHA256) { $matchesFound.Add($candidate) }
          }
          if ($matchesFound.Count -ne 1) { throw "Expected exactly one exact DWrite.dll; found $($matchesFound.Count)." }
          $dwrite = $matchesFound[0]
          $item = Get-Item $dwrite.FullName
          $sha1 = (Get-FileHash -Algorithm SHA1 $dwrite.FullName).Hash.ToLowerInvariant()
          $sha256 = (Get-FileHash -Algorithm SHA256 $dwrite.FullName).Hash.ToLowerInvariant()
          if ([string]$item.Length -ne $env:DWRITE_SIZE) { throw "DWrite.dll size mismatch: $($item.Length)" }
          if ($sha1 -ne $env:DWRITE_SHA1) { throw "DWrite.dll SHA1 mismatch: $sha1" }
          if ($sha256 -ne $env:DWRITE_SHA256) { throw "DWrite.dll SHA256 mismatch: $sha256" }
          "DWRITE_PATH=$($dwrite.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DWRITE_ROOT=$($dwrite.Directory.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @(
            "path=$($dwrite.FullName)",
            "size=$($item.Length)",
            "sha1=$sha1",
            "sha256=$sha256"
          ) | Set-Content -Encoding utf8 diagnostics\dwrite-identity.txt

      - name: Analyze recursive app-local dependency, API and forwarder closure
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rawRoot = Join-Path $env:GITHUB_WORKSPACE 'diagnostics\raw'
          New-Item -ItemType Directory -Force $rawRoot | Out-Null

          function Normalize-ModuleName([string]$name) {
            $value = $name.Trim()
            if ($value -notmatch '(?i)\.(dll|drv)$') { $value += '.dll' }
            return $value
          }

          function Normalize-Api([string]$name) {
            $value = $name.Trim()
            if ($value -match '^__imp_(.+)$') { $value = $matches[1] }
            if ($value -match '^_(.+)$') { $value = $matches[1] }
            if ($value -match '^(.+)@\d+$') { $value = $matches[1] }
            return $value
          }

          function Invoke-Dumpbin([string]$mode, [string]$path, [string]$output) {
            $lines = @(& dumpbin.exe /nologo "/$mode" $path 2>&1)
            $exitCode = $LASTEXITCODE
            $lines | Set-Content -Encoding utf8 $output
            if ($exitCode -ne 0) { throw "dumpbin /$mode failed for $path with exit $exitCode" }
            return $lines
          }

          function Get-ImportEdges([string[]]$lines) {
            $result = [System.Collections.Generic.List[object]]::new()
            $mode = 'none'
            $currentModule = $null
            foreach ($line in $lines) {
              if ($line -match '^\s*Section contains the following imports:\s*$') {
                $mode = 'direct'
                $currentModule = $null
                continue
              }
              if ($line -match '^\s*Section contains the following delay load imports:\s*$') {
                $mode = 'delay'
                $currentModule = $null
                continue
              }
              if ($mode -ne 'none' -and $line -match '^\s{4}([A-Za-z0-9_.-]+\.(?:dll|drv))\s*$') {
                $currentModule = Normalize-ModuleName $matches[1]
                continue
              }
              if ($mode -eq 'none' -or -not $currentModule) { continue }
              $entry = $line.Trim()
              if ($entry -match '^[0-9A-Fa-f]+(?:\s+[0-9A-Fa-f]+){0,3}\s+([A-Za-z_?@$][^\s]*)$') {
                $result.Add([pscustomobject]@{
                  Kind=$mode
                  Module=$currentModule
                  Symbol=(Normalize-Api $matches[1])
                })
              }
            }
            return $result
          }

          function Get-ForwarderEdges([string[]]$lines) {
            $result = [System.Collections.Generic.List[object]]::new()
            foreach ($line in $lines) {
              if ($line -match '=\s*([A-Za-z0-9_.-]+)\.([A-Za-z0-9_@?$#-]+)\s*$') {
                $result.Add([pscustomobject]@{
                  Kind='forwarder'
                  Module=(Normalize-ModuleName $matches[1])
                  Symbol=(Normalize-Api $matches[2])
                })
              }
            }
            return $result
          }

          $yyProviders = @{}
          foreach ($row in @(Import-Csv -LiteralPath $env:YY_PROVIDER_INDEX)) {
            $key = ($row.Module.ToLowerInvariant() + '!' + $row.API.ToLowerInvariant())
            if (-not $yyProviders.ContainsKey($key)) { $yyProviders[$key] = $row.Provider }
          }

          function Get-YyProvider([string]$module, [string]$api) {
            if (-not $api) { return $null }
            $key = ($module.ToLowerInvariant() + '!' + $api.ToLowerInvariant())
            if ($yyProviders.ContainsKey($key)) { return $yyProviders[$key] }
            return $null
          }

          $xpSystemNames = @(
            'advapi32.dll','comctl32.dll','comdlg32.dll','crypt32.dll','d3d9.dll','dnsapi.dll',
            'gdi32.dll','gdiplus.dll','imagehlp.dll','imm32.dll','iphlpapi.dll','kernel32.dll',
            'mpr.dll','msctf.dll','msimg32.dll','msvcrt.dll','netapi32.dll','ntdll.dll','ole32.dll',
            'oleaut32.dll','powrprof.dll','psapi.dll','rpcrt4.dll','secur32.dll','sensapi.dll','setupapi.dll',
            'shell32.dll','shlwapi.dll','user32.dll','userenv.dll','usp10.dll','uxtheme.dll','version.dll',
            'wininet.dll','winmm.dll','wintrust.dll','wldap32.dll','ws2_32.dll','winspool.drv'
          )
          $xpSystem = @{}
          foreach ($name in $xpSystemNames) { $xpSystem[$name.ToLowerInvariant()] = $true }
          $xpSystemNames | Sort-Object | Set-Content -Encoding utf8 diagnostics\known-xp-system-modules.txt

          $local = @{}
          foreach ($file in @(Get-ChildItem -LiteralPath $env:DWRITE_ROOT -File -Filter '*.dll')) {
            $local[$file.Name.ToLowerInvariant()] = $file
          }

          function Get-Classification([string]$module) {
            $key = $module.ToLowerInvariant()
            if ($local.ContainsKey($key)) {
              if ($module -ieq 'DWrite.dll') { return 'directwrite' }
              if ($module -match '(?i)^api-ms-win-crt-') { return 'crt-api-set' }
              if ($module -ieq 'ucrtbase.dll') { return 'crt-ucrtbase' }
              if ($module -ieq 'd3dcompiler_47.dll') { return 'app-local-d3dcompiler' }
              if ($module -match '(?i)^(p_|pwrp_|pwp_)') { return 'supermium-compat' }
              return 'app-local-other'
            }
            if ($xpSystem.ContainsKey($key)) { return 'xp-system' }
            return 'external-unresolved'
          }

          $queue = [System.Collections.Generic.Queue[System.IO.FileInfo]]::new()
          $queue.Enqueue((Get-Item $env:DWRITE_PATH))
          $visited = @{}
          $fileRows = [System.Collections.Generic.List[object]]::new()
          $edgeRows = [System.Collections.Generic.List[object]]::new()

          while ($queue.Count -gt 0) {
            $file = $queue.Dequeue()
            $key = $file.FullName.ToLowerInvariant()
            if ($visited.ContainsKey($key)) { continue }
            $visited[$key] = $true

            $safe = $file.Name -replace '[^A-Za-z0-9_.-]', '_'
            $headers = @(Invoke-Dumpbin 'headers' $file.FullName (Join-Path $rawRoot "$safe.headers.txt"))
            $imports = @(Invoke-Dumpbin 'imports' $file.FullName (Join-Path $rawRoot "$safe.imports.txt"))
            $exports = @(Invoke-Dumpbin 'exports' $file.FullName (Join-Path $rawRoot "$safe.exports.txt"))

            $machineLine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machineLine -or $machineLine -notmatch '(?i)^\s*14C machine \(x86\)') {
              throw "Closure member is not x86 machine 14C: $($file.FullName)"
            }
            $versionLine = $headers | Where-Object { $_ -match '(?i)subsystem version' } | Select-Object -First 1
            if (-not $versionLine -or $versionLine -notmatch '^\s*([0-9]+)\.([0-9]+)\s+subsystem version') {
              throw "Cannot parse subsystem version: $($file.FullName)"
            }
            $subsystem = [version]("$([int]$matches[1]).$([int]$matches[2])")
            $needsRetarget = $subsystem -gt [version]'5.1'
            $sha1 = (Get-FileHash -Algorithm SHA1 $file.FullName).Hash.ToLowerInvariant()
            $sha256 = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            $fileRows.Add([pscustomobject]@{
              File=$file.Name
              Classification=(Get-Classification $file.Name)
              Size=$file.Length
              SHA1=$sha1
              SHA256=$sha256
              Machine='14C-x86'
              Subsystem=$subsystem.ToString(2)
              NeedsRetarget=$needsRetarget
              FileVersion=$file.VersionInfo.FileVersion
            })

            if ($file.Name -ieq 'DWrite.dll' -and (($exports -join "`n") -notmatch '(?m)\bDWriteCreateFactory\b')) {
              throw 'Exact DWrite.dll does not export DWriteCreateFactory.'
            }

            $fileEdges = [System.Collections.Generic.List[object]]::new()
            foreach ($edge in @(Get-ImportEdges $imports)) { $fileEdges.Add($edge) }
            foreach ($edge in @(Get-ForwarderEdges $exports)) { $fileEdges.Add($edge) }

            foreach ($edge in $fileEdges) {
              $module = Normalize-ModuleName $edge.Module
              $classification = Get-Classification $module
              $yyProvider = Get-YyProvider $module $edge.Symbol
              $yyCoverage = if ($yyProvider) { 'fallback-present' } else { 'fallback-absent' }
              $yyApplicability = if ($yyProvider) {
                'prebuilt-pe-relink-or-provider-shim-required'
              } else {
                'none'
              }
              $edgeRows.Add([pscustomobject]@{
                From=$file.Name
                Kind=$edge.Kind
                To=$module
                API=$edge.Symbol
                Classification=$classification
                YYCoverage=$yyCoverage
                YYApplicability=$yyApplicability
                YYProvider=$yyProvider
              })
              $localKey = $module.ToLowerInvariant()
              if ($local.ContainsKey($localKey)) {
                $target = $local[$localKey]
                if (-not $visited.ContainsKey($target.FullName.ToLowerInvariant())) { $queue.Enqueue($target) }
              }
            }
          }

          $filesSorted = @($fileRows | Sort-Object File)
          $edgesSorted = @($edgeRows | Sort-Object From,Kind,To,API -Unique)
          $filesSorted | Export-Csv -NoTypeInformation -Encoding utf8 diagnostics\closure-files.csv
          $edgesSorted | Export-Csv -NoTypeInformation -Encoding utf8 diagnostics\closure-edges.csv

          $unresolved = @($edgesSorted | Where-Object Classification -eq 'external-unresolved')
          $retarget = @($filesSorted | Where-Object NeedsRetarget -eq $true)
          $localCompat = @($filesSorted | Where-Object Classification -in @('supermium-compat','crt-api-set','crt-ucrtbase','app-local-d3dcompiler','app-local-other'))
          $yyCovered = @($edgesSorted | Where-Object YYCoverage -eq 'fallback-present')
          if ($yyCovered.Count -gt 0) {
            $yyCovered | Export-Csv -NoTypeInformation -Encoding utf8 diagnostics\yy-covered-closure-edges.csv
          }

          @(
            "dwrite_root=$env:DWRITE_ROOT",
            "closure_file_count=$($filesSorted.Count)",
            "companion_file_count=$($localCompat.Count)",
            "unresolved_external_count=$($unresolved.Count)",
            "retarget_required_count=$($retarget.Count)",
            "yy_fallback_edge_count=$($yyCovered.Count)",
            'yy_coverage_basis=explicit YY_Thunks_<API> fallback symbol in pinned v1.2.2 target library',
            'yy_direct_runtime_interposition=NO',
            'yy_note=providers linked into r3dfox/xul do not rewrite imports of prebuilt Supermium DLLs',
            'yy_candidate_use=relink source if available, or build a narrow provider shim for exact required exports',
            'yy_dwrite_fallback=not_a_replacement_for_real_DWrite_on_XP',
            "provider_graph_status=$(if ($unresolved.Count -eq 0) { 'RESOLVED' } else { 'UNRESOLVED' })",
            'runtime_status=NOT_TESTED',
            'xp_api_compatibility=REQUIRES_IMPORT_REVIEW'
          ) | Set-Content -Encoding utf8 diagnostics\closure-summary.txt

          '=== closure files ===' | Write-Host
          $filesSorted | Format-Table File,Classification,Size,Subsystem,NeedsRetarget,SHA256 -AutoSize | Out-String | Write-Host
          '=== closure API edges with YY coverage ===' | Write-Host
          $edgesSorted | Format-Table From,Kind,To,API,Classification,YYCoverage -AutoSize | Out-String | Write-Host
          '=== summary ===' | Write-Host
          Get-Content diagnostics\closure-summary.txt | ForEach-Object { Write-Host $_ }

          if ($unresolved.Count -gt 0) {
            $unresolved | Export-Csv -NoTypeInformation -Encoding utf8 diagnostics\unresolved-external.csv
          }

      - name: Upload DWrite closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-supermium-dwrite-closure-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 30

      - name: GATE - Require provider graph resolved
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = Get-Content diagnostics\closure-summary.txt
          $status = $summary | Where-Object { $_ -like 'provider_graph_status=*' } | Select-Object -First 1
          if ($status -ne 'provider_graph_status=RESOLVED') {
            throw 'DWrite provider graph is not fully resolved; inspect unresolved-external.csv and raw imports/exports.'
          }
