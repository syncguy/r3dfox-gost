name: YY-Thunks narrow ProcessPrng closing smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  YY_THUNKS_VERSION: "1.2.2"
  VC_LTL_VERSION: "5.2.2"
  THUNK_RS_VERSION: "0.3.5"
  RUST_TOOLCHAIN: "nightly-2026-08-20"
  RUST_TARGET: "x86_64-pc-windows-msvc"

jobs:
  processprng-closing-smoke:
    name: Narrow YY ProcessPrng provider + synchronization.lib
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Provision VC-LTL 5.2.2 via thunk-rs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $proj = Join-Path $env:RUNNER_TEMP 'processprng-vcltl-provision'
          if (Test-Path $proj) { Remove-Item -Recurse -Force $proj }
          New-Item -ItemType Directory -Force (Join-Path $proj 'src') | Out-Null

          @"
          [package]
          name = "processprng-vcltl-provision"
          version = "0.1.0"
          edition = "2021"
          build = "build.rs"

          [build-dependencies]
          thunk-rs = { version = "=$env:THUNK_RS_VERSION", default-features = false, features = ["win7", "lib"] }

          [workspace]
          "@ | Set-Content -Encoding utf8 (Join-Path $proj 'Cargo.toml')

          'fn main() { thunk::thunk(); }' | Set-Content -Encoding utf8 (Join-Path $proj 'build.rs')
          'fn main() {}' | Set-Content -Encoding utf8 (Join-Path $proj 'src\main.rs')

          & cargo build --manifest-path (Join-Path $proj 'Cargo.toml') --target $env:RUST_TARGET --jobs 4 -vv
          if ($LASTEXITCODE -ne 0) { throw "thunk-rs provisioning failed: $LASTEXITCODE" }

          $vc = Get-ChildItem -Path (Join-Path $proj 'target') -Recurse -Directory -Filter "VC-LTL-$env:VC_LTL_VERSION" |
            Select-Object -First 1
          if (-not $vc) { throw "VC-LTL-$env:VC_LTL_VERSION was not provisioned" }

          $vcLib = Join-Path $vc.FullName 'TargetPlatform\6.0.6000.0\lib\x64'
          if (-not (Test-Path $vcLib)) { throw "VC-LTL lib directory missing: $vcLib" }
          "THUNK_VC_LTL_LIB=$vcLib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download YY-Thunks 1.2.2 Win7 x64 LIB package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Invoke-RestMethod `
            -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } `
            -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets |
            Where-Object { $_.name -match '(?i)Lib.*\.zip$|(?i)-Lib\.zip$' } |
            Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Lib asset not found" }

          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-processprng-package'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root

          $yyLib = Get-ChildItem -Path $root -Recurse -Directory |
            Where-Object { $_.FullName -match '(?i)[\\/]Lib[\\/]6\.1\.7600\.0[\\/]x64$' } |
            Select-Object -First 1
          if (-not $yyLib) { throw 'YY-Thunks Lib/6.1.7600.0/x64 not found' }

          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          if (-not (Test-Path $kernel32)) { throw "YY kernel32.lib missing: $kernel32" }
          if (-not (Test-Path $synch)) { throw "YY synchronization.lib missing: $synch" }

          "THUNK_YY_LIB=$($yyLib.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_SYNCH_LIB=$synch" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate lld-link
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $lld = if ($cmd) { $cmd.Source } else { 'C:\Program Files\LLVM\bin\lld-link.exe' }
          if (-not (Test-Path $lld)) { throw "lld-link.exe not found: $lld" }
          "REAL_LLD_LINK=$lld" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          & $lld --version

      - name: Build one narrow YY ProcessPrng provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $work = Join-Path $env:RUNNER_TEMP 'processprng-closing-smoke'
          $scan = Join-Path $work 'selected'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $scan | Out-Null

          $kernel32 = $env:THUNK_YY_KERNEL32_LIB
          $members = @(& lib.exe /nologo /list $kernel32 2>&1 |
            ForEach-Object { "$_".Trim() } |
            Where-Object { $_ } |
            Select-Object -Unique)
          if ($LASTEXITCODE -ne 0 -or $members.Count -eq 0) {
            throw "Cannot enumerate YY kernel32.lib: $kernel32"
          }
          $members | Set-Content -Encoding utf8 (Join-Path $work 'yy-kernel32-members.txt')

          $directMembers = @($members | Where-Object { $_ -match '(?i)[\\/]ProcessPrng\.obj$' })
          $importMembers = @($members | Where-Object { $_ -match '(?i)[\\/]ProcessPrng\.obi$' })
          $implMembers = @($members | Where-Object { $_ -match '(?i)[\\/]YY_Thunks_for_6\.1\.7600\.0\.obj$' })

          if ($directMembers.Count -ne 1) { throw "Expected one ProcessPrng.obj weak-alias member; found $($directMembers.Count)" }
          if ($importMembers.Count -ne 1) { throw "Expected one ProcessPrng.obi weak-alias member; found $($importMembers.Count)" }
          if ($implMembers.Count -ne 1) { throw "Expected one YY implementation member; found $($implMembers.Count)" }

          function Extract-Member([string]$member, [string]$name) {
            $dir = Join-Path $scan $name
            New-Item -ItemType Directory -Force $dir | Out-Null
            Push-Location $dir
            try {
              & lib.exe /nologo "/extract:$member" $kernel32 *> (Join-Path $dir 'extract.log')
              if ($LASTEXITCODE -ne 0) { throw "Failed to extract $member" }
            }
            finally { Pop-Location }

            $file = Get-ChildItem -Path $dir -File |
              Where-Object { $_.Name -ne 'extract.log' } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if (-not $file) { throw "No extracted file for $member" }

            $dst = Join-Path $dir 'member.obj'
            Copy-Item -Force $file.FullName $dst
            (& dumpbin /nologo /symbols $dst 2>&1 | Out-String) |
              Set-Content -Encoding utf8 (Join-Path $dir 'symbols.txt')
            (& dumpbin /nologo /directives $dst 2>&1 | Out-String) |
              Set-Content -Encoding utf8 (Join-Path $dir 'directives.txt')
            $member | Set-Content -Encoding utf8 (Join-Path $dir 'member-name.txt')
            return $dst
          }

          function Get-SymbolRecords([string]$text) {
            $records = @()
            foreach ($line in ($text -split "`r?`n")) {
              if ($line -notmatch '^\s*([0-9A-F]+)\s+\S+\s+(\S+)\s+.*?\b(WeakExternal|External)\b\s+\|\s+(\S+)\s*$') { continue }
              $records += [pscustomobject]@{
                Index = [Convert]::ToInt32($Matches[1], 16)
                Section = $Matches[2]
                Storage = $Matches[3]
                Name = $Matches[4]
                Undefined = ($Matches[2] -eq 'UNDEF')
              }
            }
            return @($records)
          }

          function Test-WeakAlias([string]$text, [string]$alias, [string]$target) {
            $records = @(Get-SymbolRecords $text)
            $byIndex = @{}
            foreach ($record in $records) { $byIndex[$record.Index] = $record }
            $lines = @($text -split "`r?`n")

            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch '^\s*([0-9A-F]+)\s+\S+\s+UNDEF\s+.*?\bWeakExternal\b\s+\|\s+(\S+)\s*$') { continue }
              if ($Matches[2] -ne $alias -or $i + 1 -ge $lines.Count) { continue }
              if ($lines[$i + 1] -notmatch '^\s*Default index\s+([0-9A-F]+)\s+Alias record\s*$') { continue }

              $targetIndex = [Convert]::ToInt32($Matches[1], 16)
              if ($byIndex.ContainsKey($targetIndex) -and $byIndex[$targetIndex].Name -eq $target) {
                return $true
              }
            }
            return $false
          }

          function Test-DefinedExternal([string]$text, [string]$name) {
            $records = @(Get-SymbolRecords $text)
            return @($records | Where-Object {
              -not $_.Undefined -and $_.Storage -eq 'External' -and $_.Name -eq $name
            }).Count -gt 0
          }

          $direct = Extract-Member $directMembers[0] 'direct-alias'
          $import = Extract-Member $importMembers[0] 'import-alias'
          $impl = Extract-Member $implMembers[0] 'implementation'

          $directSymbols = Get-Content (Join-Path $scan 'direct-alias\symbols.txt') -Raw
          $importSymbols = Get-Content (Join-Path $scan 'import-alias\symbols.txt') -Raw
          $implSymbols = Get-Content (Join-Path $scan 'implementation\symbols.txt') -Raw

          if (-not (Test-WeakAlias $directSymbols 'ProcessPrng' 'YY_Thunks_ProcessPrng')) {
            throw 'ProcessPrng.obj is not a COFF weak alias to YY_Thunks_ProcessPrng'
          }
          if (-not (Test-WeakAlias $importSymbols '__imp_ProcessPrng' '__imp_YY_Thunks_ProcessPrng')) {
            throw 'ProcessPrng.obi is not a COFF weak alias to __imp_YY_Thunks_ProcessPrng'
          }
          if (-not (Test-DefinedExternal $implSymbols 'YY_Thunks_ProcessPrng')) {
            throw 'YY implementation member does not define YY_Thunks_ProcessPrng'
          }
          if (-not (Test-DefinedExternal $implSymbols '__imp_YY_Thunks_ProcessPrng')) {
            throw 'YY implementation member does not define __imp_YY_Thunks_ProcessPrng'
          }

          @(
            [pscustomobject]@{ Alias = 'ProcessPrng'; Target = 'YY_Thunks_ProcessPrng'; Member = $directMembers[0] },
            [pscustomobject]@{ Alias = '__imp_ProcessPrng'; Target = '__imp_YY_Thunks_ProcessPrng'; Member = $importMembers[0] },
            [pscustomobject]@{ Alias = '<implementation>'; Target = 'YY_Thunks_ProcessPrng + __imp_YY_Thunks_ProcessPrng'; Member = $implMembers[0] }
          ) | Export-Csv -NoTypeInformation -Encoding utf8 (Join-Path $work 'processprng-member-map.csv')

          $forbiddenSurface = @('LockResource', '__imp_LockResource', 'LoadLibraryExW', '__imp_LoadLibraryExW')
          foreach ($obj in @($direct, $import, $impl)) {
            $text = (& dumpbin /nologo /symbols $obj 2>&1 | Out-String)
            foreach ($name in $forbiddenSurface) {
              if (Test-DefinedExternal $text $name) {
                throw "Selected YY member defines forbidden broad ordinary symbol '$name': $obj"
              }
            }
          }

          $narrow = Join-Path $work 'yy-processprng.lib'
          & lib.exe /nologo "/out:$narrow" $direct $import $impl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $narrow)) {
            throw 'Failed to build yy-processprng.lib'
          }

          $narrowSymbols = (& dumpbin /nologo /linkermember:1 $narrow 2>&1 | Out-String)
          $narrowSymbols | Set-Content -Encoding utf8 (Join-Path $work 'yy-processprng-symbols.txt')

          function Archive-Exposes([string]$name) {
            foreach ($line in ($narrowSymbols -split "`r?`n")) {
              if ($line -match ('(?:^|\s)' + [regex]::Escape($name) + '\s*$')) { return $true }
            }
            return $false
          }

          if (-not (Archive-Exposes 'YY_Thunks_ProcessPrng')) {
            throw 'yy-processprng.lib does not contain YY_Thunks_ProcessPrng'
          }
          foreach ($name in $forbiddenSurface) {
            if (Archive-Exposes $name) { throw "yy-processprng.lib exposes forbidden broad symbol '$name'" }
          }

          "SMOKE_DIR=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NARROW_PROCESSPRNG_LIB=$narrow" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Direct weak alias: $($directMembers[0])"
          Write-Host "Import weak alias: $($importMembers[0])"
          Write-Host "Implementation: $($implMembers[0])"
          Write-Host "Narrow provider: $narrow"

      - name: Build representative Rust archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $src = Join-Path $env:SMOKE_DIR 'probe.rs'
          $rlib = Join-Path $env:SMOKE_DIR 'yy_processprng_probe.rlib'

          @'
          use std::collections::hash_map::RandomState;
          use std::ffi::c_void;
          use std::hint::black_box;
          use std::sync::{Arc, Condvar, Mutex, Once, RwLock};
          use std::thread;
          use std::time::Duration;

          #[link(name = "kernel32", kind = "raw-dylib")]
          unsafe extern "system" {
              fn LockResource(hmem: *mut c_void) -> *mut c_void;
          }

          #[inline(never)]
          pub fn run_probe() {
              black_box(LockResource as unsafe extern "system" fn(*mut c_void) -> *mut c_void);
              black_box(RandomState::new());

              static INIT: Once = Once::new();
              INIT.call_once(|| black_box(()));

              let rw = RwLock::new(1usize);
              *rw.write().unwrap() += 1;
              black_box(*rw.read().unwrap());

              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let waiter_pair = Arc::clone(&pair);
              let waiter = thread::spawn(move || {
                  let (lock, cv) = &*waiter_pair;
                  let guard = lock.lock().unwrap();
                  let (_guard, _timeout) = cv
                      .wait_timeout_while(guard, Duration::from_millis(1), |ready| !*ready)
                      .unwrap();
              });

              {
                  let (lock, cv) = &*pair;
                  let mut ready = lock.lock().unwrap();
                  *ready = true;
                  cv.notify_all();
              }
              waiter.join().unwrap();
          }
          '@ | Set-Content -Encoding utf8 $src

          & rustc $src `
            --crate-name yy_processprng_probe `
            --crate-type rlib `
            --edition 2021 `
            --target $env:RUST_TARGET `
            -O `
            -o $rlib
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $rlib)) {
            throw "Rust archive build failed: $LASTEXITCODE"
          }

          $probeSymbols = (& dumpbin /nologo /linkermember:1 $rlib 2>&1 | Out-String)
          $probeSymbols | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'rust-probe-archive-symbols.txt')
          if ($probeSymbols -notmatch '(?i)(?:__imp_)?LockResource') {
            throw 'Probe rlib does not contain the LockResource raw-dylib control'
          }

          $targetLibDir = (& rustc --print target-libdir --target $env:RUST_TARGET 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $targetLibDir)) {
            throw "Cannot locate Rust target libdir: $targetLibDir"
          }
          $std = Get-ChildItem -Path $targetLibDir -File -Filter 'libstd-*.rlib' | Select-Object -First 1
          if (-not $std) { throw "libstd rlib not found in $targetLibDir" }

          $stdSymbols = (& dumpbin /nologo /linkermember:1 $std.FullName 2>&1 | Out-String)
          $stdSymbols | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'rust-libstd-symbols.txt')
          if ($stdSymbols -notmatch '(?i)(?:__imp_)?ProcessPrng') {
            throw 'Pinned Rust libstd does not contain ProcessPrng'
          }
          if ($stdSymbols -notmatch '(?i)WaitOnAddress|WakeByAddressAll|WakeByAddressSingle') {
            throw 'Pinned Rust libstd does not contain WaitOnAddress/WakeByAddress*'
          }

          "RUST_PROBE_RLIB=$rlib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Link exactly one candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $main = Join-Path $env:SMOKE_DIR 'main.rs'
          $exe = Join-Path $env:SMOKE_DIR 'processprng-closing-smoke.exe'
          $wrapper = Join-Path $env:SMOKE_DIR 'lld-narrow-processprng.cmd'
          $linkLog = Join-Path $env:SMOKE_DIR 'final-link-command.txt'
          $linkOutput = Join-Path $env:SMOKE_DIR 'final-link-output.txt'
          $map = Join-Path $env:SMOKE_DIR 'final-link.map'

          @'
          extern crate yy_processprng_probe;

          fn main() {
              yy_processprng_probe::run_probe();
          }
          '@ | Set-Content -Encoding utf8 $main

          @"
          @echo off
          >"$linkLog" echo "$env:REAL_LLD_LINK" "-LIBPATH:$env:THUNK_VC_LTL_LIB" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_PROCESSPRNG_LIB" %*
          "$env:REAL_LLD_LINK" "-LIBPATH:$env:THUNK_VC_LTL_LIB" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_PROCESSPRNG_LIB" %*
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Encoding ascii $wrapper

          & rustc $main `
            --edition 2021 `
            --target $env:RUST_TARGET `
            -O `
            --extern "yy_processprng_probe=$env:RUST_PROBE_RLIB" `
            "-Clinker=$wrapper" `
            "-Clink-arg=/map:$map" `
            -o $exe 2>&1 | Tee-Object -FilePath $linkOutput
          $linkRc = $LASTEXITCODE
          if ($linkRc -ne 0) { throw "Single narrow-provider link failed: $linkRc" }
          if (-not (Test-Path $exe)) { throw "Linked executable missing: $exe" }
          if (-not (Test-Path $map)) { throw "Link map missing: $map" }

          $mapText = Get-Content $map -Raw
          if ($mapText.IndexOf('YY_Thunks_ProcessPrng', [System.StringComparison]::Ordinal) -lt 0) {
            throw 'Final link did not select YY_Thunks_ProcessPrng from the narrow provider'
          }

          $logged = Get-Content $linkLog -Raw
          if ($logged.IndexOf($env:THUNK_YY_KERNEL32_LIB, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw 'Invariant violation: full YY kernel32.lib reached the final link command'
          }
          if ($logged.IndexOf("-LIBPATH:$env:THUNK_YY_LIB", [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw 'Invariant violation: YY full Lib directory reached final LIBPATH'
          }

          "SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Audit final PE imports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $imports = (& dumpbin /nologo /imports $env:SMOKE_EXE 2>&1 | Out-String)
          $imports | Set-Content -Encoding utf8 (Join-Path $env:SMOKE_DIR 'final-imports.txt')

          $forbidden = @(
            'ProcessPrng',
            'bcryptprimitives.dll',
            'api-ms-win-core-synch-l1-2-0.dll',
            'WaitOnAddress',
            'WakeByAddressAll',
            'WakeByAddressSingle'
          )
          $hits = @($forbidden | Where-Object {
            $imports.IndexOf($_, [System.StringComparison]::OrdinalIgnoreCase) -ge 0
          })
          if ($hits.Count -gt 0) { throw "Win7-incompatible imports survived: $($hits -join ', ')" }

          if ($imports.IndexOf('LockResource', [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw 'LockResource control import is absent from the final PE'
          }
          if ($imports.IndexOf('KERNEL32.dll', [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw 'KERNEL32.dll is absent from final imports'
          }

          "## YY-Thunks narrow ProcessPrng closing smoke: PASS" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Exactly the two YY ProcessPrng COFF weak aliases plus the real YY implementation member were selected." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Full YY kernel32.lib was not supplied to the final linker." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- LockResource remains a normal KERNEL32 import." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- ProcessPrng and Win8+ synchronization imports are absent from final PE imports." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- This smoke says nothing about GOST TLS runtime behavior." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yy-thunks-processprng-closing-smoke-diagnostics
          path: ${{ runner.temp }}/processprng-closing-smoke
          if-no-files-found: warn
