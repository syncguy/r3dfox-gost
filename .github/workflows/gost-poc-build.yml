name: GOST TLS PoC build

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/gost-poc-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win64:
    name: Windows x64 / r3dfox GOST release
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      NIGHTLY_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET_WIN7: "x86_64-win7-windows-msvc"

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize upstream JSContext include order
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'js\src\vm\JSContext.cpp'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)

          $dump = '#include "js/friend/DumpFunctions.h"  // for stack trace utilities'
          $errors = '#include "js/friend/ErrorMessages.h"  // js::GetErrorMessage, JSMSG_*'
          $printer = '#include "js/Printer.h"               // for FixedBufferPrinter'
          $printf = '#include "js/Printf.h"'

          foreach ($line in @($dump, $printer)) {
            while ($lines.Remove($line)) { }
          }

          $errorsIndex = $lines.IndexOf($errors)
          $printfIndex = $lines.IndexOf($printf)
          if ($errorsIndex -lt 0 -or $printfIndex -lt 0) {
            throw 'Expected JSContext include anchors were not found; review workaround before continuing.'
          }

          $lines.Insert($errorsIndex, $dump)
          $printfIndex = $lines.IndexOf($printf)
          $lines.Insert($printfIndex, $printer)

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($path, $lines, $utf8NoBom)

          Write-Host 'Normalized JSContext include order:'
          git diff -- $path

      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'SpiderMonkey style gate PASSED.'

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }

          Write-Host "Existing active pagefile total: $activeMB MB"
          Write-Host 'Active pagefiles:'
          $active |
            Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage |
            Format-Table -AutoSize

          if ($activeMB -ge 20480) {
            'need=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Existing active pagefile is already large enough.'
            exit 0
          }

          $activeRoots = @(
            $active | ForEach-Object {
              if ($_.Name -match '^([A-Za-z]:)\\') {
                $matches[1].ToUpperInvariant()
              }
            }
          )
          Write-Host "Drives already hosting active pagefiles: $($activeRoots -join ', ')"

          $candidate = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object {
              ($activeRoots -notcontains $_.DeviceID.ToUpperInvariant()) -and
              $_.FreeSpace -ge 30GB
            } |
            Sort-Object FreeSpace -Descending |
            Select-Object -First 1

          if (-not $candidate) {
            throw 'No non-active fixed drive with at least 30 GB free was found for the additional pagefile.'
          }

          Write-Host "Selected additional pagefile drive: $($candidate.DeviceID)"
          Write-Host "Selected drive free space: $([math]::Round($candidate.FreeSpace / 1GB, 2)) GB"
          'need=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "disk=$($candidate.DeviceID)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile after provisioning
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }

          Write-Host 'Active pagefiles after provisioning:'
          $active |
            Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage |
            Format-Table -AutoSize
          Write-Host "Active pagefile total: $activeMB MB"

          if ($activeMB -lt 20480) {
            throw "Build blocked: active pagefile is only $activeMB MB; at least 20480 MB is required."
          }
          Write-Host 'Active pagefile gate PASSED.'

      - name: Repair stale mime_guess vendored checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mime = 'third_party\rust\mime_guess\src\mime_types.rs'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          $stale = '57ee8db84eb0fc4f06a3eac0da8c730a334cb99a7e81e60413f5febd886d91f4'
          $expected = '1579ebd4fae3e0e8b1fe2d7677165868e6ba856c5e587538d9cb7b478a91078b'
          $actual = (Get-FileHash -Algorithm SHA256 $mime).Hash.ToLowerInvariant()
          Write-Host "mime_guess/mime_types.rs SHA256=$actual"
          if ($actual -ne $expected) {
            throw "Unexpected mime_guess source hash: expected $expected, got $actual"
          }
          $text = [System.IO.File]::ReadAllText($checksum)
          if (-not $text.Contains($stale)) {
            throw 'Expected stale mime_guess checksum was not found'
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($checksum, $text.Replace($stale, $expected), $utf8NoBom)

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) {
            throw 'MozillaBuild installation did not produce C:\mozilla-build\start-shell.bat'
          }
          Get-Content 'C:\mozilla-build\VERSION'

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD

          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"

          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) {
            throw 'Expected MSSPI Windows.h include was not found'
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            $msspiCpp,
            $source.Replace('#include <Windows.h>', '#include <windows.h>'),
            $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]

          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += [
                  "msspi/src/msspi.cpp",
              ]
              LOCAL_INCLUDES += [
                  "msspi/src",
                  "msspi/third_party/cprocsp/include",
              ]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Write release mozconfig
        shell: powershell
        run: |
          @'
          # CI/resource controls kept from the proven GOST build.
          mk_add_options AUTOCLOBBER=1
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-gost-win64
          mk_add_options MOZ_PARALLEL_BUILD=2
          mk_add_options MOZ_MAKE_FLAGS="-j2"
          ac_add_options --enable-bootstrap

          # Match the functional/release feature set of upstream
          # mozconfigs/r3dfox-win64, but deliberately omit PGO, LTO,
          # custom -O3/compiler flags and codegen-units=1 for now.
          ac_add_options --target=x86_64
          ac_add_options --disable-cargo-incremental
          ac_add_options --enable-application=browser
          ac_add_options --disable-artifact-builds
          ac_add_options --enable-official-branding

          # Release semantics without the expensive upstream optimization profile.
          ac_add_options --disable-debug
          ac_add_options --disable-debug-js-modules
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-tests
          ac_add_options --enable-hardening
          ac_add_options --enable-stl-hardening
          ac_add_options --enable-jemalloc
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --enable-rust-simd
          ac_add_options --enable-replace-malloc

          # Upstream r3dfox media feature set.
          ac_add_options --disable-eme
          ac_add_options --enable-jxl
          ac_add_options --enable-raw
          ac_add_options --disable-webrtc

          # Upstream r3dfox add-on policy.
          ac_add_options --allow-addon-sideload
          ac_add_options --with-unsigned-addon-scopes=app,system

          # Upstream r3dfox client feature set. In particular,
          # --disable-crashreporter removes the Win8+ crash-helper path that
          # introduced GetOverlappedResultEx in the previous GOST xul.dll.
          ac_add_options --disable-backgroundtasks
          ac_add_options --disable-bits-download
          ac_add_options --disable-crashreporter
          ac_add_options --disable-default-browser-agent
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-necko-wifi
          ac_add_options --disable-notification-server
          ac_add_options --disable-parental-controls
          ac_add_options --without-onnx-runtime
          ac_add_options --without-wasm-sandboxed-libraries

          ac_add_options --disable-update-agent
          ac_add_options --disable-updater

          mk_add_options MOZ_CRASHREPORTER=0
          mk_add_options MOZ_DATA_REPORTING=0
          mk_add_options MOZ_SERVICES_HEALTHREPORT=0
          mk_add_options MOZ_TELEMETRY_REPORTING=
          export MOZ_CRASHREPORTER=0
          export MOZ_DATA_REPORTING=0
          export MOZ_REQUIRE_SIGNING=
          export MOZ_TELEMETRY_REPORTING=
          export MOZ_PACKAGE_JSSHELL=1

          # Intentionally NOT copied yet from upstream r3dfox-win64:
          #   --enable-lto / MOZ_LTO=1
          #   --enable-install-strip / --enable-strip
          #   custom CFLAGS/CPPFLAGS/CXXFLAGS/LDFLAGS/POLLY
          #   OPT_LEVEL=3 / RUSTC_OPT_LEVEL=3 / custom RUSTFLAGS
          #   PGO profile-generate/profile-use
          #   WIN32_REDIST_DIR / WIN_UCRT_REDIST_DIR /
          #   MOZ_D3DCOMPILER_VISTA_DLL_PATH_OVERRIDE
          # The last three require a deliberately prepared C:/VC++/x64 tree;
          # do not point at an empty/nonexistent directory.
          '@ | Set-Content '.mozconfig-gost'
          Get-Content '.mozconfig-gost'

      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src

      - name: Pin nightly Rust binaries for Mozilla
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $rustc = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN rustc).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $rustc)) {
            throw "Pinned rustc was not found for $env:NIGHTLY_TOOLCHAIN"
          }
          $cargo = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN cargo).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $cargo)) {
            throw "Pinned cargo was not found for $env:NIGHTLY_TOOLCHAIN"
          }
          $rustdoc = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN rustdoc).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $rustdoc)) {
            throw "Pinned rustdoc was not found for $env:NIGHTLY_TOOLCHAIN"
          }

          "RUSTC=$rustc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO=$cargo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTDOC=$rustdoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $cargoHome = Join-Path $env:RUNNER_TEMP 'cargo-home-win7'
          New-Item -ItemType Directory -Force $cargoHome | Out-Null
          @'
          [unstable]
          build-std = ["std", "panic_abort"]
          '@ | Set-Content -Encoding utf8 (Join-Path $cargoHome 'config.toml')
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "rustc=$rustc"
          & $rustc --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "cargo=$cargo"
          & $cargo --version --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cfg = & $rustc --print cfg --target $env:RUST_TARGET_WIN7 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cfg | Tee-Object -FilePath rust-win7-target-cfg.txt
          if (($cfg -join "`n") -notmatch 'target_vendor="win7"') {
            throw 'Expected target_vendor="win7" was not reported.'
          }

      - name: Patch Mozilla Rust target selection for build-std
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'build\moz.configure\rust.configure'
          $text = [System.IO.File]::ReadAllText($path)
          $old = @'
          def rust_target_triple(
              rustc, target, compiler_info, rust_supported_targets, arm_target
          ):
              rustc_target = detect_rustc_target(
                  target, compiler_info, arm_target, rust_supported_targets
              )
              assert_rust_compile(target, rustc_target, rustc)
              return rustc_target
          '@
          $new = @'
          def rust_target_triple(
              rustc, target, compiler_info, rust_supported_targets, arm_target
          ):
              # r3dfox-gost CI: Cargo -Z build-std supplies the target std library.
              # Mozilla's assert_rust_compile invokes rustc directly, so it cannot
              # validate a target std that Cargo will build later. Force the tested
              # Win7 target here and validate build-std separately in the workflow.
              if target.kernel == "WINNT" and target.cpu == "x86_64":
                  return "x86_64-win7-windows-msvc"

              rustc_target = detect_rustc_target(
                  target, compiler_info, arm_target, rust_supported_targets
              )
              assert_rust_compile(target, rustc_target, rustc)
              return rustc_target
          '@
          if (-not $text.Contains($old)) {
            throw 'Expected rust_target_triple block was not found; review Win7 target patch.'
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($path, $text.Replace($old, $new), $utf8NoBom)
          git diff -- $path

      - name: GATE - Compile Win7 Rust build-std preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'rust-win7-full-build-preflight'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force (Join-Path $dir 'src') | Out-Null
          @'
          [package]
          name = "win7-preflight"
          version = "0.1.0"
          edition = "2021"

          [workspace]

          [profile.release]
          panic = "abort"
          '@ | Set-Content -Encoding utf8 (Join-Path $dir 'Cargo.toml')
          @'
          use std::sync::{Arc, Condvar, Mutex};
          use std::thread;

          fn main() {
              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let worker_pair = Arc::clone(&pair);
              let worker = thread::spawn(move || {
                  let (lock, cv) = &*worker_pair;
                  let mut ready = lock.lock().unwrap();
                  *ready = true;
                  cv.notify_one();
              });
              let (lock, cv) = &*pair;
              let mut ready = lock.lock().unwrap();
              while !*ready {
                  ready = cv.wait(ready).unwrap();
              }
              drop(ready);
              worker.join().unwrap();
              println!("win7-build-std-preflight-ok");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $dir 'src\main.rs')

          & $env:CARGO build --release --manifest-path (Join-Path $dir 'Cargo.toml') --target $env:RUST_TARGET_WIN7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $dir "target\$env:RUST_TARGET_WIN7\release\win7-preflight.exe"
          if (-not (Test-Path $exe)) { throw "Win7 preflight EXE was not produced: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Win7 Rust build-std preflight PASSED.'

      - name: Configure object directory and verify Rust target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = .\mach.ps1 configure 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath configure-win7.log
          if ($exitCode -ne 0) { exit $exitCode }

          $joined = $output -join "`n"
          if ($joined -notmatch 'checking for rust target triplet\.\.\.\s+x86_64-win7-windows-msvc') {
            throw 'Configure did not select x86_64-win7-windows-msvc as the Rust target.'
          }
          Write-Host 'Mozilla Rust target gate PASSED: x86_64-win7-windows-msvc.'

      - name: Build export prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          if (-not (Test-Path $mozmake)) { throw "mozmake.exe was not found at $mozmake" }
          Write-Host "mozmake=$mozmake"
          & $mozmake -C 'obj-gost-win64' recurse_pre-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mozmake -C 'obj-gost-win64' recurse_export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Compile security manager SSL target objects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          if (-not (Test-Path $mozmake)) { throw "mozmake.exe was not found at $mozmake" }
          Write-Host '=== GOST/SSL PARTIAL COMPILE GATE ==='
          & $mozmake -C 'obj-gost-win64' 'security/manager/ssl/target-objects'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'GOST/SSL partial compile gate PASSED.'

      - name: Show runner state BEFORE full build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== Runner state BEFORE full build ==='
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            TotalPhysicalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            FreePhysicalGB  = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
            TotalVirtualGB  = [math]::Round($os.TotalVirtualMemorySize / 1MB, 2)
            FreeVirtualGB   = [math]::Round($os.FreeVirtualMemorySize / 1MB, 2)
          } | Format-List

          Write-Host 'Page file usage:'
          Get-CimInstance Win32_PageFileUsage |
            Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage |
            Format-Table -AutoSize

          Write-Host 'Page file settings:'
          Get-CimInstance Win32_PageFileSetting |
            Select-Object Name, InitialSize, MaximumSize |
            Format-Table -AutoSize

          Write-Host 'Filesystem free space:'
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID,
              @{N='SizeGB';E={[math]::Round($_.Size / 1GB, 2)}},
              @{N='FreeGB';E={[math]::Round($_.FreeSpace / 1GB, 2)}} |
            Format-Table -AutoSize

      - name: GATE - Require large active pagefile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $minimumActivePagefileMB = 20480
          $activeMB = (Get-CimInstance Win32_PageFileUsage |
            Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }
          Write-Host "Active pagefile total: $activeMB MB"
          Write-Host "Required before full build: $minimumActivePagefileMB MB"
          if ($activeMB -lt $minimumActivePagefileMB) {
            throw "Full build blocked: active pagefile is only $activeMB MB."
          }
          Write-Host 'Active pagefile gate PASSED.'

      - name: Build release r3dfox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show runner state AFTER build
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== Runner state AFTER build ==='
          $os = Get-CimInstance Win32_OperatingSystem
          [pscustomobject]@{
            TotalPhysicalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            FreePhysicalGB  = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
            TotalVirtualGB  = [math]::Round($os.TotalVirtualMemorySize / 1MB, 2)
            FreeVirtualGB   = [math]::Round($os.FreeVirtualMemorySize / 1MB, 2)
          } | Format-List

          Write-Host 'Page file usage:'
          Get-CimInstance Win32_PageFileUsage |
            Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage |
            Format-Table -AutoSize

          Write-Host 'Top processes by working set:'
          Get-Process |
            Sort-Object WorkingSet64 -Descending |
            Select-Object -First 15 Name, Id,
              @{N='WorkingSetMB';E={[math]::Round($_.WorkingSet64 / 1MB, 1)}},
              @{N='PrivateMB';E={[math]::Round($_.PrivateMemorySize64 / 1MB, 1)}} |
            Format-Table -AutoSize

      - name: Audit xul.dll Win7 imports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $xul = 'obj-gost-win64\dist\bin\xul.dll'
          if (-not (Test-Path $xul)) { throw "xul.dll not found: $xul" }

          dumpbin /imports $xul 2>&1 | Tee-Object -FilePath xul-win7-imports.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $imports = [System.IO.File]::ReadAllText((Resolve-Path 'xul-win7-imports.txt'))
          $forbidden = @(
            'ProcessPrng',
            'api-ms-win-core-synch-l1-2-0.dll',
            'WaitOnAddress',
            'WakeByAddressAll',
            'WakeByAddressSingle',
            'GetSystemTimePreciseAsFileTime',
            'GetOverlappedResultEx'
          )

          $found = @()
          foreach ($symbol in $forbidden) {
            if ($imports.IndexOf($symbol, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              $found += $symbol
              Write-Warning "Win7 blocker still imported by xul.dll: $symbol"
            }
          }

          if ($found.Count -gt 0) {
            $found | Set-Content -Encoding utf8 xul-win7-forbidden-imports.txt
            Write-Warning "xul.dll still contains $($found.Count) known Win8+ import(s). Package will still be produced for inspection."
          }
          else {
            'No known Win8+ imports from the current blacklist were found.' |
              Set-Content -Encoding utf8 xul-win7-audit-result.txt
            Write-Host 'xul.dll Win7 import audit PASSED.'
          }

      - name: Package release r3dfox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Packaged artifacts:'
          Get-ChildItem 'obj-gost-win64\dist' -File |
            Where-Object { $_.Name -match '\.(zip|7z)$' -or $_.Name -like '*.installer.exe' } |
            Select-Object FullName,Length |
            Format-Table -AutoSize

      - name: Upload release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-win64-release
          if-no-files-found: error
          compression-level: 0
          path: |
            obj-gost-win64/dist/*.zip
            obj-gost-win64/dist/*.7z
            obj-gost-win64/dist/*.installer.exe

      - name: Upload Win7 import audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-gost-win64-win7-import-audit
          if-no-files-found: warn
          path: |
            configure-win7.log
            rust-win7-target-cfg.txt
            xul-win7-imports.txt
            xul-win7-forbidden-imports.txt
            xul-win7-audit-result.txt

      - name: GATE - Reject known Win8+ imports after artifacts are uploaded
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'xul-win7-forbidden-imports.txt') {
            Write-Host 'Known Win8+ imports found in xul.dll:'
            Get-Content 'xul-win7-forbidden-imports.txt'
            throw 'Release package was produced for diagnosis, but the Win7 import gate failed.'
          }
          Write-Host 'Final Win7 import gate PASSED.'
