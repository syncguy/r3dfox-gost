name: YY v1.2.2 forced-fallback owner-lifetime L1 L2 L3

on:
  workflow_dispatch:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - ".github/workflows/xp-yy-threadpool-lifetime-candidate.yml"
      - ".github/scripts/xp/yy-threadpool-lifetime-candidate.ps1"
      - ".github/scripts/xp/yy-threadpool-lifetime-candidate.cpp"

permissions:
  contents: read

jobs:
  yy-owner-lifetime-hosted:
    name: Test-only pinned source YY fallback / deferred owner close / independent subprocesses
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout experiment-only scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/xp
          persist-credentials: false

      - name: Enable x86 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare YY v1.2.2 source, authentic generated API list and test-only hooks
        shell: powershell
        run: '& .\.github\scripts\xp\yy-threadpool-lifetime-candidate.ps1 -Stage prepare'

      - name: Build instrumented upstream YY and owner lifetime test x86 executable
        shell: powershell
        run: '& .\.github\scripts\xp\yy-threadpool-lifetime-candidate.ps1 -Stage build'

      - name: GATE - L1 safe deferred close, L2 running and pending cancel, L3 shutdown
        shell: powershell
        run: '& .\.github\scripts\xp\yy-threadpool-lifetime-candidate.ps1 -Stage hosted'

      - name: Upload independent forced fallback lifetime scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yy-v122-forced-fallback-owner-lifetime-hosted-diagnostics
          path: diagnostics/
          if-no-files-found: warn
