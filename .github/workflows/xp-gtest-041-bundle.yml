# DRAFT ONLY. First commit uses [skip ci] and DOES NOT authorize a HEAVY run.
# A later explicitly approved edit plus [xp041-heavy-approved] marker is required.
name: "XP GTest 041 exact-bundle static and hosted acceptance"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - ".github/workflows/xp-gtest-041-bundle.yml"

permissions:
  contents: read
  actions: read

jobs:
  xp-x32:
    name: Windows x86 / linked XP GTest bundle 041
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/winrt-source-poc' && contains(github.event.head_commit.message, '[xp041-heavy-approved]') && github.run_attempt == 1 }}
    runs-on: windows-2022
    timeout-minutes: 180
    concurrency:
      group: xp-gtest-041-one-approved-job
      cancel-in-progress: false

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost-xp-x32
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      RUST_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET: "i686-pc-windows-msvc"
      RUSTFLAGS: "--cfg moz_xp_compat"
      MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
      MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
      YY_THUNKS_VERSION: "1.2.2"
      YY_THUNKS_TARGET: "5.1.2600.0"
      WINDOWS_XP_SUBSYSTEM: "5.01"
      OBJDIR: "obj-gost-xp-x32"
      BCRYPT_REPOSITORY: "syncguy/bcrypt"
      BCRYPT_TAG: "v0.1.0-alpha.1"
      BCRYPT_RELEASE_ID: "401484730"
      BCRYPT_ASSET_ID: "604569009"
      BCRYPT_SOURCE_SHA: "2683896c5d288dcd90449f2fabebe8aa4790753c"
      BCRYPT_SIZE: "388172"
      BCRYPT_SHA1: "31e7dd01ad4d87dfa97de99d936abf8e397a86c1"
      BCRYPT_SHA256: "47182ec816d6ed797bdec96e160c7c34e0dfe78f299dddbc0b4f5742c4bb3a59"

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: 27792a8db5b3de486586b93b634fb7bbed760ef0

      - name: Verify pinned product source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne '27792a8db5b3de486586b93b634fb7bbed760ef0') {
            throw "Unexpected source-under-test SHA: $head"
          }
          Write-Host "CONTROLLER_SHA=$env:GITHUB_SHA"
          Write-Host "SOURCE_UNDER_TEST_SHA=$head"


      - name: Checkout controller-only 041 evidence helper
        uses: actions/checkout@v4
        with:
          repository: syncguy/r3dfox-gost
          ref: ${{ github.sha }}
          path: gtest041-controller
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/xp/xp-gtest-041-evidence.py
            .github/scripts/xp/test_xp_gtest_041_evidence.py
          sparse-checkout-cone-mode: false

      - name: GATE - Pin source, blobs and controller before expensive steps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (& git rev-parse HEAD).Trim()
          $controller = (& git -C gtest041-controller rev-parse HEAD).Trim()
          if ($source -ne '27792a8db5b3de486586b93b634fb7bbed760ef0') { throw "Unexpected tested source $source" }
          if ($controller -ne $env:GITHUB_SHA) { throw "Unexpected controller $controller" }
          $shaMap = @{
            'toolkit/components/contentanalysis/tests/gtest/TestContentAnalysisUtils.cpp' = '9f626df929f286d54572a10abd4881f3198bf3af'
            'widget/windows/tests/gtest/TestJumpListBuilder.cpp' = '3b28d90cef5aaf24e9a5b38953ee8d86ba6c2ffe'
            'toolkit/library/gtest/moz.build' = '0905f34495bdf491d37dbf0225cbd3a687fb0042'
          }
          foreach ($file in $shaMap.Keys) {
            $sha = (& git hash-object $file).Trim()
            if ($LASTEXITCODE -ne 0 -or $sha -ne $shaMap[$file]) { throw "Patched input blob mismatch $file" }
          }
          $helper = 'gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py'
          $actualHelper = (& git hash-object $helper).Trim()
          if ($actualHelper -ne 'ae547673f3f388d3453eb37495227f487844ea8f') { throw "Evidence tool changed $actualHelper" }
          $selftest = 'gtest041-controller/.github/scripts/xp/test_xp_gtest_041_evidence.py'
          $testSha = (& git hash-object $selftest).Trim()
          if ($testSha -ne 'e8725945d15fb9a357a5268c7e053582a50f2285') { throw "041 selftest blob changed $testSha" }
          & python $selftest
          if ($LASTEXITCODE -ne 0) { throw 'XP GTest 041 fail-closed selftests failed; STOP before build' }
          & python -m py_compile $helper
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Python evidence tool' }
          Write-Host "GTEST041_SOURCE_UNDER_TEST=$source CONTROLLER=$controller"

      - name: GATE - Static script ValidateSet contracts before any build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Path = '.github/scripts/xp/d3dcompiler-xp-fallback.ps1'; Mode = 'VerifyAfterRetarget' },
            @{ Path = '.github/scripts/xp/dwrite-private-closure.ps1'; Mode = 'Verify' }
          )
          foreach ($check in $checks) {
            $content = Get-Content -LiteralPath $check.Path -Raw
            if ($content -notmatch '\[ValidateSet\(([^)]*)\)\]') {
              throw "Missing ValidateSet: $($check.Path)"
            }
            $modes = $matches[1]
            if ($modes -notmatch ("'" + [regex]::Escape($check.Mode) + "'")) {
              throw "Unsupported mode $($check.Mode) in $($check.Path)"
            }
          }
          Write-Host 'XP_GTEST041_VERIFY_MODES_PRECHECK_PASS'

      - name: Download 038 independent PE import baseline
        uses: actions/download-artifact@v4
        with:
          repository: syncguy/r3dfox-gost
          run-id: 40519752469
          github-token: ${{ github.token }}
          name: xp-handlewatcher-038-dist-bin-salvage-40519752469
          path: baseline038

      - name: GATE - Assert positive and negative 038 PE controls
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py control --baseline baseline038
          if ($LASTEXITCODE -ne 0) { throw 'PE control failed; STOP before heavyweight compilation' }


      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify XP DPI pre-Vista source guard
        id: dpi-source-guard
        shell: powershell
        run: .\.github\scripts\xp\verify-dpi-source-guard.ps1

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: .\.github\scripts\xp\plan-pagefile.ps1

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile and show runner CPU
        shell: powershell
        run: .\.github\scripts\xp\verify-runner-pagefile.ps1
        
      - name: GATE - Verify committed mime_guess vendored checksum
        shell: powershell
        run: .\.github\scripts\xp\verify-mime-guess-checksum.ps1

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD
          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"
          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) { throw 'Expected MSSPI Windows.h include was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($msspiCpp, $source.Replace('#include <Windows.h>', '#include <windows.h>').Replace('SECPKG_ATTR_REMOTE_CERT_CHAIN', 'SECPKG_ATTR_REMOTE_CERT_CONTEXT'), $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]
          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += ["msspi/src/msspi.cpp"]
              LOCAL_INCLUDES += ["msspi/src", "msspi/third_party/cprocsp/include"]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Prepare pinned XP D3DCompiler_43 fallback
        shell: powershell
        run: .\.github\scripts\xp\d3dcompiler-xp-fallback.ps1 -Mode Prepare

      - name: Prepare pinned XP bcrypt release asset
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .\.github\scripts\xp\prepare-pinned-xp-bcrypt.ps1

      - name: Install pinned ordinary Rust x86 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Build pinned msvcr14x Release x86
        shell: powershell
        run: .\.github\scripts\xp\build-msvcr14x-release-x86.ps1

      - name: GATE - Require proven XP x86 msvcr14x runtime contract
        shell: powershell
        run: .\.github\scripts\xp\verify-msvcr14x-xp-contract.ps1

      - name: GATE - Validate actual XP CRT/bcrypt export tables before Gecko compile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py supplier-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Real XP CRT/bcrypt supplier EAT preflight failed before Gecko compile' }

      - name: Prepare pinned private DirectWrite integration
        id: prepare-private-dwrite
        shell: powershell
        run: .\.github\scripts\xp\prepare-private-dwrite-integration.ps1

      - name: Download YY-Thunks 1.2.2 XP x86 libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixed upstream v1.2.2 asset URL avoids GitHub REST API rate limits.
          $zip = Join-Path $env:RUNNER_TEMP 'YY-Thunks-Lib.zip'
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-xp-x86'
          $url = "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v$env:YY_THUNKS_VERSION/YY-Thunks-Lib.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root
          $yyLib = $null
          foreach ($dir in (Get-ChildItem -Path $root -Recurse -Directory)) {
            $suffix = "Lib\$env:YY_THUNKS_TARGET\x86"
            if ($dir.FullName.EndsWith($suffix, [StringComparison]::OrdinalIgnoreCase)) {
              $yyLib = $dir
              break
            }
          }
          if (-not $yyLib) { throw 'YY XP x86 library directory not found' }
          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          $ws2 = Join-Path $yyLib.FullName 'ws2_32.lib'
          foreach ($lib in @($kernel32, $synch, $ws2)) {
            if (-not (Test-Path $lib)) { throw "Required YY library missing: $lib" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "THUNK_YY_LIB=$($yyLib.FullName)" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "THUNK_YY_KERNEL32_LIB=$kernel32" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "THUNK_YY_SYNCH_LIB=$synch" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "THUNK_YY_WS2_32_LIB=$ws2" -Encoding utf8

      - name: Build narrow YY XP x86 provider
        shell: powershell
        run: .\.github\scripts\xp\build-narrow-yy.ps1

      - name: Activate narrow YY XP x86 provider for all target links
        shell: powershell
        run: .\.github\scripts\xp\activate-narrow-yy-provider.ps1

      - name: GATE - Verify committed xul.dll and libGLESv2.dll YY TLS entry-point contracts
        shell: powershell
        run: .\.github\scripts\xp\verify-xul-yy-entrypoint-contract.ps1

      - name: Write XP x32 mozconfig
        shell: powershell
        run: |
          @'
          mk_add_options AUTOCLOBBER=1
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-gost-xp-x32
          mk_add_options MOZ_PARALLEL_BUILD=4
          mk_add_options MOZ_MAKE_FLAGS="-j4"
          ac_add_options --enable-bootstrap
          ac_add_options --target=i686
          ac_add_options --disable-cargo-incremental
          ac_add_options --enable-application=browser
          ac_add_options --disable-artifact-builds
          ac_add_options --enable-official-branding
          ac_add_options --disable-debug
          ac_add_options --disable-debug-js-modules
          ac_add_options --enable-debug-symbols
          ac_add_options --enable-tests
          ac_add_options --disable-sandbox
          ac_add_options --enable-hardening
          ac_add_options --enable-stl-hardening
          ac_add_options --enable-jemalloc
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --enable-rust-simd
          ac_add_options --enable-replace-malloc
          ac_add_options --disable-eme
          ac_add_options --enable-jxl
          ac_add_options --enable-raw
          ac_add_options --enable-webrtc
          ac_add_options --disable-backgroundtasks
          ac_add_options --disable-bits-download
          ac_add_options --disable-crashreporter
          ac_add_options --disable-default-browser-agent
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-necko-wifi
          ac_add_options --disable-notification-server
          ac_add_options --disable-parental-controls
          ac_add_options --without-onnx-runtime
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --disable-update-agent
          ac_add_options --disable-updater
          mk_add_options MOZ_CRASHREPORTER=0
          mk_add_options MOZ_DATA_REPORTING=0
          mk_add_options MOZ_SERVICES_HEALTHREPORT=0
          mk_add_options MOZ_TELEMETRY_REPORTING=
          export CFLAGS="$CFLAGS -DMOZ_NO_WINRT -DMOZ_XP_COMPAT"
          export CXXFLAGS="$CXXFLAGS -DMOZ_NO_WINRT -DMOZ_XP_COMPAT"
          export MOZ_CRASHREPORTER=0
          export MOZ_DATA_REPORTING=0
          export MOZ_REQUIRE_SIGNING=
          export MOZ_TELEMETRY_REPORTING=
          export MOZ_PACKAGE_JSSHELL=1
          '@ | Set-Content '.mozconfig-gost-xp-x32'
          $optimizeMode = 'default'
          switch ($optimizeMode) {
            'default' { $optimizeOption = '--enable-optimize'; break }
            '-Os' { $optimizeOption = '--enable-optimize=-Os'; break }
            '-Oz' { $optimizeOption = '--enable-optimize="-O2 /clang:-Oz"'; break }
            default { throw "Unsupported optimize_mode: $optimizeMode" }
          }
          $mozconfigPath = '.mozconfig-gost-xp-x32'
          $mozconfigContent = Get-Content -LiteralPath $mozconfigPath -Raw
          $needle = 'ac_add_options --enable-optimize'
          if (([regex]::Matches($mozconfigContent, [regex]::Escape($needle))).Count -ne 1) {
            throw 'Expected exactly one --enable-optimize line in XP mozconfig'
          }
          $mozconfigContent = $mozconfigContent.Replace($needle, "ac_add_options $optimizeOption")
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $mozconfigPath), $mozconfigContent, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Selected XP C/C++ optimization: $optimizeOption"

      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Firefox x86 target
        shell: powershell
        run: .\.github\scripts\xp\configure-firefox-x86-target.ps1

      - name: Build export prerequisites
        shell: powershell
        run: .\.github\scripts\xp\build-export-prerequisites.ps1

      - name: GATE - Log G1a source identity and XP define
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "G1A_SOURCE_UNDER_TEST=$((& git rev-parse HEAD).Trim())"
          Write-Host "G1A_SOURCE_BRANCH=$env:GITHUB_REF_NAME"
          $mozconfig = Get-Content -LiteralPath $env:MOZCONFIG -Raw
          if (-not $mozconfig.Contains('-DMOZ_XP_COMPAT')) {
            throw 'Required XP C++ compatibility define is missing'
          }

      - name: GATE - WinHandleWatcher and gtest prerequisites
        id: census-preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          if (-not (Test-Path -LiteralPath $mozmake)) {
            throw 'mozmake is missing after configuration'
          }
          $targets = @(
            'xpcom/threads/target-objects',
            'xpcom/tests/gtest/target-objects'
          )
          $stdout = Join-Path (Get-Location) 'g1a-preflight.stdout.log'
          $stderr = Join-Path (Get-Location) 'g1a-preflight.stderr.log'
          $makeArgs = @('-C', $env:OBJDIR, '-n', '-k') + $targets
          Write-Host "NON-EXECUTING targets: $($targets -join ', ')"
          $proc = Start-Process -FilePath $mozmake -ArgumentList $makeArgs -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $missing = @(Select-String -Path @($stdout, $stderr) -Pattern 'No rule to make target|needed by|No targets specified|No such file or directory' -ErrorAction SilentlyContinue)
          Write-Host "PREFLIGHT_EXIT=$($proc.ExitCode)"
          Write-Host "PREFLIGHT_MISSING_DEPENDENCIES=$($missing.Count)"
          $missing | Select-Object -First 150 | ForEach-Object { Write-Host $_.Line }
          if ($proc.ExitCode -ne 0 -or $missing.Count -gt 0) {
            throw 'Generated target prerequisite closure is incomplete; diagnostic files uploaded'
          }

      - name: GATE - Real XP x86 source and gtest compile
        id: census-compile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          $targets = @(
            'xpcom/threads/target-objects',
            'xpcom/tests/gtest/target-objects'
          )
          foreach ($target in $targets) {
            Write-Host "REAL G1A COMPILE: $target"
            & $mozmake -C $env:OBJDIR $target
            if ($LASTEXITCODE -ne 0) {
              throw "Native compile failed: $target (exit $LASTEXITCODE)"
            }
          }
          Write-Host 'XP WinHandleWatcher and gtest objects compiled; proceeding to link and artifact-only packaging'



      - name: GATE - Recompile two patched objects in exact 041 objdir
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          $targets = @(
            @('toolkit/components/contentanalysis/tests/gtest','TestContentAnalysisUtils.obj'),
            @('widget/windows/tests/gtest','Unified_cpp_windows_tests_gtest0.obj')
          )
          foreach ($target in $targets) {
            $folder = Join-Path $env:OBJDIR $target[0].Replace('/', '\')
            & $mozmake -C $folder -n -k $target[1]
            if ($LASTEXITCODE -ne 0) { throw "Invalid object graph: $($target[0])" }
            & $mozmake -C $folder $target[1]
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $folder $target[1]))) {
              throw "Two-object compile gate failed: $($target[0])"
            }
          }
          Write-Host 'GTEST041_PATCHED_OBJECTS_COMPILED_2_OF_2'


      - name: Build complete XP x86 Firefox source tree
        id: full-build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { throw "Complete Firefox XP build failed (exit $LASTEXITCODE)" }

      - name: Link patched GTest XUL from the same objdir
        id: gtest-link
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build recurse_gtest
          if ($LASTEXITCODE -ne 0) { throw "Firefox GTest XUL link failed (exit $LASTEXITCODE)" }

      - name: Link browser EXE from the same objdir
        id: browser-link
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $make = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          & $make -C $env:OBJDIR 'browser/app/target'
          if ($LASTEXITCODE -ne 0) { throw "Firefox browser app link failed (exit $LASTEXITCODE)" }


      - name: Record available raw PE/PDB inventory including partial links
        id: raw-inventory
        if: ${{ always() && steps.full-build.outcome != 'skipped' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force gtest041-results | Out-Null
          $paths = @('dist/bin/r3dfox.exe', 'dist/bin/xul.dll',
                     'dist/bin/gtest/xul.dll', 'browser/app/r3dfox.pdb',
                     'toolkit/library/build/xul.pdb', 'toolkit/library/gtest/xul.pdb')
          $available = 0
          foreach ($rel in $paths) {
            $file = Join-Path $env:OBJDIR $rel.Replace('/','\')
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              "RAW_NOT_PRESENT|$rel" | Add-Content -LiteralPath gtest041-results/raw-linked-inventory.txt
              continue
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "RAW_UNVALIDATED|$rel|$((Get-Item -LiteralPath $file).Length)|$hash" |
              Add-Content -LiteralPath gtest041-results/raw-linked-inventory.txt
            $available++
          }
          Write-Host "XP_GTEST041_RAW_LINK_INVENTORY_COUNT=$available (not PDB-matched)"

      - name: Preserve available raw dist/bin even on partial link failure
        if: ${{ always() && steps.full-build.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: xp-gtest-041-raw-dist-${{ github.run_id }}
          path: obj-gost-xp-x32/dist/bin/
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 1
          retention-days: 30


      - name: Stage verified CRT before DirectWrite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          foreach ($name in @('ucrtbase.dll','msvcp140.dll')) {
            $src = Join-Path $env:MSVCR14X_RELEASE $name
            if (-not (Test-Path -LiteralPath $src)) { throw "Missing qualified CRT $name" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $bin $name) -Force
          }

      - name: Stage pinned D3DCompiler pair
        shell: powershell
        run: .\.github\scripts\xp\d3dcompiler-xp-fallback.ps1 -Mode Stage

      - name: Stage pinned private DirectWrite closure
        shell: powershell
        run: .\.github\scripts\xp\dwrite-private-closure.ps1 -Mode Stage

      - name: Retarget built PE subsystem headers
        shell: powershell
        run: .\.github\scripts\xp\retarget-dist-bin-pe-subsystem.ps1

      - name: GATE - Validate D3DCompiler and DirectWrite after retarget
        shell: powershell
        run: |
          & .\.github\scripts\xp\d3dcompiler-xp-fallback.ps1 -Mode VerifyAfterRetarget
          if (-not $?) { throw 'D3DCompiler retarget check failed' }
          & .\.github\scripts\xp\dwrite-private-closure.ps1 -Mode Verify
          if (-not $?) { throw 'Private DirectWrite retarget check failed' }

      - name: GATE - Restage byte-identical qualified CRT and bcrypt suppliers
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py stage --dist (Join-Path $env:OBJDIR 'dist\bin')
          if ($LASTEXITCODE -ne 0) { throw 'XP supplier provenance/staging failed' }

      - name: GATE - Verify RSDS GUID+Age against each actual PDB
        id: pdb-check
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py pdb --objdir $env:OBJDIR --evidence gtest041-results
          if ($LASTEXITCODE -ne 0) { throw 'Linked PDB mismatch' }

      - name: GATE - Audit exact new XUL imports and XP supplier exports
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py audit --dist (Join-Path $env:OBJDIR 'dist\bin') --report gtest041-results/import-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'New PE import audit failed' }

      - name: GATE - Re-extract final ZIP and verify every size and SHA-256
        id: verified-package
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py package --dist (Join-Path $env:OBJDIR 'dist\bin') --evidence gtest041-results
          if ($LASTEXITCODE -ne 0) { throw 'ZIP re-extraction evidence gate failed' }

      - name: GATE - Real Shell PKEY_Title test 1 of 1 on Windows Server 2022
        shell: powershell
        run: |
          & python gtest041-controller/.github/scripts/xp/xp-gtest-041-evidence.py run --evidence gtest041-results
          if ($LASTEXITCODE -ne 0) { throw 'Hosted JumpListBuilder.PopulateJumpListOnlyTasks test failed' }

      - name: Print evidence scope even on failure
        if: always()
        shell: powershell
        run: |
          Write-Host "TESTED_SOURCE=27792a8db5b3de486586b93b634fb7bbed760ef0 CONTROLLER=$env:GITHUB_SHA"
          Write-Host 'Hosted source build / PE import / Windows Shell is NOT physical XP runtime or GOST TLS PASS'

      - name: Upload compact evidence and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-gtest-041-evidence-${{ github.run_id }}
          path: |
            gtest041-results/*.json
            gtest041-results/*.txt
            gtest041-results/*.log
            configure-xp-x32.log
            g1a-preflight.*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload re-extracted-and-verified runtime bundle
        if: ${{ always() && steps.verified-package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: xp-gtest-041-verified-dist-${{ github.run_id }}
          path: gtest041-results/xp-gtest-041-dist.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Preserve raw unmatched PDBs after partial build or PDB validation failure
        if: ${{ always() && steps.full-build.outcome != 'skipped' && steps.pdb-check.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: xp-gtest-041-raw-unmatched-pdb-${{ github.run_id }}
          path: |
            obj-gost-xp-x32/toolkit/library/build/xul.pdb
            obj-gost-xp-x32/toolkit/library/gtest/xul.pdb
            obj-gost-xp-x32/browser/app/r3dfox.pdb
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30

      - name: Preserve three matching original PDBs exactly once
        if: ${{ always() && steps.pdb-check.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: xp-gtest-041-matched-pdb-${{ github.run_id }}
          path: |
            obj-gost-xp-x32/toolkit/library/build/xul.pdb
            obj-gost-xp-x32/toolkit/library/gtest/xul.pdb
            obj-gost-xp-x32/browser/app/r3dfox.pdb
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
