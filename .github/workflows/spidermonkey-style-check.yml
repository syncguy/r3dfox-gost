name: SpiderMonkey style check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/spidermonkey-style-check.yml'
      - 'js/src/vm/JSContext.cpp'

permissions:
  contents: read

jobs:
  style:
    name: SpiderMonkey include-order check
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply upstream JSContext include-order workaround
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'js\src\vm\JSContext.cpp'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)

          $dump = '#include "js/friend/DumpFunctions.h"  // for stack trace utilities'
          $printer = '#include "js/Printer.h"               // for FixedBufferPrinter'
          $util = '#include "util/DiagnosticAssertions.h"'

          $dumpIndex = $lines.IndexOf($dump)
          $printerIndex = $lines.IndexOf($printer)
          $utilIndex = $lines.IndexOf($util)

          if ($dumpIndex -lt 0 -or $printerIndex -lt 0 -or $utilIndex -lt 0) {
            throw 'Expected JSContext include lines were not found; review workaround before continuing.'
          }
          if ($printerIndex -ne ($dumpIndex + 1)) {
            throw 'Expected DumpFunctions.h and Printer.h to be adjacent.'
          }
          if ($dumpIndex -lt $utilIndex) {
            throw 'JSContext include order is already fixed; remove this workaround.'
          }

          $lines.RemoveAt($printerIndex)
          $lines.RemoveAt($dumpIndex)
          $utilIndex = $lines.IndexOf($util)
          $lines.Insert($utilIndex, $printer)
          $lines.Insert($utilIndex, $dump)

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($path, $lines, $utf8NoBom)

          Write-Host 'Applied JSContext include-order workaround:'
          git diff -- $path

      - name: Run SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
