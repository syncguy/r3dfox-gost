name: "One-shot integrate proven XP KERNEL32 cluster and dispatch full build"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - .github/workflows/_xp-integrate-kernel32-and-dispatch-once.yml

permissions:
  actions: write
  contents: write

jobs:
  integrate-and-dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout XP work branch
        uses: actions/checkout@v4
        with:
          ref: agent/winrt-source-poc
          fetch-depth: 1

      - name: Integrate proven 24-API KERNEL32 provider into full build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/gost-poc-build-xp-x32.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          cluster = [
              'GetTickCount64', 'InitializeCriticalSectionEx', 'CompareStringOrdinal',
              'GetCurrentProcessorNumber', 'GetFileInformationByHandleEx',
              'GetFinalPathNameByHandleW', 'GetLocaleInfoEx', 'LCIDToLocaleName',
              'LocaleNameToLCID', 'SetFileInformationByHandle', 'CancelIoEx',
              'CreateWaitableTimerExW', 'CancelSynchronousIo',
              'GetDynamicTimeZoneInformation', 'GetProcessIdOfThread',
              'GetQueuedCompletionStatusEx', 'GetThreadId',
              'GetTimeZoneInformationForYear', 'GetUserPreferredUILanguages',
              'InitOnceBeginInitialize', 'InitOnceComplete',
              'QueryFullProcessImageNameW', 'QueryProcessCycleTime',
              'QueryThreadCycleTime',
          ]

          def unique_index(predicate, label, start=0):
              matches = [i for i in range(start, len(lines)) if predicate(lines[i])]
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one match, found {len(matches)}')
              return matches[0]

          impl_i = unique_index(lambda s: '$implementationPattern =' in s, 'implementation anchor')
          cluster_block = [
              '          $clusterApis = @(',
              "            'GetTickCount64','InitializeCriticalSectionEx','CompareStringOrdinal',",
              "            'GetCurrentProcessorNumber','GetFileInformationByHandleEx','GetFinalPathNameByHandleW',",
              "            'GetLocaleInfoEx','LCIDToLocaleName','LocaleNameToLCID','SetFileInformationByHandle','CancelIoEx',",
              "            'CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread',",
              "            'GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear','GetUserPreferredUILanguages',",
              "            'InitOnceBeginInitialize','InitOnceComplete','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime'",
              '          )',
          ]
          lines[impl_i + 1:impl_i + 1] = cluster_block

          impl_member_i = unique_index(lambda s: "@{ Key='implementation'; Pattern=$implementationPattern }" in s, 'wanted implementation member')
          if impl_member_i + 1 >= len(lines) or lines[impl_member_i + 1].strip() != ')':
              raise SystemExit('wanted array closing parenthesis not found')
          wanted_loop = [
              '          foreach ($api in $clusterApis) {',
              '            $escaped = [regex]::Escape($api)',
              '            $wanted += @{ Key="cluster-$api-direct"; Pattern="(?i)[\\\\/]_${escaped}@\\d+\\.obj$" }',
              '            $wanted += @{ Key="cluster-$api-import"; Pattern="(?i)[\\\\/]_${escaped}@\\d+\\.obi$" }',
              '          }',
          ]
          insert_i = impl_member_i + 2
          lines[insert_i:insert_i] = wanted_loop

          broad_i = unique_index(lambda s: "foreach ($broad in @('LockResource','__imp_LockResource'))" in s, 'broad-symbol guard')
          symbol_gate = [
              '          foreach ($api in $clusterApis) {',
              '            $required = "YY_Thunks_$api"',
              '            if ($symbols.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) { throw "Narrow provider missing $required" }',
              '          }',
          ]
          lines[broad_i:broad_i] = symbol_gate

          step_i = unique_index(lambda s: s.strip() == '- name: GATE - Reject core browser synchronization direct imports', 'early import gate')
          lines[step_i] = lines[step_i].replace('GATE - Reject core browser synchronization direct imports', 'GATE - Reject proven core browser XP direct imports')
          apis_i = unique_index(lambda s: s.strip() == '$apis = @(', 'early api array', start=step_i)
          early_cluster = [
              "            'GetTickCount64','InitializeCriticalSectionEx','CompareStringOrdinal',",
              "            'GetCurrentProcessorNumber','GetFileInformationByHandleEx','GetFinalPathNameByHandleW',",
              "            'GetLocaleInfoEx','LCIDToLocaleName','LocaleNameToLCID','SetFileInformationByHandle','CancelIoEx',",
              "            'CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation','GetProcessIdOfThread',",
              "            'GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear','GetUserPreferredUILanguages',",
              "            'InitOnceBeginInitialize','InitOnceComplete','QueryFullProcessImageNameW','QueryProcessCycleTime','QueryThreadCycleTime',",
          ]
          lines[apis_i + 1:apis_i + 1] = early_cluster

          failure_i = unique_index(lambda s: 'Core browser synchronization imports survived the proven ten-API YY integration' in s, 'early gate failure message')
          lines[failure_i] = lines[failure_i].replace(
              'Core browser synchronization imports survived the proven ten-API YY integration',
              'Core browser imports survived the proven SRW plus 24-API KERNEL32 YY integration',
          )

          audit_i = unique_index(lambda s: s.strip() == '- name: GATE - Audit XP x32 PE floor and direct imports', 'final import audit')
          forbidden_i = unique_index(lambda s: s.strip() == '$forbiddenApis = @(', 'final forbidden API array', start=audit_i)
          forbidden_end = None
          for i in range(forbidden_i + 1, len(lines)):
              if lines[i].strip() == ')':
                  forbidden_end = i
                  break
          if forbidden_end is None:
              raise SystemExit('final forbidden API array closing parenthesis not found')
          extra_forbidden = [
              "            'CreateWaitableTimerExA','CreateWaitableTimerExW','CancelSynchronousIo','GetDynamicTimeZoneInformation',",
              "            'GetProcessIdOfThread','GetQueuedCompletionStatusEx','GetThreadId','GetTimeZoneInformationForYear',",
              "            'GetUserPreferredUILanguages','InitOnceBeginInitialize','InitOnceComplete','QueryFullProcessImageNameW',",
              "            'QueryProcessCycleTime','QueryThreadCycleTime',",
          ]
          lines[forbidden_end:forbidden_end] = extra_forbidden

          summary_i = unique_index(lambda s: 'physically narrow ten-API SRW/condition-variable provider proven by run 33470957048' in s, 'summary provider line')
          lines[summary_i] = lines[summary_i].replace(
              'the physically narrow ten-API SRW/condition-variable provider proven by run 33470957048.',
              'the physically narrow SRW/condition-variable closure extended with the 24 capability-present KERNEL32 APIs proven by run 33600786738 / job 100153789478 / SHA 0184985c2f0c5ab1c4c732a200cfbda07a6aefb4. CreateWaitableTimerExA remains outside that provider.',
          )

          text = '\n'.join(lines) + '\n'
          if text.count('$clusterApis = @(') != 1:
              raise SystemExit('cluster API block multiplicity check failed')
          for api in cluster:
              if f"YY_Thunks_{api}" in text:
                  continue
              if api not in text:
                  raise SystemExit(f'missing cluster API after integration: {api}')
          if 'CreateWaitableTimerExA' not in text:
              raise SystemExit('CreateWaitableTimerExA final-gate sentinel missing')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check -- .github/workflows/gost-poc-build-xp-x32.yml
          git diff -- .github/workflows/gost-poc-build-xp-x32.yml

      - name: Commit integrated full-build workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gost-poc-build-xp-x32.yml
          git diff --cached --quiet && { echo 'No target workflow change produced'; exit 1; }
          git commit -m 'ci(xp): integrate proven KERNEL32 cluster into full build'
          git push origin HEAD:agent/winrt-source-poc
          echo "INTEGRATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch integrated XP x32 full build
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/gost-poc-build-xp-x32.yml/dispatches" \
            -f ref='agent/winrt-source-poc'
          echo "Dispatched source $INTEGRATED_SHA"

      - name: Remove one-shot integrator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          path='.github/workflows/_xp-integrate-kernel32-and-dispatch-once.yml'
          info=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=agent/winrt-source-poc")
          sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])' <<<"$info")
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='ci: remove XP KERNEL32 one-shot integrator' \
            -f branch='agent/winrt-source-poc' \
            -f sha="$sha" >/dev/null
