name: Gosplugin XPI bootstrap

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/gosplugin-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    name: Validate and vendor current AMO Gosplugin XPI
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      XPI_URL: https://addons.mozilla.org/firefox/downloads/file/4795372/2842830-1.3.43.0.xpi
      EXPECTED_ID: gosuslugi@plugin
      EXPECTED_VERSION: "1.3.43.0"
      EXPECTED_SHA256: f9a53a2fb4f33041676bf97d9ae9b061b67dde9ddbdc78221a06454381cd6cbc
      XPI_PATH: r3dfox\extensions\gosuslugi@plugin.xpi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            r3dfox/extensions
          sparse-checkout-cone-mode: false

      - name: Download and validate exact signed AMO XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'gosplugin-1.3.43.0.xpi'
          Invoke-WebRequest -Uri $env:XPI_URL -OutFile $candidate -TimeoutSec 60
          @'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'gosplugin-1.3.43.0.xpi'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = set(z.namelist())
              for required in ('manifest.json', 'META-INF/manifest.mf', 'META-INF/mozilla.sf', 'META-INF/mozilla.rsa'):
                  if required not in names:
                      raise SystemExit(f'Missing signed-XPI member: {required}')
              manifest = json.loads(z.read('manifest.json').decode('utf-8'))
          gecko = manifest.get('browser_specific_settings', {}).get('gecko', {})
          legacy = manifest.get('applications', {}).get('gecko', {})
          addon_id = gecko.get('id') or legacy.get('id')
          version = manifest.get('version')
          raw = path.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          if addon_id != os.environ['EXPECTED_ID']:
              raise SystemExit(f'Unexpected extension ID: {addon_id!r}')
          if version != os.environ['EXPECTED_VERSION']:
              raise SystemExit(f'Unexpected version: {version!r}')
          if digest != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'Unexpected SHA-256: {digest}')
          permissions = manifest.get('permissions', [])
          if 'nativeMessaging' not in permissions:
              raise SystemExit('nativeMessaging permission is missing')
          print(json.dumps({
              'id': addon_id,
              'version': version,
              'size': len(raw),
              'sha256': digest,
              'permissions': permissions,
              'has_cose_signature': all(x in names for x in ('META-INF/cose.manifest', 'META-INF/cose.sig')),
          }, ensure_ascii=False, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force $candidate $env:XPI_PATH
          $workingHash = (Get-FileHash -Algorithm SHA256 $env:XPI_PATH).Hash.ToLowerInvariant()
          if ($workingHash -ne $env:EXPECTED_SHA256) { throw "Working-tree XPI hash mismatch: $workingHash" }

      - name: Commit exact validated XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $env:XPI_PATH
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Validated Gosplugin XPI produced no repository change.' }
          git commit -m 'build(extensions): vendor Gosplugin Firefox XPI'
          git push origin HEAD:agent/gost-tls-poc
