name: Gosplugin XPI bootstrap

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/gosplugin-bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    name: Validate and vendor current AMO Gosplugin XPI
    runs-on: windows-2022
    timeout-minutes: 10

    env:
      XPI_URL: https://addons.mozilla.org/firefox/downloads/file/4795372/2842830-1.3.43.0.xpi
      EXPECTED_VERSION: "1.3.43.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            r3dfox/extensions
          sparse-checkout-cone-mode: false

      - name: Download and inspect signed AMO XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = Join-Path $env:RUNNER_TEMP 'gosplugin-1.3.43.0.xpi'
          Invoke-WebRequest -Uri $env:XPI_URL -OutFile $candidate -TimeoutSec 60
          @'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'gosplugin-1.3.43.0.xpi'
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = set(z.namelist())
              for required in ('manifest.json', 'META-INF/manifest.mf', 'META-INF/mozilla.sf', 'META-INF/mozilla.rsa'):
                  if required not in names:
                      raise SystemExit(f'Missing signed-XPI member: {required}')
              manifest = json.loads(z.read('manifest.json').decode('utf-8'))
          gecko = manifest.get('browser_specific_settings', {}).get('gecko', {})
          legacy = manifest.get('applications', {}).get('gecko', {})
          addon_id = gecko.get('id') or legacy.get('id')
          version = manifest.get('version')
          if not addon_id:
              raise SystemExit('Manifest does not declare a Firefox extension ID')
          if version != os.environ['EXPECTED_VERSION']:
              raise SystemExit(f'Unexpected version: {version!r}')
          permissions = manifest.get('permissions', [])
          if 'nativeMessaging' not in permissions:
              raise SystemExit('nativeMessaging permission is missing')
          raw = path.read_bytes()
          meta = {
              'id': addon_id,
              'version': version,
              'size': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'permissions': permissions,
              'has_cose_signature': all(x in names for x in ('META-INF/cose.manifest', 'META-INF/cose.sig')),
          }
          Path('gosplugin-bootstrap.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write(f"GOSPLUGIN_ID={addon_id}\nGOSPLUGIN_SHA256={meta['sha256']}\n")
          print(json.dumps(meta, ensure_ascii=False, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dest = "r3dfox\extensions\$env:GOSPLUGIN_ID.xpi"
          Copy-Item -Force $candidate $dest
          Write-Host "Vendoring $dest sha256=$env:GOSPLUGIN_SHA256"

      - name: Commit exact validated XPI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "r3dfox\extensions\$env:GOSPLUGIN_ID.xpi"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $dest
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Validated Gosplugin XPI produced no repository change.' }
          git commit -m 'build(extensions): vendor Gosplugin Firefox XPI'
          git push origin HEAD:agent/gost-tls-poc
