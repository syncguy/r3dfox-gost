name: WinRT source PoC x86

on:
  workflow_dispatch:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - '.github/workflows/winrt-source-poc-x86.yml'
      - 'widget/windows/**'
      - 'toolkit/components/alerts/nsAlertsService.cpp'
      - 'toolkit/system/windowsPackageManager/**'

permissions:
  contents: read

jobs:
  winrt-source-poc-x86:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MOZILLABUILD: C:\mozilla-build
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-winrt-poc-x86
      MACH_NO_TERMINAL_FOOTER: '1'
      MACH_HIDE_DEV_DRIVE_SUGGESTION: '1'

    steps:
      - name: Checkout source PoC branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record identity
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          "run_id=${{ github.run_id }}" | Set-Content diagnostics\identity.txt
          "job=${{ github.job }}" | Add-Content diagnostics\identity.txt
          "sha=${{ github.sha }}" | Add-Content diagnostics\identity.txt
          git rev-parse HEAD | Add-Content diagnostics\identity.txt
          git status --short | Add-Content diagnostics\identity.txt

      - name: GATE - Verify intended source isolation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @(
            'RoActivateInstance',
            'RoGetActivationFactory',
            'WindowsCompareStringOrdinal',
            'WindowsCreateString',
            'WindowsCreateStringReference',
            'WindowsDeleteString',
            'WindowsGetStringRawBuffer'
          )
          $paths = @(
            'widget/windows/ToastNotification.cpp',
            'widget/windows/ToastNotification.h',
            'widget/windows/OSKInputPaneManagerLegacy.cpp',
            'widget/windows/rust',
            'toolkit/components/alerts/nsAlertsService.cpp',
            'toolkit/system/windowsPackageManager'
          )
          $matches = @()
          foreach ($path in $paths) {
            if (Test-Path $path) {
              $matches += Get-ChildItem $path -Recurse -File -ErrorAction SilentlyContinue |
                Select-String -SimpleMatch -Pattern $bad -ErrorAction SilentlyContinue
            }
          }
          if ($matches) {
            $matches | ForEach-Object { "{0}:{1}: {2}" -f $_.Path, $_.LineNumber, $_.Line.Trim() }
            throw 'Forbidden WinRT API references remain in the isolated PoC source paths'
          }

      - name: Repair stale mime_guess vendored checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          if (Test-Path $checksum) {
            $json = Get-Content $checksum -Raw | ConvertFrom-Json
            $files = [ordered]@{}
            foreach ($prop in $json.files.PSObject.Properties) {
              if (Test-Path (Join-Path 'third_party\rust\mime_guess' $prop.Name)) {
                $files[$prop.Name] = $prop.Value
              }
            }
            $fixed = [ordered]@{ files = $files; package = $json.package }
            $fixed | ConvertTo-Json -Compress | Set-Content $checksum -NoNewline
          }

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' -OutFile "$env:TEMP\MozillaBuildSetup.exe"
          Start-Process "$env:TEMP\MozillaBuildSetup.exe" -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }

      - name: Write x86 mozconfig
        shell: powershell
        run: |
          @'
          mk_add_options AUTOCLOBBER=1
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-winrt-poc-x86
          mk_add_options MOZ_PARALLEL_BUILD=4
          mk_add_options MOZ_MAKE_FLAGS="-j4"
          ac_add_options --enable-bootstrap
          ac_add_options --target=i686
          ac_add_options --enable-application=browser
          ac_add_options --disable-artifact-builds
          ac_add_options --disable-debug
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-tests
          ac_add_options --disable-webrtc
          ac_add_options --disable-backgroundtasks
          ac_add_options --disable-notification-server
          ac_add_options --disable-updater
          '@ | Set-Content '.mozconfig-winrt-poc-x86'

      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure x86 object directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 configure 2>&1 | Tee-Object diagnostics\configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare frozen Cargo vendored source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item '.cargo\config.toml.in' '.cargo\config.toml' -Force
          if (-not (Test-Path '.cargo\config.toml')) { throw 'Cargo vendored-source config was not created' }
          cargo metadata --format-version 1 --offline | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build export prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          & $mozmake -C obj-winrt-poc-x86 recurse_pre-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mozmake -C obj-winrt-poc-x86 recurse_export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Compile WinRT-related target objects
        id: compile_winrt_objects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'

          # Windows PowerShell 5.1 promotes native stderr redirected through the
          # pipeline to NativeCommandError.  With ErrorActionPreference=Stop
          # that used to terminate this step on the first clang diagnostic line
          # before Tee-Object could preserve the actual compiler output.  Keep
          # native stderr non-terminating only while each mozmake command runs;
          # the real native exit code remains the gate authority.
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & $mozmake -C obj-winrt-poc-x86 'widget/windows/target-objects' 2>&1 |
              Tee-Object diagnostics\widget-target-objects.log
            $widgetCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedErrorActionPreference
          }
          if ($widgetCode -ne 0) {
            throw "widget/windows target-objects failed with exit code $widgetCode"
          }

          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & $mozmake -C obj-winrt-poc-x86 'toolkit/system/windowsPackageManager/target-objects' 2>&1 |
              Tee-Object diagnostics\package-manager-target-objects.log
            $packageManagerCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $savedErrorActionPreference
          }
          if ($packageManagerCode -ne 0) {
            throw "windowsPackageManager target-objects failed with exit code $packageManagerCode"
          }

      - name: GATE - Disabled legacy paths have no WinRT API references
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpbin = Get-ChildItem "$env:USERPROFILE\.mozbuild\vs" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }

          $forbidden = @(
            'RoActivateInstance',
            'RoGetActivationFactory',
            'WindowsCompareStringOrdinal',
            'WindowsCreateString',
            'WindowsCreateStringReference',
            'WindowsDeleteString',
            'WindowsGetStringRawBuffer'
          )
          $roots = @(
            'obj-winrt-poc-x86\widget\windows',
            'obj-winrt-poc-x86\toolkit\system\windowsPackageManager'
          )
          $objects = @()
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $objects += Get-ChildItem $root -Recurse -Include *.obj,*.o -File
            }
          }
          if (-not $objects) { throw 'No target object files found for WinRT import scan' }

          $hits = @()
          foreach ($obj in $objects) {
            $text = & $dumpbin /symbols $obj.FullName 2>&1
            foreach ($symbol in $forbidden) {
              if ($text -match [regex]::Escape($symbol)) {
                $hits += "{0}: {1}" -f $obj.FullName, $symbol
              }
            }
          }
          $hits | Set-Content diagnostics\forbidden-object-symbols.txt
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_ }
            throw 'Forbidden WinRT API symbol references remain in targeted object files'
          }
          'PASS: no forbidden WinRT API references in targeted object files' |
            Set-Content diagnostics\forbidden-object-symbols.txt

      - name: Inventory targeted objects
        if: always()
        shell: powershell
        run: |
          Get-ChildItem 'obj-winrt-poc-x86\widget\windows','obj-winrt-poc-x86\toolkit\system\windowsPackageManager' -Recurse -Include *.obj,*.o -File -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Format-Table -AutoSize |
            Out-String -Width 240 |
            Set-Content diagnostics\target-object-inventory.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winrt-source-poc-x86-${{ github.run_id }}
          path: diagnostics
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: powershell
        run: |
          @'
          ## WinRT source PoC x86

          - Source isolation gate: see workflow result above.
          - Compile gate: `widget/windows/target-objects` and `toolkit/system/windowsPackageManager/target-objects` must both pass.
          - Forbidden API gate scans only objects produced by those targeted directories.
          - This workflow is intentionally not a full Firefox build.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
