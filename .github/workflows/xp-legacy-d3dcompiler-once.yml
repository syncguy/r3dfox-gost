name: "XP legacy D3DCompiler workflow renderer"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - .github/workflows/xp-legacy-d3dcompiler-once.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Render verified legacy D3DCompiler full-build workflow
        shell: powershell
        env:
          LEGACY_D3D_SOURCE_URI: https://archive.mozilla.org/pub/firefox/releases/52.2.1esr/win32/en-US/Firefox%20Setup%2052.2.1esr.exe
        run: |
          $ErrorActionPreference = 'Stop'
          python build\xp\patch-legacy-d3dcompiler-workflow.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check -- .github/workflows/gost-poc-build-xp-x32.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $clean = 'build\xp\generated-gost-poc-build-xp-x32.yml'
          $trigger = 'build\xp\generated-gost-poc-build-xp-x32-trigger.yml'
          Copy-Item -Force '.github\workflows\gost-poc-build-xp-x32.yml' $clean

          @'
          from pathlib import Path
          src = Path('build/xp/generated-gost-poc-build-xp-x32.yml').read_text(encoding='utf-8')
          old = 'on:\n  workflow_dispatch:\n'
          new = '''on:\n  workflow_dispatch:\n  push:\n    branches:\n      - agent/winrt-source-poc\n    paths:\n      - .github/workflows/gost-poc-build-xp-x32.yml\n'''
          if src.count(old) != 1:
              raise SystemExit(f'workflow trigger anchor count: {src.count(old)}')
          Path('build/xp/generated-gost-poc-build-xp-x32-trigger.yml').write_text(src.replace(old, new, 1), encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff --no-index -- $clean $trigger | Out-Host
          if ($LASTEXITCODE -notin @(0,1)) { exit $LASTEXITCODE }

      - name: Publish rendered workflow blobs outside workflow directory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/xp/generated-gost-poc-build-xp-x32.yml build/xp/generated-gost-poc-build-xp-x32-trigger.yml
          git commit -m 'ci(xp): render legacy D3DCompiler workflow blobs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/winrt-source-poc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
