name: "XP legacy D3DCompiler one-shot setup"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - .github/workflows/xp-legacy-d3dcompiler-once.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve exact legacy Mozilla D3DCompiler_47
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $sources = @(
            'https://archive.mozilla.org/pub/firefox/releases/52.2.1esr/win32/en-US/Firefox%20Setup%2052.2.1esr.exe',
            'https://archive.mozilla.org/pub/firefox/releases/52.0.2/win32/en-US/Firefox%20Setup%2052.0.2.exe',
            'https://archive.mozilla.org/pub/firefox/releases/54.0.1/win32/en-US/Firefox%20Setup%2054.0.1.exe'
          )
          $chosen = $null
          foreach ($uri in $sources) {
            $tag = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($uri))).Substring(0,12)
            $installer = Join-Path $env:RUNNER_TEMP "firefox-$tag.exe"
            $extract = Join-Path $env:RUNNER_TEMP "firefox-$tag"
            try {
              Invoke-WebRequest -Uri $uri -OutFile $installer
              if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
              New-Item -ItemType Directory -Force $extract | Out-Null
              & 7z.exe x $installer "-o$extract" -y | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "7z failed: $LASTEXITCODE" }
              $candidates = @(Get-ChildItem -Path $extract -Recurse -File -Filter 'd3dcompiler_47.dll')
              foreach ($candidate in $candidates) {
                $hash = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLowerInvariant()
                if ($hash -eq $expected) {
                  $chosen = $uri
                  "Validated $($candidate.FullName) SHA256=$hash"
                  break
                }
              }
              if ($chosen) { break }
            } catch {
              Write-Host "Source probe failed for $uri : $($_.Exception.Message)"
            }
          }
          if (-not $chosen) { throw "No official Mozilla installer yielded expected D3DCompiler_47 SHA256 $expected" }
          "LEGACY_D3D_SOURCE_URI=$chosen" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Patch XP full-build workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.github\workflows\gost-poc-build-xp-x32.yml'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          if ($text.Contains('Prepare pinned legacy Firefox XP D3DCompiler_47')) { throw 'Target workflow already contains legacy D3DCompiler experiment' }

          $prepare = @'
      - name: Prepare pinned legacy Firefox XP D3DCompiler_47
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $uri = '__LEGACY_URI__'
          $installer = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler.exe'
          $extract = Join-Path $env:RUNNER_TEMP 'firefox-legacy-d3dcompiler'
          Invoke-WebRequest -Uri $uri -OutFile $installer
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Force $extract | Out-Null
          & 7z.exe x $installer "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Cannot extract pinned legacy Firefox installer: $LASTEXITCODE" }
          $match = $null
          foreach ($candidate in @(Get-ChildItem -Path $extract -Recurse -File -Filter 'd3dcompiler_47.dll')) {
            $hash = (Get-FileHash -Algorithm SHA256 $candidate.FullName).Hash.ToLowerInvariant()
            if ($hash -eq $expected) { $match = $candidate; break }
          }
          if (-not $match) { throw "Pinned Firefox source does not contain expected D3DCompiler_47 SHA256 $expected" }
          "LEGACY_D3DCOMPILER47=$($match.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

'@.Replace('__LEGACY_URI__', $env:LEGACY_D3D_SOURCE_URI)
          $anchorPrepare = "      - name: Prepare pinned MSSPI source`n"
          if (($text.Split($anchorPrepare).Count - 1) -ne 1) { throw 'Prepare-MSSPI anchor mismatch' }
          $text = $text.Replace($anchorPrepare, $prepare + $anchorPrepare)

          $stage = @'
      - name: Stage pinned legacy Firefox XP D3DCompiler_47
        id: stage-legacy-d3dcompiler
        if: steps.stage-runtime.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $bin = Join-Path $env:OBJDIR 'dist\bin'
          $dst = Join-Path $bin 'd3dcompiler_47.dll'
          if (-not (Test-Path $dst)) { throw "Build-produced D3DCompiler_47 missing: $dst" }
          $before = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          Copy-Item -Force $env:LEGACY_D3DCOMPILER47 $dst
          $after = (Get-FileHash -Algorithm SHA256 $dst).Hash.ToLowerInvariant()
          if ($after -ne $expected) { throw "Legacy D3DCompiler_47 stage hash mismatch: $after" }
          $version = (Get-Item $dst).VersionInfo.FileVersion
          if ($version -notlike '10.0.14393.33*') { throw "Unexpected legacy D3DCompiler_47 version: $version" }
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @("source=$env:LEGACY_D3DCOMPILER47", "before_sha256=$before", "after_sha256=$after", "file_version=$version") |
            Set-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

'@
          $retargetOld = "      - name: Retarget dist/bin PE subsystem headers to XP x86`n        id: retarget-pe`n        if: steps.stage-runtime.outcome == 'success'`n"
          $retargetNew = $stage + "      - name: Retarget dist/bin PE subsystem headers to XP x86`n        id: retarget-pe`n        if: steps.stage-legacy-d3dcompiler.outcome == 'success'`n"
          if (($text.Split($retargetOld).Count - 1) -ne 1) { throw 'Retarget anchor mismatch' }
          $text = $text.Replace($retargetOld, $retargetNew)

          $verify = @'
      - name: GATE - Verify legacy D3DCompiler_47 survived packaging
        id: verify-legacy-d3dcompiler
        if: steps.package-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '3a010ee7186086a7f77b6aec3644e05f8495a84895b90572cab8d4f14efa088e'
          $dll = Join-Path $env:OBJDIR 'dist\bin\d3dcompiler_47.dll'
          if (-not (Test-Path $dll)) { throw "Staged D3DCompiler_47 disappeared after package: $dll" }
          $hash = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($hash -ne $expected) { throw "D3DCompiler_47 changed during package: $hash" }
          "post_package_sha256=$hash" | Add-Content -Encoding utf8 diagnostics\legacy-d3dcompiler47.txt

'@
          $runtimeOld = "      - name: Build XP x32 runtime test archive from dist/bin`n        id: runtime-archive`n        if: steps.retarget-pe.outcome == 'success'`n"
          $runtimeNew = $verify + "      - name: Build XP x32 runtime test archive from dist/bin`n        id: runtime-archive`n        if: steps.verify-legacy-d3dcompiler.outcome == 'success'`n"
          if (($text.Split($runtimeOld).Count - 1) -ne 1) { throw 'Runtime archive anchor mismatch' }
          $text = $text.Replace($runtimeOld, $runtimeNew)

          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          git diff --check -- $path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- $path

      - name: Commit workflow change and remove one-shot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item '.github\workflows\xp-legacy-d3dcompiler-once.yml'
          git add .github/workflows/gost-poc-build-xp-x32.yml .github/workflows/xp-legacy-d3dcompiler-once.yml
          git commit -m 'ci(xp): use legacy Firefox D3DCompiler_47'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/winrt-source-poc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TARGET_SHA=$((git rev-parse HEAD).Trim())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Dispatch XP full build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh workflow run gost-poc-build-xp-x32.yml --repo syncguy/r3dfox-gost --ref agent/winrt-source-poc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Dispatched full XP x32 build for $env:TARGET_SHA"
