name: GOST TLS PoC build - repair bootstrap

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/gost-poc-build-thunk.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: agent/gost-tls-poc

      - name: Restore full workflow from parent and repair embedded Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          target = '.github/workflows/gost-poc-build-thunk.yml'
          source = subprocess.check_output(
              ['git', 'show', f'HEAD^:{target}'], text=True, encoding='utf-8'
          )
          if 'GetSystemTimePreciseAsFileTime.obj' not in source or 'GetSystemTimePreciseAsFileTime.obi' not in source:
              raise SystemExit('Parent workflow is missing the smoke-proven precise-time narrow-provider members')

          start_marker = "          anchor = '    if CONFIG[\"CC_TYPE\"] == \"clang-cl\" and not CONFIG[\"DEVELOPER_OPTIONS\"]:"
          end_marker = "          '@ | python -"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Malformed libxul embedded-Python block was not found in parent workflow')

          good_lines = [
              r'''          anchor = '    if CONFIG["CC_TYPE"] == "clang-cl" and not CONFIG["DEVELOPER_OPTIONS"]:\n        LDFLAGS += ["-time"]\n' ''',
              "          if text.count(anchor) != 1:",
              "              raise SystemExit(f'Expected exactly one libxul clang-cl LDFLAGS anchor, found {text.count(anchor)}')",
              r'''          yy_synch = os.environ['THUNK_YY_SYNCH_LIB'].replace('\\', '/')''',
              r'''          narrow = os.environ['NARROW_PROCESSPRNG_LIB'].replace('\\', '/')''',
              "          replacement = anchor + (",
              r'''              '    # r3dfox-gost Win7 scale test. Keep Firefox on its native /MD CRT model.\n' ''',
              r'''              '    # The complete YY kernel32.lib previously collided with Rust raw-dylib\n' ''',
              r'''              '    # LockResource at xul.dll scale. Supply only synchronization.lib and the\n' ''',
              r'''              '    # smoke-proven narrow ProcessPrng/precise-time provider before STATIC_LIBS/gkrust.\n' ''',
              r'''              '    if CONFIG["OS_ARCH"] == "WINNT":\n' ''',
              r'''              '        LDFLAGS += [\n' ''',
              r'''              f'            "{yy_synch}",\n' ''',
              r'''              f'            "{narrow}",\n' ''',
              r'''              '            "-VERBOSE",\n' ''',
              r'''              '        ]\n' ''',
              "          )",
              r'''          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8', newline='\n')''',
          ]
          repaired_block = '\n'.join(line.rstrip() for line in good_lines) + '\n'
          repaired = source[:start] + repaired_block + source[end:]
          Path(target).write_text(repaired, encoding='utf-8', newline='\n')
          PY

          git diff --check -- .github/workflows/gost-poc-build-thunk.yml
          ruby -e "require 'yaml'; YAML.load_file(ARGV[0], aliases: true)" .github/workflows/gost-poc-build-thunk.yml
          grep -F "GetSystemTimePreciseAsFileTime.obj" .github/workflows/gost-poc-build-thunk.yml
          grep -F "GetSystemTimePreciseAsFileTime.obi" .github/workflows/gost-poc-build-thunk.yml
          grep -F "YY_Thunks_GetSystemTimePreciseAsFileTime" .github/workflows/gost-poc-build-thunk.yml
          grep -F "NARROW_PROCESSPRNG_LIB" .github/workflows/gost-poc-build-thunk.yml

      - name: Commit repaired full workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/repair-gost-poc-build-thunk.yml || true
          git add .github/workflows/gost-poc-build-thunk.yml
          git commit -m "ci: fix precise-time thunk workflow syntax"
          git push origin HEAD:agent/gost-tls-poc

      - name: Dispatch repaired full test build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/gost-poc-build-thunk.yml/dispatches \
            -f ref=agent/gost-tls-poc
