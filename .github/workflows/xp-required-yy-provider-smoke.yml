name: XP required YY provider smoke

on:
  workflow_dispatch:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - ".github/workflows/xp-required-yy-provider-smoke.yml"
      - "build/xp/build-narrow-yy-xp-provider.ps1"

permissions:
  contents: read

env:
  MSVCR14X_REPO: "https://github.com/Chuyu-Team/msvcr14x.git"
  MSVCR14X_SHA: "6495947edbdd8f5dc4b2ddb8ca0cb5dbdac05384"
  YY_THUNKS_VERSION: "1.2.2"
  YY_THUNKS_TARGET: "5.1.2600.0"
  WINDOWS_XP_SUBSYSTEM: "5.01"
  RUST_TOOLCHAIN: "nightly-2026-08-20"
  RUST_TARGET: "i686-pc-windows-msvc"

jobs:
  required-yy-smoke:
    name: msvcr14x + Rust + required narrow YY / XP x86
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4

      - name: Enable MSVC x86 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGET }}

      - name: Prepare diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          @(
            "repo=$env:GITHUB_REPOSITORY"
            "test_commit=$env:GITHUB_SHA"
            "baseline_run=33138244191"
            "baseline_commit=d78137a931145af877dc458b01e494ad0467723d"
            "compatibility_target=Windows XP SP3 x86"
            "pe_subsystem_min_version=$env:WINDOWS_XP_SUBSYSTEM"
            "msvcr14x_commit=$env:MSVCR14X_SHA"
            "yy_thunks_version=$env:YY_THUNKS_VERSION"
            "yy_thunks_target=$env:YY_THUNKS_TARGET"
            "rust_toolchain=$env:RUST_TOOLCHAIN"
            "rust_target=$env:RUST_TARGET"
          ) | Set-Content -Encoding utf8 diagnostics\identity.txt
          cmd /c "where cl && cl 2>&1" | Set-Content -Encoding utf8 diagnostics\cl-version.txt
          rustc -Vv | Set-Content -Encoding utf8 diagnostics\rustc-version.txt

      - name: Fetch and build pinned msvcr14x Release x86
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'msvcr14x'
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          git init $root
          git -C $root remote add origin $env:MSVCR14X_REPO
          git -C $root fetch --depth=1 origin $env:MSVCR14X_SHA
          git -C $root checkout --detach FETCH_HEAD
          git -C $root submodule update --init --recursive --depth 1
          $actual = (git -C $root rev-parse HEAD).Trim()
          if ($actual -ne $env:MSVCR14X_SHA) { throw "Unexpected msvcr14x commit: $actual" }

          & msbuild.exe (Join-Path $root 'msvcr14x.sln') /m /t:Build '/p:Configuration=Release;Platform=x86' -r "/bl:$env:GITHUB_WORKSPACE\diagnostics\msvcr14x-release-x86.binlog"
          if ($LASTEXITCODE -ne 0) { throw "msvcr14x build failed: $LASTEXITCODE" }

          $required = @('ucrtbase.dll','ucrt.lib','vcruntime.lib','msvcprt.lib','msvcp140.dll')
          $release = $null
          $candidateDirs = @(Get-ChildItem -Path $root -Recurse -File -Filter 'ucrtbase.dll' |
            ForEach-Object { $_.Directory.FullName } | Sort-Object -Unique)
          foreach ($candidate in $candidateDirs) {
            $missing = @($required | Where-Object { -not (Test-Path (Join-Path $candidate $_)) })
            if ($missing.Count -gt 0) { continue }
            $headers = (& dumpbin.exe /nologo /headers (Join-Path $candidate 'ucrtbase.dll') 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -and $headers -match '(?im)^\s*14C machine \(x86\)') {
              $release = $candidate
              break
            }
          }
          if (-not $release) { throw 'Cannot locate complete x86 msvcr14x Release output' }
          "MSVCR14X_RELEASE=$release" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -LiteralPath $release -File | Sort-Object Name |
            Select-Object Name,Length | Format-Table -AutoSize | Out-String -Width 240 |
            Set-Content -Encoding utf8 diagnostics\msvcr14x-release-files.txt

      - name: Download YY-Thunks 1.2.2 XP x86 libraries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Headers @{ 'User-Agent' = 'r3dfox-gost-ci' } -Uri "https://api.github.com/repos/Chuyu-Team/YY-Thunks/releases/tags/v$env:YY_THUNKS_VERSION"
          $asset = $release.assets | Where-Object { $_.name -match '(?i)Lib.*\.zip$|(?i)-Lib\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "YY-Thunks v$env:YY_THUNKS_VERSION Lib asset not found" }
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          $root = Join-Path $env:RUNNER_TEMP 'yy-thunks-package'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          Expand-Archive -Path $zip -DestinationPath $root

          $targetPattern = [regex]::Escape($env:YY_THUNKS_TARGET)
          $yyLib = Get-ChildItem -Path $root -Recurse -Directory |
            Where-Object { $_.FullName -match "(?i)[\\/]Lib[\\/]$targetPattern[\\/]x86$" } |
            Select-Object -First 1
          if (-not $yyLib) { throw "YY-Thunks Lib/$env:YY_THUNKS_TARGET/x86 not found" }

          $kernel32 = Join-Path $yyLib.FullName 'kernel32.lib'
          $synch = Join-Path $yyLib.FullName 'synchronization.lib'
          if (-not (Test-Path $kernel32) -or -not (Test-Path $synch)) { throw 'Required YY XP x86 libraries are missing' }
          "THUNK_YY_LIB=$($yyLib.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_KERNEL32_LIB=$kernel32" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "THUNK_YY_SYNCH_LIB=$synch" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "yy_lib_asset=$($asset.name) size=$($asset.size) digest=$($asset.digest)" | Add-Content diagnostics\identity.txt

      - name: Build required narrow YY XP provider
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'xp-required-yy-provider-smoke'
          $provider = Join-Path $work 'yy-xp-required-provider.lib'
          & .\build\xp\build-narrow-yy-xp-provider.ps1 `
            -Kernel32Lib $env:THUNK_YY_KERNEL32_LIB `
            -Target $env:YY_THUNKS_TARGET `
            -WorkDir $work `
            -OutputLib $provider | Tee-Object diagnostics\provider-build.txt
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $provider)) { throw 'Required narrow YY provider build failed' }
          "SMOKE_DIR=$work" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "NARROW_YY_LIB=$provider" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile observed XP API /MD C++ probe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SMOKE_DIR 'cpp-helper.cpp'
          $obj = Join-Path $env:SMOKE_DIR 'cpp-helper.obj'
          @'
          #define WINVER 0x0601
          #define _WIN32_WINNT 0x0601
          #include <windows.h>
          #include <stdint.h>
          #include <string>
          #include <vector>

          static volatile uintptr_t g_required_xp_api_refs[] = {
              reinterpret_cast<uintptr_t>(&AcquireSRWLockExclusive),
              reinterpret_cast<uintptr_t>(&AcquireSRWLockShared),
              reinterpret_cast<uintptr_t>(&CancelIoEx),
              reinterpret_cast<uintptr_t>(&CompareStringOrdinal),
              reinterpret_cast<uintptr_t>(&FlsAlloc),
              reinterpret_cast<uintptr_t>(&FlsFree),
              reinterpret_cast<uintptr_t>(&FlsGetValue),
              reinterpret_cast<uintptr_t>(&FlsSetValue),
              reinterpret_cast<uintptr_t>(&GetCurrentProcessorNumber),
              reinterpret_cast<uintptr_t>(&GetFileInformationByHandleEx),
              reinterpret_cast<uintptr_t>(&GetFinalPathNameByHandleW),
              reinterpret_cast<uintptr_t>(&GetLocaleInfoEx),
              reinterpret_cast<uintptr_t>(&GetTickCount64),
              reinterpret_cast<uintptr_t>(&InitializeConditionVariable),
              reinterpret_cast<uintptr_t>(&InitializeCriticalSectionEx),
              reinterpret_cast<uintptr_t>(&InitializeSRWLock),
              reinterpret_cast<uintptr_t>(&LCIDToLocaleName),
              reinterpret_cast<uintptr_t>(&LocaleNameToLCID),
              reinterpret_cast<uintptr_t>(&ReleaseSRWLockExclusive),
              reinterpret_cast<uintptr_t>(&ReleaseSRWLockShared),
              reinterpret_cast<uintptr_t>(&SetFileInformationByHandle),
              reinterpret_cast<uintptr_t>(&SleepConditionVariableCS),
              reinterpret_cast<uintptr_t>(&SleepConditionVariableSRW),
              reinterpret_cast<uintptr_t>(&TryAcquireSRWLockExclusive),
              reinterpret_cast<uintptr_t>(&WakeAllConditionVariable),
              reinterpret_cast<uintptr_t>(&WakeConditionVariable),
          };

          extern "C" uintptr_t cpp_probe() {
              std::vector<std::string> v{"msvcr14x", "rust", "yy-xp-required"};
              uintptr_t acc = v.size();
              for (auto p : g_required_xp_api_refs) {
                  acc ^= p;
              }
              return acc;
          }
          '@ | Set-Content -Encoding utf8 $src
          & cl.exe /nologo /c /MD /O2 /EHsc /std:c++20 $src "/Fo:$obj" 2>&1 | Tee-Object -FilePath diagnostics\cpp-helper-compile.log
          if ($LASTEXITCODE -ne 0) { throw "C++ helper compile failed: $LASTEXITCODE" }
          & dumpbin.exe /nologo /directives $obj 2>&1 | Set-Content -Encoding utf8 diagnostics\cpp-helper-directives.txt
          $directives = Get-Content diagnostics\cpp-helper-directives.txt -Raw
          if ($directives.IndexOf('RuntimeLibrary=MD_DynamicRelease', [System.StringComparison]::Ordinal) -lt 0) {
            throw 'C++ helper is not MD_DynamicRelease'
          }
          "CPP_HELPER_OBJ=$obj" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build representative Rust archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:SMOKE_DIR 'probe.rs'
          $rlib = Join-Path $env:SMOKE_DIR 'libxp_required_yy_probe.rlib'
          @'
          use std::collections::hash_map::RandomState;
          use std::ffi::c_void;
          use std::hint::black_box;
          use std::sync::{Arc, Condvar, Mutex, Once, RwLock};
          use std::thread;
          use std::time::Duration;

          #[repr(C)]
          struct FileTime { low: u32, high: u32 }

          #[link(name = "kernel32", kind = "raw-dylib")]
          unsafe extern "system" {
              fn GetSystemTimePreciseAsFileTime(file_time: *mut FileTime);
          }

          #[link(name = "kernel32", kind = "raw-dylib", import_name_type = "undecorated")]
          unsafe extern "system" {
              fn LockResource(hmem: *mut c_void) -> *mut c_void;
          }

          #[inline(never)]
          pub fn run_probe() {
              black_box(RandomState::new());
              static INIT: Once = Once::new();
              INIT.call_once(|| black_box(()));
              let rw = RwLock::new(1usize);
              *rw.write().unwrap() += 1;
              black_box(*rw.read().unwrap());
              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let waiter_pair = Arc::clone(&pair);
              let waiter = thread::spawn(move || {
                  let (lock, cv) = &*waiter_pair;
                  let guard = lock.lock().unwrap();
                  let (_guard, _timeout) = cv.wait_timeout_while(guard, Duration::from_millis(1), |ready| !*ready).unwrap();
              });
              {
                  let (lock, cv) = &*pair;
                  let mut ready = lock.lock().unwrap();
                  *ready = true;
                  cv.notify_all();
              }
              waiter.join().unwrap();
              let mut ft = FileTime { low: 0, high: 0 };
              unsafe { GetSystemTimePreciseAsFileTime(&mut ft); }
              black_box((ft.low, ft.high));
              black_box(LockResource as unsafe extern "system" fn(*mut c_void) -> *mut c_void);
          }
          '@ | Set-Content -Encoding utf8 $src
          & rustc $src --crate-name xp_required_yy_probe --crate-type rlib --edition 2021 --target $env:RUST_TARGET -O -o $rlib
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $rlib)) { throw "Rust archive build failed: $LASTEXITCODE" }
          "RUST_PROBE_RLIB=$rlib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Link one XP x86 required-API coexistence candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cmd = Get-Command lld-link.exe -ErrorAction SilentlyContinue
          $lld = if ($cmd) { $cmd.Source } else { 'C:\Program Files\LLVM\bin\lld-link.exe' }
          if (-not (Test-Path $lld)) { throw "lld-link.exe not found: $lld" }

          $main = Join-Path $env:SMOKE_DIR 'main.rs'
          $exe = Join-Path $env:SMOKE_DIR 'xp-required-yy-provider-smoke.exe'
          $wrapper = Join-Path $env:SMOKE_DIR 'lld-xp-required-yy.cmd'
          $linkLog = Join-Path $env:SMOKE_DIR 'final-link-command.txt'
          $map = Join-Path $env:SMOKE_DIR 'final-link.map'
          @'
          extern crate xp_required_yy_probe;
          unsafe extern "C" { fn cpp_probe() -> usize; }
          fn main() {
              xp_required_yy_probe::run_probe();
              let value = unsafe { cpp_probe() };
              std::hint::black_box(value);
          }
          '@ | Set-Content -Encoding utf8 $main
          @"
          @echo off
          >"$linkLog" echo "$lld" "-LIBPATH:$env:MSVCR14X_RELEASE" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_YY_LIB" %*
          "$lld" "-LIBPATH:$env:MSVCR14X_RELEASE" "$env:THUNK_YY_SYNCH_LIB" "$env:NARROW_YY_LIB" %*
          exit /b %ERRORLEVEL%
          "@ | Set-Content -Encoding ascii $wrapper

          & rustc $main --edition 2021 --target $env:RUST_TARGET -O `
            --extern "xp_required_yy_probe=$env:RUST_PROBE_RLIB" `
            "-Clinker=$wrapper" `
            "-Clink-arg=$env:CPP_HELPER_OBJ" `
            "-Clink-arg=/map:$map" `
            "-Clink-arg=/subsystem:console,$env:WINDOWS_XP_SUBSYSTEM" `
            -o $exe 2>&1 | Tee-Object -FilePath diagnostics\final-link-output.txt
          if ($LASTEXITCODE -ne 0) { throw "XP x86 required-API link failed: $LASTEXITCODE" }

          $required = @(
            'AcquireSRWLockExclusive','AcquireSRWLockShared','CancelIoEx','CompareStringOrdinal',
            'FlsAlloc','FlsFree','FlsGetValue','FlsSetValue','GetCurrentProcessorNumber',
            'GetFileInformationByHandleEx','GetFinalPathNameByHandleW','GetLocaleInfoEx',
            'GetSystemTimePreciseAsFileTime','GetTickCount64','InitializeConditionVariable',
            'InitializeCriticalSectionEx','InitializeSRWLock','IsThreadAFiber','LCIDToLocaleName',
            'LocaleNameToLCID','ProcessPrng','ReleaseSRWLockExclusive','ReleaseSRWLockShared',
            'SetFileInformationByHandle','SetThreadStackGuarantee','SleepConditionVariableCS',
            'SleepConditionVariableSRW','TryAcquireSRWLockExclusive','WakeAllConditionVariable',
            'WakeConditionVariable'
          )
          $mapText = Get-Content $map -Raw
          foreach ($api in $required) {
            if ($mapText.IndexOf("YY_Thunks_$api", [System.StringComparison]::Ordinal) -lt 0) {
              throw "Final link did not select YY_Thunks_$api"
            }
          }
          $logged = Get-Content $linkLog -Raw
          if ($logged.IndexOf($env:THUNK_YY_KERNEL32_LIB, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw 'Full YY kernel32.lib reached final link command'
          }
          if ($logged.IndexOf("-LIBPATH:$env:THUNK_YY_LIB", [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
            throw 'Full YY library directory reached final LIBPATH'
          }
          "SMOKE_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage XP x86 smoke runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:SMOKE_DIR 'xp-x86-runtime'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item -Force $env:SMOKE_EXE (Join-Path $bundle (Split-Path $env:SMOKE_EXE -Leaf))
          foreach ($dll in @('ucrtbase.dll','msvcp140.dll')) {
            $src = Join-Path $env:MSVCR14X_RELEASE $dll
            if (-not (Test-Path $src)) { throw "Required msvcr14x runtime missing: $src" }
            Copy-Item -Force $src (Join-Path $bundle $dll)
          }
          "RUNTIME_BUNDLE=$bundle" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: GATE - Require XP x86 PE floor and reject selected post-XP imports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Normalize-ImportName([string]$name) {
            if ($name -match '^_([A-Za-z][A-Za-z0-9_]*)@[0-9]+$') { return $matches[1] }
            return $name
          }

          function Read-Imports([string]$binary, [string]$rawPath) {
            $raw = @(& dumpbin.exe /nologo /imports $binary 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /imports failed for $binary" }
            $raw | Set-Content -Encoding utf8 $rawPath
            $dlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $apis = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $mode = 'none'
            foreach ($line in $raw) {
              if ($line -match '^\s*Section contains the following imports:\s*$') { $mode = 'direct'; continue }
              if ($line -match '^\s*Section contains the following delay load imports:\s*$') { $mode = 'delay'; continue }
              if ($mode -ne 'direct') { continue }
              if ($line -match '^\s{4}([A-Za-z0-9_.-]+\.dll)\s*$') { [void]$dlls.Add($matches[1]); continue }
              $entry = $line.Trim()
              if ($entry -match '^[0-9A-Fa-f]+\s+(\S+)$') { [void]$apis.Add((Normalize-ImportName $matches[1])) }
            }
            return @{ Dlls=$dlls; Apis=$apis }
          }

          $forbiddenDllPatterns = @(
            '^(?i)(api-ms-win-|ext-ms-)', '^(?i)KERNELBASE\.dll$',
            '^(?i)BCRYPT(?:PRIMITIVES)?\.dll$', '^(?i)COMBASE\.dll$',
            '^(?i)NCRYPT\.dll$', '^(?i)VCRUNTIME140(?:_1)?\.dll$'
          )
          $forbiddenApis = @(
            'AcquireSRWLockExclusive','AcquireSRWLockShared','CancelIoEx','CompareStringOrdinal',
            'FlsAlloc','FlsFree','FlsGetValue','FlsSetValue','GetCurrentProcessorNumber',
            'GetFileInformationByHandleEx','GetFinalPathNameByHandleW','GetLocaleInfoEx',
            'GetSystemTimePreciseAsFileTime','GetTickCount64','InitializeConditionVariable',
            'InitializeCriticalSectionEx','InitializeSRWLock','IsThreadAFiber','LCIDToLocaleName',
            'LocaleNameToLCID','ProcessPrng','ReleaseSRWLockExclusive','ReleaseSRWLockShared',
            'SetFileInformationByHandle','SetThreadStackGuarantee','SleepConditionVariableCS',
            'SleepConditionVariableSRW','TryAcquireSRWLockExclusive','WakeAllConditionVariable',
            'WakeConditionVariable'
          )

          $hits = [System.Collections.Generic.List[string]]::new()
          $rows = [System.Collections.Generic.List[string]]::new()
          foreach ($binary in Get-ChildItem -LiteralPath $env:RUNTIME_BUNDLE -File | Sort-Object Name) {
            $headers = @(& dumpbin.exe /nologo /headers $binary.FullName 2>&1)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed for $($binary.FullName)" }
            $headers | Set-Content -Encoding utf8 (Join-Path diagnostics "$($binary.Name)-headers.txt")
            $machine = $headers | Where-Object { $_ -match '(?i)^\s*[0-9A-F]+ machine ' } | Select-Object -First 1
            if (-not $machine -or $machine -notmatch '(?i)^\s*14C machine \(x86\)') { throw "$($binary.Name) is not PE x86" }
            $versionLine = $headers | Where-Object { $_ -match '(?i)subsystem version' } | Select-Object -First 1
            if (-not $versionLine -or $versionLine -notmatch '^\s*([0-9]+)\.([0-9]+)\s+subsystem version') { throw "Cannot parse subsystem version for $($binary.Name)" }
            $version = [version]("$([int]$matches[1]).$([int]$matches[2])")
            if ($version -gt [version]'5.1') { throw "$($binary.Name) requires subsystem $version, newer than XP" }

            $imports = Read-Imports $binary.FullName (Join-Path diagnostics "$($binary.Name)-imports.txt")
            foreach ($dll in @($imports.Dlls | Sort-Object)) {
              $rows.Add("$($binary.Name)|DLL|$dll")
              foreach ($pattern in $forbiddenDllPatterns) {
                if ($dll -match $pattern) { $hits.Add("$($binary.Name)|DLL|$dll"); break }
              }
            }
            foreach ($api in @($imports.Apis | Sort-Object)) {
              $rows.Add("$($binary.Name)|API|$api")
              if ($forbiddenApis -contains $api) { $hits.Add("$($binary.Name)|API|$api") }
            }

            if ($binary.Extension -eq '.exe') {
              if (-not $imports.Dlls.Contains('KERNEL32.dll')) { throw 'KERNEL32.dll positive control missing' }
              if (-not $imports.Dlls.Contains('ucrtbase.dll')) { throw 'ucrtbase.dll was not selected' }
              if (-not $imports.Dlls.Contains('msvcp140.dll')) { throw 'msvcp140.dll was not selected' }
              if (-not $imports.Apis.Contains('LockResource')) { throw 'LockResource positive control missing' }
            }
          }
          $rows | Set-Content -Encoding utf8 diagnostics\all-direct-imports.txt
          $hits | Sort-Object -Unique | Set-Content -Encoding utf8 diagnostics\xp-forbidden-direct-imports.txt
          if ($hits.Count -gt 0) { throw 'Selected direct post-XP imports survived; see diagnostics/xp-forbidden-direct-imports.txt' }

      - name: Run coexistence probe on Windows 2022 runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -LiteralPath $env:RUNTIME_BUNDLE -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Smoke executable missing' }
          Push-Location $env:RUNTIME_BUNDLE
          try {
            & $exe.FullName 2>&1 | Tee-Object -FilePath (Join-Path $env:GITHUB_WORKSPACE 'diagnostics\run-windows-2022.txt')
            if ($LASTEXITCODE -ne 0) { throw "Probe execution failed: $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Upload XP required YY runtime bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-required-yy-provider-runtime
          retention-days: 14
          if-no-files-found: warn
          path: ${{ env.RUNTIME_BUNDLE }}\**\*

      - name: Upload XP required YY diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xp-required-yy-provider-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            diagnostics\**\*
            ${{ runner.temp }}\xp-required-yy-provider-smoke\**\*

      - name: GATE - Summarize required YY provider result
        shell: powershell
        run: |
          "## XP required narrow YY provider smoke: PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Baseline: successful coexistence run 33138244191 / d78137a931145af877dc458b01e494ad0467723d." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Scope: 26 post-XP APIs observed in run 33310150314 plus four previously proven Rust compatibility entries." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Provider remains physically narrow: selected .obj/.obi pairs plus the common YY implementation; complete kernel32.lib is not linked." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Target floor: Windows XP SP3 x86 / PE subsystem 5.01." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Real XP execution and full Firefox integration remain separate gates." | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
