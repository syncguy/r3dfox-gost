name: "One-shot materialize XP path-normalized workflow"

on:
  push:
    branches:
      - agent/winrt-source-poc
    paths:
      - .github/workflows/xp-x32-fix-path-normalization.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: agent/winrt-source-poc
    steps:
      - name: Materialize path-normalized workflow
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/gost-poc-build-xp-x32.yml'
          temp='tmp/gost-poc-build-xp-x32.path-normalized.yml'
          gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$TARGET_BRANCH" > /tmp/file.json
          python3 - <<'PY'
          import base64, json
          obj=json.load(open('/tmp/file.json'))
          text=base64.b64decode(obj['content']).decode('utf-8')
          replacements=[
            (
              "          $patch = Get-Content xp-x32-core-linker-patch.diff -Raw\n",
              "          $patch = Get-Content xp-x32-core-linker-patch.diff -Raw\n          $patchNormalized = $patch.Replace('\\\\', '/')\n          $fullKernel32 = $env:THUNK_YY_KERNEL32_LIB.Replace('\\\\', '/')\n",
            ),
            (
              "          if ($patch.IndexOf($env:THUNK_YY_KERNEL32_LIB, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {\n",
              "          if ($patchNormalized.IndexOf($fullKernel32, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {\n",
            ),
            (
              "          foreach ($required in @($env:NARROW_YY_LIB, $env:THUNK_YY_SYNCH_LIB)) {\n",
              "          foreach ($required in @($env:NARROW_YY_LIB, $env:THUNK_YY_SYNCH_LIB)) {\n            $requiredNormalized = $required.Replace('\\\\', '/')\n",
            ),
            (
              "            if ($patch.IndexOf($required, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {\n",
              "            if ($patchNormalized.IndexOf($requiredNormalized, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {\n",
            ),
          ]
          for old,new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, got {text.count(old)}')
              text=text.replace(old,new,1)
          open('/tmp/patched.yml','w',encoding='utf-8',newline='').write(text)
          PY
          content=$(base64 -w0 /tmp/patched.yml)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$temp" \
            -f message='ci(xp): materialize path-normalized workflow' \
            -f branch="$TARGET_BRANCH" \
            -f content="$content" >/dev/null
