name: CryptoPro Mozilla packaging smoke

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - "r3dfox/extensions/ru.cryptopro.nmcades@cryptopro.ru.xpi"
      - ".github/workflows/cryptopro-mozilla-packaging-smoke.yml"

permissions:
  contents: read

jobs:
  cryptopro-mozilla-packaging:
    name: Windows x64 / CryptoPro real Firefox packaging
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      MOZILLABUILD: C:\mozilla-build
      MOZILLABUILD_VERSION: "4.2.1"
      MOZCONFIG: ${{ github.workspace }}\.mozconfig-gost
      MACH_NO_TERMINAL_FOOTER: "1"
      MACH_HIDE_DEV_DRIVE_SUGGESTION: "1"
      NIGHTLY_TOOLCHAIN: "nightly-2026-08-20"
      RUST_TARGET_WIN7: "x86_64-win7-windows-msvc"
      EXTENSION_ID: ru.cryptopro.nmcades@cryptopro.ru
      FALLBACK_XPI: r3dfox\extensions\ru.cryptopro.nmcades@cryptopro.ru.xpi
      OFFICIAL_URL: https://www.cryptopro.ru/sites/default/files/products/cades/extensions/firefox_cryptopro_extension_latest.xpi

    steps:
      - name: Checkout r3dfox-gost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: GATE - Select CryptoPro XPI and prepare working tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $selected = Join-Path $env:RUNNER_TEMP 'cryptopro-selected.xpi'
          python build\update-cryptopro-extension.py `
            --fallback $env:FALLBACK_XPI `
            --url $env:OFFICIAL_URL `
            --timeout 30 `
            --output $selected `
            --metadata cryptopro-extension-selection.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $meta = Get-Content cryptopro-extension-selection.json -Raw | ConvertFrom-Json
          if ($meta.selected.id -ne $env:EXTENSION_ID) { throw 'Selected CryptoPro extension ID mismatch.' }
          Copy-Item -Force $selected $env:FALLBACK_XPI
          $selectedHash = (Get-FileHash -Algorithm SHA256 $selected).Hash.ToLowerInvariant()
          $workingHash = (Get-FileHash -Algorithm SHA256 $env:FALLBACK_XPI).Hash.ToLowerInvariant()
          if ($selectedHash -ne $workingHash) { throw 'Working-tree XPI differs from selected XPI.' }
          "CRYPTOPRO_SELECTED_XPI=$selected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CRYPTOPRO_SELECTED_SHA256=$selectedHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CryptoPro source=$($meta.source) version=$($meta.selected.version) sha256=$selectedHash"

      - name: Normalize upstream JSContext include order
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'js\src\vm\JSContext.cpp'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)
          $dump = '#include "js/friend/DumpFunctions.h"  // for stack trace utilities'
          $errors = '#include "js/friend/ErrorMessages.h"  // js::GetErrorMessage, JSMSG_*'
          $printer = '#include "js/Printer.h"               // for FixedBufferPrinter'
          $printf = '#include "js/Printf.h"'
          foreach ($line in @($dump, $printer)) { while ($lines.Remove($line)) { } }
          $errorsIndex = $lines.IndexOf($errors)
          $printfIndex = $lines.IndexOf($printf)
          if ($errorsIndex -lt 0 -or $printfIndex -lt 0) { throw 'Expected JSContext include anchors were not found.' }
          $lines.Insert($errorsIndex, $dump)
          $printfIndex = $lines.IndexOf($printf)
          $lines.Insert($printfIndex, $printer)
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($path, $lines, $utf8NoBom)
          git diff -- $path

      - name: GATE - SpiderMonkey style check
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python config\check_spidermonkey_style.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Plan pagefile placement
        id: pagefile-plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }
          Write-Host "Existing active pagefile total: $activeMB MB"
          $active | Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | Format-Table -AutoSize
          if ($activeMB -ge 20480) {
            'need=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $activeRoots = @($active | ForEach-Object {
            if ($_.Name -match '^([A-Za-z]:)\\') { $matches[1].ToUpperInvariant() }
          })
          $candidate = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Where-Object { ($activeRoots -notcontains $_.DeviceID.ToUpperInvariant()) -and $_.FreeSpace -ge 30GB } |
            Sort-Object FreeSpace -Descending |
            Select-Object -First 1
          if (-not $candidate) { throw 'No non-active fixed drive with at least 30 GB free was found for pagefile.' }
          Write-Host "Selected pagefile drive: $($candidate.DeviceID), free=$([math]::Round($candidate.FreeSpace / 1GB, 2)) GB"
          'need=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "disk=$($candidate.DeviceID)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Configure 24 GB pagefile on non-active drive
        if: steps.pagefile-plan.outputs.need == 'true'
        uses: al-cheb/configure-pagefile-action@v1.5
        with:
          minimum-size: 24GB
          maximum-size: 24GB
          disk-root: ${{ steps.pagefile-plan.outputs.disk }}

      - name: GATE - Verify active pagefile after provisioning
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $active = @(Get-CimInstance Win32_PageFileUsage)
          $activeMB = ($active | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }
          $active | Select-Object Name, AllocatedBaseSize, CurrentUsage, PeakUsage | Format-Table -AutoSize
          Write-Host "Active pagefile total: $activeMB MB"
          if ($activeMB -lt 20480) { throw "Build blocked: active pagefile is only $activeMB MB." }

      - name: Repair stale mime_guess vendored checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mime = 'third_party\rust\mime_guess\src\mime_types.rs'
          $checksum = 'third_party\rust\mime_guess\.cargo-checksum.json'
          $stale = '57ee8db84eb0fc4f06a3eac0da8c730a334cb99a7e81e60413f5febd886d91f4'
          $expected = '1579ebd4fae3e0e8b1fe2d7677165868e6ba856c5e587538d9cb7b478a91078b'
          $actual = (Get-FileHash -Algorithm SHA256 $mime).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Unexpected mime_guess source hash: $actual" }
          $text = [System.IO.File]::ReadAllText($checksum)
          if (-not $text.Contains($stale)) { throw 'Expected stale mime_guess checksum was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($checksum, $text.Replace($stale, $expected), $utf8NoBom)

      - name: Cache MozillaBuild installer
        id: cache-mozillabuild
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}\MozillaBuild\MozillaBuildSetup.exe
          key: mozillabuild-${{ runner.os }}-${{ env.MOZILLABUILD_VERSION }}

      - name: Download MozillaBuild installer
        if: steps.cache-mozillabuild.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-$env:MOZILLABUILD_VERSION.exe" -OutFile (Join-Path $dir 'MozillaBuildSetup.exe')

      - name: Install MozillaBuild
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TOOL_CACHE 'MozillaBuild\MozillaBuildSetup.exe'
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\start-shell.bat')) { throw 'MozillaBuild installation failed' }
          Get-Content 'C:\mozilla-build\VERSION'

      - name: Prepare pinned MSSPI source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msspi = Join-Path $env:RUNNER_TEMP 'msspi'
          git init $msspi
          git -C $msspi remote add origin https://github.com/deemru/msspi.git
          git -C $msspi fetch --depth=1 origin f1ae7bdb26bde1aab4e6ac9a293890b0f14a6232
          git -C $msspi checkout --detach FETCH_HEAD
          $dst = 'security\manager\ssl\msspi'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item -Recurse -Force "$msspi\src" "$dst\src"
          Copy-Item -Recurse -Force "$msspi\third_party" "$dst\third_party"
          $msspiCpp = Join-Path $dst 'src\msspi.cpp'
          $source = [System.IO.File]::ReadAllText($msspiCpp)
          if (-not $source.Contains('#include <Windows.h>')) { throw 'Expected MSSPI Windows.h include was not found' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($msspiCpp, $source.Replace('#include <Windows.h>', '#include <windows.h>'), $utf8NoBom)

      - name: Register GOST and MSSPI sources in moz.build
        shell: powershell
        run: |
          @'

          # r3dfox-gost PoC: alternative TLS transport backed by Windows MSSPI.
          UNIFIED_SOURCES += [
              "GostSocketControl.cpp",
              "GostTLSService.cpp",
              "nsGostSSLIOLayer.cpp",
          ]
          if CONFIG["OS_ARCH"] == "WINNT":
              SOURCES += ["msspi/src/msspi.cpp"]
              LOCAL_INCLUDES += ["msspi/src", "msspi/third_party/cprocsp/include"]
          '@ | Add-Content 'security\manager\ssl\moz.build'

      - name: Write release mozconfig
        shell: powershell
        run: |
          @'
          mk_add_options AUTOCLOBBER=1
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-gost-win64
          mk_add_options MOZ_PARALLEL_BUILD=2
          mk_add_options MOZ_MAKE_FLAGS="-j2"
          ac_add_options --enable-bootstrap
          ac_add_options --target=x86_64
          ac_add_options --disable-cargo-incremental
          ac_add_options --enable-application=browser
          ac_add_options --disable-artifact-builds
          ac_add_options --enable-official-branding
          ac_add_options --disable-debug
          ac_add_options --disable-debug-js-modules
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-tests
          ac_add_options --enable-hardening
          ac_add_options --enable-stl-hardening
          ac_add_options --enable-jemalloc
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --enable-rust-simd
          ac_add_options --enable-replace-malloc
          ac_add_options --disable-eme
          ac_add_options --enable-jxl
          ac_add_options --enable-raw
          ac_add_options --disable-webrtc
          ac_add_options --allow-addon-sideload
          ac_add_options --with-unsigned-addon-scopes=app,system
          ac_add_options --disable-backgroundtasks
          ac_add_options --disable-bits-download
          ac_add_options --disable-crashreporter
          ac_add_options --disable-default-browser-agent
          ac_add_options --disable-maintenance-service
          ac_add_options --disable-necko-wifi
          ac_add_options --disable-notification-server
          ac_add_options --disable-parental-controls
          ac_add_options --without-onnx-runtime
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --disable-update-agent
          ac_add_options --disable-updater
          mk_add_options MOZ_CRASHREPORTER=0
          mk_add_options MOZ_DATA_REPORTING=0
          mk_add_options MOZ_SERVICES_HEALTHREPORT=0
          mk_add_options MOZ_TELEMETRY_REPORTING=
          export MOZ_CRASHREPORTER=0
          export MOZ_DATA_REPORTING=0
          export MOZ_REQUIRE_SIGNING=
          export MOZ_TELEMETRY_REPORTING=
          export MOZ_PACKAGE_JSSHELL=1
          '@ | Set-Content '.mozconfig-gost'
          Get-Content '.mozconfig-gost'

      - name: Bootstrap build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 --no-interactive bootstrap --application-choice=browser --no-system-changes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY_TOOLCHAIN }}
          components: rust-src

      - name: Pin nightly Rust binaries for Mozilla
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rustc = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN rustc).Trim()
          $cargo = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN cargo).Trim()
          $rustdoc = (rustup which --toolchain $env:NIGHTLY_TOOLCHAIN rustdoc).Trim()
          foreach ($p in @($rustc, $cargo, $rustdoc)) { if (-not (Test-Path $p)) { throw "Pinned Rust tool missing: $p" } }
          "RUSTC=$rustc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO=$cargo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTDOC=$rustdoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $cargoHome = Join-Path $env:RUNNER_TEMP 'cargo-home-win7'
          New-Item -ItemType Directory -Force $cargoHome | Out-Null
          @'
          [unstable]
          build-std = ["std", "panic_abort"]
          '@ | Set-Content -Encoding utf8 (Join-Path $cargoHome 'config.toml')
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $rustc --version --verbose
          & $cargo --version --verbose
          $cfg = & $rustc --print cfg --target $env:RUST_TARGET_WIN7 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cfg | Tee-Object -FilePath rust-win7-target-cfg.txt
          if (($cfg -join "`n") -notmatch 'target_vendor="win7"') { throw 'Expected target_vendor="win7" was not reported.' }

      - name: Vendor pinned Rust std dependencies into Mozilla vendor source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sysroot = (& $env:RUSTC --print sysroot).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustLibraryManifest = Join-Path $sysroot 'lib\rustlib\src\rust\library\Cargo.toml'
          if (-not (Test-Path $rustLibraryManifest)) { throw "rust-src library manifest not found: $rustLibraryManifest" }

          $stdVendor = Join-Path $env:RUNNER_TEMP 'rust-std-vendor'
          if (Test-Path $stdVendor) { Remove-Item -Recurse -Force $stdVendor }
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'rust-std-vendor.stdout.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'rust-std-vendor.stderr.log'
          $merged = Join-Path $env:GITHUB_WORKSPACE 'rust-std-vendor.log'
          Remove-Item -Force -ErrorAction SilentlyContinue $stdout,$stderr,$merged

          $args = @(
            'vendor', '--locked', '--versioned-dirs',
            '--manifest-path', $rustLibraryManifest,
            $stdVendor
          )
          $proc = Start-Process -FilePath $env:CARGO -ArgumentList $args -WorkingDirectory $env:RUNNER_TEMP -NoNewWindow -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          if (Test-Path $stdout) { Get-Content $stdout | Tee-Object -FilePath $merged }
          if (Test-Path $stderr) { Get-Content $stderr | Tee-Object -FilePath $merged -Append }
          Write-Host "cargo vendor exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "cargo vendor failed with exit code $($proc.ExitCode); see rust-std-vendor.log" }
          if (-not (Test-Path $stdVendor)) { throw "cargo vendor did not create $stdVendor" }

          $env:RUST_STD_VENDOR = $stdVendor
          @'
          import os
          import shutil
          import tomllib
          from pathlib import Path

          source = Path(os.environ["RUST_STD_VENDOR"])
          dest = Path("third_party/rust")
          report = Path("rust-std-vendor-added.txt")

          def package_id(path: Path):
              with (path / "Cargo.toml").open("rb") as f:
                  package = tomllib.load(f)["package"]
              return package["name"], package["version"]

          existing = {}
          for manifest in dest.glob("*/Cargo.toml"):
              try:
                  existing.setdefault(package_id(manifest.parent), manifest.parent)
              except Exception:
                  pass

          added = []
          reused = []
          for crate in sorted(source.iterdir()):
              if not (crate / "Cargo.toml").is_file():
                  continue
              ident = package_id(crate)
              if ident in existing:
                  reused.append((ident, existing[ident]))
                  continue
              target = dest / f"{ident[0]}-{ident[1]}"
              if target.exists():
                  raise SystemExit(f"vendor merge collision: {target}")
              shutil.copytree(crate, target)
              existing[ident] = target
              added.append((ident, target))

          lines = ["Added rust-src registry dependencies to Mozilla vendor:"]
          lines += [f"ADD {name} {version} -> {path}" for (name, version), path in added]
          lines += ["", "Already present with exact version:"]
          lines += [f"USE {name} {version} -> {path}" for (name, version), path in reused]
          report.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(report.read_text(encoding="utf-8"))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path 'rust-std-vendor-added.txt' -Pattern '^ADD |^USE ' -Quiet)) {
            throw 'Rust std vendor merge produced no registry packages.'
          }

      - name: Patch Mozilla Rust target selection for build-std
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          path = Path(r"build/moz.configure/rust.configure")
          text = path.read_text(encoding="utf-8")
          start_marker = "def rust_target_triple("
          end_marker = '\n\n\nset_config("RUST_TARGET", rust_target_triple)'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("rust_target_triple() start marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("rust_target_triple() end marker not found")
          replacement = '''def rust_target_triple(
              rustc, target, compiler_info, rust_supported_targets, arm_target
          ):
              # r3dfox-gost CI: Cargo -Z build-std supplies the target std library.
              if target.kernel == "WINNT" and target.cpu == "x86_64":
                  return "x86_64-win7-windows-msvc"

              rustc_target = detect_rustc_target(
                  target, compiler_info, arm_target, rust_supported_targets
              )
              assert_rust_compile(target, rustc_target, rustc)
              return rustc_target
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- build\moz.configure\rust.configure
          $patched = [System.IO.File]::ReadAllText('build\moz.configure\rust.configure')
          if (-not $patched.Contains('return "x86_64-win7-windows-msvc"')) { throw 'Win7 Rust target patch verification failed.' }

      - name: GATE - Compile Win7 Rust build-std preflight
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'rust-win7-full-build-preflight'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force (Join-Path $dir 'src') | Out-Null
          @'
          [package]
          name = "win7-preflight"
          version = "0.1.0"
          edition = "2021"
          [workspace]
          [profile.release]
          panic = "abort"
          '@ | Set-Content -Encoding utf8 (Join-Path $dir 'Cargo.toml')
          @'
          use std::sync::{Arc, Condvar, Mutex};
          use std::thread;
          fn main() {
              let pair = Arc::new((Mutex::new(false), Condvar::new()));
              let worker_pair = Arc::clone(&pair);
              let worker = thread::spawn(move || {
                  let (lock, cv) = &*worker_pair;
                  let mut ready = lock.lock().unwrap();
                  *ready = true;
                  cv.notify_one();
              });
              let (lock, cv) = &*pair;
              let mut ready = lock.lock().unwrap();
              while !*ready { ready = cv.wait(ready).unwrap(); }
              drop(ready);
              worker.join().unwrap();
              println!("win7-build-std-preflight-ok");
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $dir 'src\main.rs')
          & $env:CARGO build --release --manifest-path (Join-Path $dir 'Cargo.toml') --target $env:RUST_TARGET_WIN7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $dir "target\$env:RUST_TARGET_WIN7\release\win7-preflight.exe"
          if (-not (Test-Path $exe)) { throw "Win7 preflight EXE was not produced: $exe" }
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure object directory and verify Rust target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $output = .\mach.ps1 configure 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath configure-win7.log
          if ($exitCode -ne 0) { exit $exitCode }
          $joined = $output -join "`n"
          if ($joined -notmatch 'checking for rust target triplet\.\.\.\s+x86_64-win7-windows-msvc') {
            throw 'Configure did not select x86_64-win7-windows-msvc.'
          }

      - name: Build export prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          if (-not (Test-Path $mozmake)) { throw "mozmake.exe was not found at $mozmake" }
          & $mozmake -C 'obj-gost-win64' recurse_pre-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $mozmake -C 'obj-gost-win64' recurse_export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Compile Mozilla toolkit Rust target with Win7 std
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          if (-not (Test-Path $mozmake)) { throw "mozmake.exe was not found at $mozmake" }
          & $mozmake -C 'obj-gost-win64' 'toolkit/library/rust/target-objects'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Compile security manager SSL target objects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mozmake = Join-Path $env:USERPROFILE '.mozbuild\mozmake\mozmake.exe'
          & $mozmake -C 'obj-gost-win64' 'security/manager/ssl/target-objects'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Require large active pagefile
        shell: powershell
        run: |
          $activeMB = (Get-CimInstance Win32_PageFileUsage | Measure-Object -Property AllocatedBaseSize -Sum).Sum
          if ($null -eq $activeMB) { $activeMB = 0 }
          if ($activeMB -lt 20480) { throw "Full build blocked: active pagefile is only $activeMB MB." }

      - name: Build release r3dfox
        id: build-release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GATE - Verify CryptoPro XPI in real dist/bin
        if: steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $distXpi = "obj-gost-win64\dist\bin\distribution\extensions\$env:EXTENSION_ID.xpi"
          if (-not (Test-Path $distXpi)) { throw "CryptoPro XPI missing from real dist/bin: $distXpi" }
          $distHash = (Get-FileHash -Algorithm SHA256 $distXpi).Hash.ToLowerInvariant()
          if ($distHash -ne $env:CRYPTOPRO_SELECTED_SHA256) {
            throw "dist/bin XPI hash mismatch: expected $env:CRYPTOPRO_SELECTED_SHA256 got $distHash"
          }
          python -c "import json,zipfile; p=r'$distXpi'; z=zipfile.ZipFile(p); m=json.loads(z.read('manifest.json')); i=m.get('browser_specific_settings',{}).get('gecko',{}).get('id') or m.get('applications',{}).get('gecko',{}).get('id'); assert i==r'$env:EXTENSION_ID', (i, r'$env:EXTENSION_ID'); print('dist-id='+i+' version='+str(m.get('version')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release r3dfox
        id: package-release
        if: steps.build-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\mach.ps1 package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem 'obj-gost-win64\dist' -File |
            Where-Object { $_.Name -match '\.(zip|7z)$' -or $_.Name -like '*.installer.exe' } |
            Select-Object FullName,Length | Format-Table -AutoSize

      - name: GATE - Verify CryptoPro XPI in final portable archive
        if: steps.package-release.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'obj-gost-win64\dist'
          $archive = Get-ChildItem $dist -File |
            Where-Object { $_.Extension -in @('.7z', '.zip') } |
            Sort-Object @{Expression={ if ($_.Extension -eq '.7z') { 0 } else { 1 } }}, Name |
            Select-Object -First 1
          if (-not $archive) { throw 'No portable .7z or .zip package was produced.' }

          $extract = Join-Path $env:RUNNER_TEMP 'cryptopro-package-extract'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Force $extract | Out-Null

          if ($archive.Extension -eq '.zip') {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          } else {
            $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
            if (-not $sevenZip) {
              $candidate = 'C:\Program Files\7-Zip\7z.exe'
              if (Test-Path $candidate) { $sevenZip = $candidate }
            }
            if (-not $sevenZip) { throw '7z.exe was not found for final package verification.' }
            & $sevenZip x -y "-o$extract" $archive.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $expectedSuffix = "\distribution\extensions\$env:EXTENSION_ID.xpi"
          $matches = @(Get-ChildItem $extract -Recurse -File -Filter "$env:EXTENSION_ID.xpi" |
            Where-Object { $_.FullName.EndsWith($expectedSuffix, [System.StringComparison]::OrdinalIgnoreCase) })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one packaged CryptoPro XPI under distribution\extensions; found $($matches.Count)."
          }
          $packagedHash = (Get-FileHash -Algorithm SHA256 $matches[0].FullName).Hash.ToLowerInvariant()
          if ($packagedHash -ne $env:CRYPTOPRO_SELECTED_SHA256) {
            throw "Packaged XPI hash mismatch: expected $env:CRYPTOPRO_SELECTED_SHA256 got $packagedHash"
          }
          Copy-Item -Force $matches[0].FullName cryptopro-packaged.xpi
          "archive=$($archive.Name)" | Set-Content -Encoding utf8 cryptopro-package-evidence.txt
          "path=$($matches[0].FullName.Substring($extract.Length))" | Add-Content -Encoding utf8 cryptopro-package-evidence.txt
          "sha256=$packagedHash" | Add-Content -Encoding utf8 cryptopro-package-evidence.txt
          Get-Content cryptopro-package-evidence.txt

      - name: Upload CryptoPro packaged browser
        if: always() && steps.package-release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: r3dfox-cryptopro-mozilla-packaging
          if-no-files-found: error
          compression-level: 0
          path: |
            obj-gost-win64/dist/*.zip
            obj-gost-win64/dist/*.7z
            obj-gost-win64/dist/*.installer.exe

      - name: Upload CryptoPro packaging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptopro-mozilla-packaging-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            cryptopro-extension-selection.json
            cryptopro-package-evidence.txt
            cryptopro-packaged.xpi
            rust-win7-target-cfg.txt
            rust-std-vendor.log
            rust-std-vendor.stdout.log
            rust-std-vendor.stderr.log
            rust-std-vendor-added.txt
            configure-win7.log
