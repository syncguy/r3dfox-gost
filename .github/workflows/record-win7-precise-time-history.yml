name: Record Win7 precise-time experiment history
# Existing-workflow push intentionally triggers this one-shot recorder.

on:
  push:
    branches:
      - agent/gost-tls-poc
    paths:
      - ".github/workflows/record-win7-precise-time-history.yml"

permissions:
  contents: write

jobs:
  record-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/gost-tls-poc

      - name: Update project evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_log = Path('docs/gost/TEST_LOG.md')
          state = Path('docs/gost/PROJECT_STATE.md')
          workflows = Path('docs/gost/WORKFLOWS.md')

          log_text = test_log.read_text(encoding='utf-8')
          if '32695496647' not in log_text:
              log_text += r'''

---

## 2026-08-23/24 — GetSystemTimePreciseAsFileTime: discovery, smoke closure, and xul-scale closure

**Track:** Windows Vista/7 build compatibility  
**Branch:** `agent/gost-tls-poc`

### Event chain

1. **Run `32647338452`, job `97213486474`, commit `0eb29ecccaa3d2a0762af17e458c42cf245410d7`.** The full Firefox build/package succeeded with the narrow ProcessPrng strategy. The exact xul import audit then identified the next hard direct blocker: `KERNEL32.dll!GetSystemTimePreciseAsFileTime`, a Windows-8+ API.
2. **Commit `b3c3d3b00c6e4a76fbfaa615b9104828c26e78ba`.** The first attempt to add precise-time members directly to the full workflow had the correct narrow-provider intent but corrupted embedded-Python `\n` literals into physical YAML-breaking line breaks. It is not experimental proof.
3. **Run `32692410607`, commit `08203bb0d7023b7186dc11e4d765f0349aadf076`.** GitHub rejected `.github/workflows/gost-poc-build-thunk.yml` around line 446 before creating a build job, confirming the YAML corruption.
4. **Run `32680494331`, job `97296220325`, commit `cdef097b1912f68232de13d5e41b1a84add466d6`.** The focused `YY-Thunks precise-time closing smoke` passed on its first attempt. It selected `GetSystemTimePreciseAsFileTime.obj`, `GetSystemTimePreciseAsFileTime.obi`, and `YY_Thunks_for_6.1.7600.0.obj`, verified both COFF weak aliases, rejected broad ordinary surface, linked a representative Rust raw-dylib probe without complete YY `kernel32.lib`, and removed `GetSystemTimePreciseAsFileTime` from the final PE imports while keeping `LockResource` as a normal KERNEL32 positive control.
5. **Run `32695496647`, job `97336702701`, commit `ae3d52f42b8b6b509c1263418bead8bb9324dd00`.** Full xul-scale integration completed narrow-provider construction, libxul patching, full release build, package, release upload, import audit, and diagnostics upload. Release artifact: `9512347999`; diagnostics artifact: `9512349511`. Only the final policy gate failed.

### Run 32695496647 evidence

The diagnostics establish that `GetSystemTimePreciseAsFileTime` is absent from the final xul direct-import list and absent from the raw `dumpbin /imports` text. `ProcessPrng`, `WaitOnAddress`, `WakeByAddressAll`, `WakeByAddressSingle`, and `GetOverlappedResultEx` are also absent from the checked direct-import set.

`xul-thunk-win7-forbidden-direct-imports.txt` contains exactly `GetQueuedCompletionStatusEx`. That symbol is a genuine direct KERNEL32 import in this `xul.dll`, but the gate classification was wrong: Microsoft documents `GetQueuedCompletionStatusEx` with minimum supported client Windows Vista. It is therefore valid on Windows 7 and is not a Win8+ loader blocker.

The direct-import conclusion is reliable. A separate diagnostics limitation was also found: `dumpbin` formats delay-load API lines differently from ordinary import lines. The workflow correctly switches direct/delay sections and records delay DLL names, but the API-name regex used by `ae3d52f4...` only matches the ordinary-import line shape. Consequently `xul-thunk-win7-delay-import-api-names.txt` is empty and must not be interpreted as evidence that the binary has no delay-loaded APIs. Re-parsing the retained raw dump with the delay-load line shape yields 504 unique delay API names, including known post-Win7 candidates such as `GetAutoRotationState`, `GetPointerFrameTouchInfo`, `GetPointerType`, `CoIncrementMTAUsage`, `RoActivateInstance`, `RoGetActivationFactory`, and Windows string APIs. This diagnostics limitation does not affect the direct-import gate or the conclusion about precise-time closure.

### Conclusion and follow-up

The narrow ProcessPrng + precise-time strategy is now proven at Firefox `xul.dll` build/package scale. The previous hard blocker `GetSystemTimePreciseAsFileTime` is closed at the direct PE-import level. This is not Windows 7 runtime proof.

Commit `e2a9c3bcbbdfade62a15a144da9117e249cc6305` removes only the Vista-supported `GetQueuedCompletionStatusEx` false positive from the Win8+ hard blacklist; the linker strategy is unchanged. The next full result should validate the corrected direct-import gate. After that, fix/replay the delay-load API parser before using delay-load diagnostics for runtime-path conclusions.

This result is independent from the GOST TLS runtime blocker `SEC_E_INVALID_TOKEN`.
'''
              test_log.write_text(log_text, encoding='utf-8', newline='\n')

          state_text = state.read_text(encoding='utf-8')
          state_text = state_text.replace('Last updated: 2026-08-23', 'Last updated: 2026-08-24', 1)
          marker = '## Separation of conclusions\n'
          if '### Win7 xul-scale update — 2026-08-24' not in state_text:
              update = r'''### Win7 xul-scale update — 2026-08-24

Actions run `32695496647`, job `97336702701`, commit `ae3d52f42b8b6b509c1263418bead8bb9324dd00` proves that the narrow YY-Thunks ProcessPrng + `GetSystemTimePreciseAsFileTime` provider scales through Firefox's real `xul.dll` build and package. The previous Windows-8-only direct blocker `GetSystemTimePreciseAsFileTime` is absent from the produced xul direct imports. The complete YY `kernel32.lib` remains excluded from broad interposition and Firefox stays on `/MD`.

The run's red final status was a policy false positive: its only listed direct blocker was `GetQueuedCompletionStatusEx`, which Microsoft supports from Windows Vista. Commit `e2a9c3bcbbdfade62a15a144da9117e249cc6305` removes only that API from the Win8+ blacklist without changing the linker strategy.

Direct-import parsing is usable for the current loader-hard gate. Delay-load API parsing in the `ae3d52f4...` workflow is incomplete because delay API rows have a different `dumpbin` shape; the empty generated delay API-name file is not proof of absence. Raw diagnostics retain the information needed for a corrected replay. Fix/replay that parser before drawing runtime-path conclusions from delay-loaded post-Win7 APIs.

Next Win7 step: obtain the corrected direct-gate full-run result. If direct Windows-8+ blockers remain absent, proceed to corrected delay-load analysis and then actual Windows 7 execution/runtime validation. None of this changes the separate GOST TLS `SEC_E_INVALID_TOKEN` blocker.

'''
              if marker not in state_text:
                  raise SystemExit('PROJECT_STATE marker not found')
              state_text = state_text.replace(marker, update + marker, 1)
          state.write_text(state_text, encoding='utf-8', newline='\n')

          wf_text = workflows.read_text(encoding='utf-8')
          start = wf_text.find('## Current full-scale thunk experiment\n')
          end = wf_text.find('## Terminology rule\n', start)
          if start < 0 or end < 0:
              raise SystemExit('WORKFLOWS section markers not found')
          current = r'''## Current full-scale thunk experiment

The current full-scale Windows 7 line uses `.github/workflows/gost-poc-build-thunk.yml` with YY-Thunks 1.2.2 `synchronization.lib` plus a physically narrow provider for ProcessPrng and `GetSystemTimePreciseAsFileTime`. Complete YY `kernel32.lib` is only a source archive for selected members and must not be broadly interposed before Rust/gkrust.

Run `32695496647`, job `97336702701`, commit `ae3d52f42b8b6b509c1263418bead8bb9324dd00` completed the full build/package and removed `GetSystemTimePreciseAsFileTime` from xul's direct imports. Its final red status came only from the incorrect classification of Vista-supported `GetQueuedCompletionStatusEx`; commit `e2a9c3bcbbdfade62a15a144da9117e249cc6305` corrects that policy entry without altering linker behavior.

The workflow distinguishes direct and delay-load sections, but the delay API-name regex in `ae3d52f4...` does not yet match `dumpbin`'s delay-load row format. Therefore the direct-import gate is meaningful, while an empty delay API-name file is not. The raw `xul-thunk-win7-imports.txt` must be retained and the delay parser corrected before delay-loaded APIs are treated as fully audited.

This workflow remains evidence only for the Windows Vista/7 compatibility track and does not establish GOST TLS handshake success.

'''
          wf_text = wf_text[:start] + current + wf_text[end:]
          workflows.write_text(wf_text, encoding='utf-8', newline='\n')
          PY

          git diff --check -- docs/gost/TEST_LOG.md docs/gost/PROJECT_STATE.md docs/gost/WORKFLOWS.md
          grep -F '32695496647' docs/gost/TEST_LOG.md
          grep -F 'delay API-name file' docs/gost/WORKFLOWS.md

      - name: Commit documentation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/record-win7-precise-time-history.yml
          git add docs/gost/TEST_LOG.md docs/gost/PROJECT_STATE.md docs/gost/WORKFLOWS.md
          git commit -m "docs: record xul precise-time closure"
          git push origin HEAD:agent/gost-tls-poc
