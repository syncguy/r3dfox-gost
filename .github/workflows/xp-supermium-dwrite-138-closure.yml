            '',
            "Source asset: $env:SUPERMIUM_TAG / $env:SUPERMIUM_ASSET / SHA256 $env:SUPERMIUM_ASSET_SHA256",
            "Project UCRT: Chuyu-Team/msvcr14x $env:MSVCR14X_SHA",
            '',
            'Run dist/bin/dwrite-loader-smoke.exe unchanged on physical Windows XP SP3 x86.',
