            'DWriteCreateFactory and GetSystemFontCollection must pass.',
            '',
            'This is focused component evidence only. It is not full Firefox XP runtime proof and not GOST TLS evidence.'
          ) | Set-Content -Encoding utf8 (Join-Path $env:CANDIDATE_ROOT 'README.txt')

