          "- Supermium: $env:SUPERMIUM_TAG / $env:SUPERMIUM_ASSET / SHA256 $env:SUPERMIUM_ASSET_SHA256" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- msvcr14x: $env:MSVCR14X_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
